function getExercisePR(exId) {
  var prVal = null;
  allDayKeys().forEach(function(key){
    var r = dayRecord(key);
    var sets = (r.workout || {})[exId] || [];
    sets.forEach(function(s){
      if (s.weight != null && s.reps != null) {
        if (!prVal || s.weight > prVal.weight || (s.weight === prVal.weight && s.reps > prVal.reps)) {
          prVal = { weight: s.weight, reps: s.reps };
        }
      }
    });
  });
  return prVal;
}

function getLastSessionWeightReps(exId, rec) {
  var todaySets = (rec.workout || {})[exId] || [];
  if (todaySets.length > 0) {
    var lastSet = todaySets[todaySets.length - 1];
    return { weight: lastSet.weight, reps: lastSet.reps };
  }

  var keys = allDayKeys().reverse();
  var todayK = todayKey();
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === todayK) continue;
    var r = dayRecord(keys[i]);
    var prevSets = (r.workout || {})[exId] || [];
    if (prevSets.length > 0) {
      return { weight: prevSets[0].weight, reps: prevSets[0].reps };
    }
  }
  return null;
}

function getLastSessionSets(exId, rec) {
  var keys = allDayKeys().reverse();
  var todayK = todayKey();
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === todayK) continue;
    var r = dayRecord(keys[i]);
    var prevSets = (r.workout || {})[exId] || [];
    if (prevSets.length > 0) return prevSets;
  }
  return [];
}

function getWorkoutForDate(dayKey, rec) {
  var d = new Date(dayKey+'T00:00:00').getDay();
  var defaultIndex = null;
  var prior = allDayKeys().filter(function(k){return k < dayKey;});
  var completed = 0;
  prior.forEach(function(k){if(dayRecord(k).workoutDone) completed++;});
  if(completed > 0) defaultIndex = completed % IRON_LOG_PROGRAM.length;
  else defaultIndex = ({1:0,2:1,3:2,5:3,6:4})[d];
  var index = rec && rec.selectedWorkout != null ? rec.selectedWorkout : defaultIndex;
  return {index:index == null ? 0 : index, session:IRON_LOG_PROGRAM[index == null ? 0 : index] || IRON_LOG_PROGRAM[0]};
}

function getCompletedWorkoutCount() {
  var sessions=getWorkoutSessions(), seen={};
  var sessionDays={};
  sessions.forEach(function(s){sessionDays[s.dayKey]=true;if(s.completed) seen[s.id]=true;});
  allDayKeys().forEach(function(key){var r=dayRecord(key);if(r.workoutDone&&!sessionDays[key]) seen['legacy_'+key]=true;});
  return Object.keys(seen).length;
}

function getNextProgramWorkout() {
  var count=getCompletedWorkoutCount(), index=count % IRON_LOG_PROGRAM.length;
  return {index:index, week:Math.floor(count/IRON_LOG_PROGRAM.length)+1, day:index+1, session:IRON_LOG_PROGRAM[index]};
}

function getActiveWorkoutSession(dayKey, programDayIndex) {
  var session=getWorkoutSession(dayKey, programDayIndex);
  if(session) return session;
  return {id:workoutSessionId(dayKey, programDayIndex),dayKey:dayKey,programDay:programDayIndex,programLabel:(IRON_LOG_PROGRAM[programDayIndex]||{}).label||'Workout',exercises:[],status:'not_started'};
}

function getSessionMeta(rec, programDayIndex) {
  rec.workoutMetaBySession=rec.workoutMetaBySession||{};
  return rec.workoutMetaBySession[String(programDayIndex)]||(rec.workoutMetaBySession[String(programDayIndex)]={});
}

function chooseWorkoutForDate(dayKey) {
  var rec=dayRecord(dayKey), overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Choose workout</div>'
    +IRON_LOG_PROGRAM.map(function(s,i){return '<button class="btn workout-choice" data-workout="'+i+'" style="text-align:left;margin-top:8px">'+esc(s.label)+'</button>';}).join('')
    +'<button class="btn" id="cancelWorkoutChoice" style="margin-top:12px">Cancel</button></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelWorkoutChoice').onclick=function(){overlay.remove();};
  overlay.querySelectorAll('.workout-choice').forEach(function(btn){btn.onclick=function(){rec.selectedWorkout=parseInt(btn.dataset.workout,10);saveDayRecord(dayKey,rec);overlay.remove();renderGym();};});
}

function renderGym() {
  var key=todayKey(), rec=dayRecord(key);
  var tdays = profile.trainingDays||[1,3,5];
  var today = new Date();
  var isTrainingDay = tdays.includes(today.getDay());
  var dayNames = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  var dayName = dayNames[today.getDay()];

  if(!isTrainingDay && rec.selectedWorkout == null) {
    var nextNames = ['sun','mon','tue','wed','thu','fri','sat'];
    var nextDay = '—';
    for(var i=1;i<=7;i++){
      var nd = addDays(today,i);
      if(tdays.includes(nd.getDay())){ nextDay = nextNames[nd.getDay()]; break; }
    }
    var routineManagerHTML = (profile.programSplit === '5day' || profile.programSplit === '6day')
      ? '<button class="btn btn-primary" id="manageRoutineRestBtn" style="width:100%;margin-top:8px">Manage custom routines</button>' : '';
    document.getElementById('content').innerHTML =
      '<div class="topbar"><div><span class="eyebrow">'+personalizedEyebrow(dayName)+'</span><div class="title">Gym</div></div></div>'
      +'<div class="rest-day">'+ic('moon','32')+'<div class="rest-label">Rest day</div><div class="small dim">Next: '+nextDay+'</div><button class="btn btn-primary" id="chooseRestWorkout">Choose workout</button></div>'
      +routineManagerHTML
      +'<div class="section"><span class="eyebrow">weekly volume targets</span>'+buildVolumeTable()+'</div>';
    var manageRoutineRestBtn = document.getElementById('manageRoutineRestBtn');
    if(manageRoutineRestBtn) manageRoutineRestBtn.addEventListener('click', openCustomRoutineManager);
    document.getElementById('chooseRestWorkout').addEventListener('click',function(){chooseWorkoutForDate(key);});
    return;
  }

  var selected = getWorkoutForDate(key, rec);
  var session = selected.session;
  var totalPlanned = session.exercises.reduce(function(total, ex){ return total + (ex.sets || 0); }, 0);
  var loggedTotal = session.exercises.reduce(function(total, ex){
    var actualId=(rec.swaps&&rec.swaps[ex.id])||ex.id;
    return total + ((rec.workout||{})[actualId]||[]).filter(Boolean).length;
  }, 0);
  var sessionComplete = totalPlanned > 0 && loggedTotal >= totalPlanned;
  var customMode = profile.programSplit === '5day' || profile.programSplit === '6day';
  var addExerciseHTML = customMode ? '<button class="btn btn-primary" id="addRoutineExerciseBtn" style="width:100%;margin-bottom:12px">'+ic('plus')+' Add exercise to today</button>' : '';
  var emptyRoutineHTML = customMode && !session.exercises.length
    ? '<div class="rest-day"><div class="rest-label">No exercises yet</div><div class="small dim">Add your trainer’s routine for today, then log each set manually.</div></div>'
    : '';
  var exHTML = session.exercises.map(function(exOrig, exIndex){
    var exId = (rec.swaps && rec.swaps[exOrig.id]) ? rec.swaps[exOrig.id] : exOrig.id;
    var ex = getExerciseData(exId) || exOrig;
    var sets = (rec.workout||{})[ex.id]||[];
    var drafts = (rec.workoutDraft||{})[ex.id]||[];
    var lastSets = getLastSessionSets(ex.id, rec);
    var plannedCount = ex.sets || exOrig.sets;
    var visibleCount = Math.max(plannedCount, sets.length, drafts.length);
    var plannedRows = Array.from({length: visibleCount}, function(_,i){
      var logged=sets[i], draft=drafts[i], last=lastSets[i];
      var valueW = logged ? logged.weight : (draft ? draft.weight : (last ? last.weight : ''));
      var valueR = logged ? logged.reps : (draft ? draft.reps : (last ? last.reps : ''));
      var valueRir = logged ? logged.rir : (draft ? draft.rir : null);
      var loggedHtml=logged
        ? '<span class="set-complete">✓</span><button class="btn-ghost" data-delete-set="'+ex.id+'" data-set-index="'+i+'" aria-label="Remove set">×</button>'
        : '<button class="btn btn-primary btn-sm" data-logset="'+ex.id+'" data-set-index="'+i+'">Log</button>';
      var rirOptions='<option value="">RIR / effort</option><option value="3" '+(valueRir===3?'selected':'')+'>3 RIR</option><option value="2" '+(valueRir===2?'selected':'')+'>2 RIR</option><option value="1" '+(valueRir===1?'selected':'')+'>1 RIR</option><option value="0" '+(valueRir===0?'selected':'')+'>Failure</option>';
      return '<div class="planned-set"><span class="set-number">'+(i+1)+'</span><input type="number" step="0.25" min="0" placeholder="kg" aria-label="Weight for set '+(i+1)+'" class="set-weight" data-ex="'+ex.id+'" data-set-index="'+i+'" value="'+valueW+'" inputmode="decimal"><input type="number" min="1" max="50" placeholder="reps" aria-label="Reps for set '+(i+1)+'" class="set-reps" data-ex="'+ex.id+'" data-set-index="'+i+'" value="'+valueR+'" inputmode="numeric"><select class="set-rir" data-ex="'+ex.id+'" data-set-index="'+i+'" aria-label="Effort for set '+(i+1)+'">'+rirOptions+'</select>'+loggedHtml+(logged?'':'<button class="btn-ghost" data-remove-draft="'+ex.id+'" data-set-index="'+i+'" aria-label="Remove set">×</button>')+'</div>';
    }).join('');
    var best = getBestE1RM(ex.id);
    
    var targetSets = ex.sets||exOrig.sets;
    var repsStr = ex.reps||exOrig.reps;
    var topRep = getTopRepRange(repsStr);
    var completedSets = sets.filter(Boolean);
    var hitTop = completedSets.length >= targetSets && completedSets.slice(0, targetSets).every(function(s){ return Number(s.reps) >= topRep; });
    var progressionPrompt = hitTop ? '<div class="progression-tip" style="color:var(--sage-light);font-size:12px;margin-top:6px;font-family:\'Space Mono\',monospace">🎉 Top range hit! Add load & reset reps.</div>' : '';
    var lastSummary = lastSets.length ? 'Last: <strong>'+lastSets.map(function(s){return s.weight+' × '+s.reps;}).join(', ')+'</strong> · target '+(lastSets[lastSets.length-1].weight||'—')+' × '+topRep : 'No previous session yet';
    
    var isCompound = ex.type === 'compound' || exOrig.type === 'compound';
    var warmUpLink = isCompound ? '<button class="btn-ghost warm-up-btn" data-exname="'+esc(ex.name)+'" data-exid="'+esc(ex.id)+'" style="font-size:10px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer">Warm Up</button>' : '';

    var pr = getExercisePR(ex.id);
    var prStr = pr ? ' · ' + ic('trophy', 11) + ' PR: ' + pr.weight + 'kg × ' + pr.reps : '';

    var noteVal = esc((profile.exerciseNotes && profile.exerciseNotes[ex.id]) || '');
    var noteInputHTML = '<div class="ex-note-row" style="margin-top:10px; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px; display:flex; align-items:center; gap:6px">'
      + ic('note', 12)
      + '<input type="text" class="ex-note-input" data-ex="'+esc(ex.id)+'" value="'+noteVal+'" placeholder="Add technique cues (e.g. elbows in, keep chest up...)" style="font-size:11px; color:var(--text-secondary); background:transparent; border:none; padding:2px 0; width:100%">'
      + '</div>';

    var routineRemoveLink = customMode ? '<button class="btn-ghost remove-routine-btn" data-exid="'+ex.id+'" style="font-size:10px;padding:2px 6px;color:var(--rust-light);margin-left:6px">Remove</button>' : '';
    var swapLink = customMode ? '' : '<button class="alt-chip swap-btn" data-swap-orig="'+exOrig.id+'" data-swap-curr="'+ex.id+'" data-muscle="'+exOrig.muscle+'" title="Swap exercise">Alt</button>';
    var detailsLink = '';
    var exerciseExtra = '<div class="exercise-extra">'
      +'<div class="exercise-cue">'+esc(ex.cue||exOrig.cue)+(best?' · best e1RM: '+best.toFixed(1)+'kg':'') + prStr + '</div>'
      +'<div class="set-list"><div class="small dim">Planned '+plannedCount+' sets · '+esc(ex.reps||exOrig.reps)+' reps</div>'+plannedRows+'<button class="btn btn-sm" data-add-set="'+ex.id+'" style="margin-top:8px">+ Add set</button></div>'
      +(sets.length ? '<div class="set-chips">'+sets.map(function(s,i){var effort=s.rir===0?'failure':(s.rir!=null?s.rir+' RIR':'');return '<span class="set-chip">'+s.weight+'kg × '+s.reps+(effort?' · '+effort:'')+' <button class="btn-ghost" data-edit-set="'+ex.id+'" data-set-index="'+i+'" aria-label="Edit set">edit</button><button class="btn-ghost" data-delete-set="'+ex.id+'" data-set-index="'+i+'" aria-label="Delete set">×</button></span>';}).join('')+'</div>' : '')
      +progressionPrompt
      +'<div style="display:flex;align-items:center;gap:8px;margin-top:10px">'+warmUpLink+routineRemoveLink+noteInputHTML+'</div>'
      +'</div>';
    var earlierIncomplete = session.exercises.slice(0,exIndex).some(function(previous){
      var previousId=(rec.swaps&&rec.swaps[previous.id])||previous.id;
      return ((rec.workout||{})[previousId]||[]).filter(Boolean).length < (previous.sets||0);
    });
    return '<div class="exercise-card '+(completedSets.length>=targetSets?'completed-card ':'')+(!earlierIncomplete&&completedSets.length<targetSets?'active-card':'')+'" id="excard-'+ex.id+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        +'<div style="min-width:0"><div class="exercise-name" style="display:flex;align-items:center;flex-wrap:wrap">'+esc(ex.name)+'<span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:6px">'+(ex.sets||exOrig.sets)+'×'+esc(ex.reps||exOrig.reps)+(customMode?'':' · '+esc(ex.rir||exOrig.rir)+' RIR')+'</span>'+swapLink+'</div><div class="last-session-line">'+lastSummary+'</div><div class="logged-count">'+sets.length+' set'+(sets.length===1?'':'s')+' logged '+detailsLink+'</div></div>'
      +'</div>'
      +exerciseExtra
    +'</div>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="gym-page">'
    +'<div class="gym-session-header"><div class="gym-session-top"><div><span class="eyebrow">'+personalizedEyebrow(session.label)+'</span><div class="title">Gym</div></div><div class="gym-session-meta"><span id="gymSetProgress">'+loggedTotal+' / '+totalPlanned+' sets</span><button class="btn btn-sm" id="chooseWorkoutBtn">Change</button></div></div><div class="gym-progress"><i style="width:'+Math.min(100,Math.round(loggedTotal/Math.max(1,totalPlanned)*100))+'%"></i></div><div class="session-timer" id="sessionTimer"></div></div>'
    +'<div class="workout-picker">'+IRON_LOG_PROGRAM.map(function(s,i){return '<button class="chip '+(i===selected.index?'active':'')+'" data-pick-workout="'+i+'">'+esc(s.label.split('·')[0].trim())+'</button>';}).join('')+'</div>'
    +addExerciseHTML
    +emptyRoutineHTML
    +exHTML+'</div><div id="restTimerWrap"></div>';

  attachGymEvents(key, rec, session, selected.index);
  renderWorkoutTimer(key, rec, session, selected.index);
}

function renderWorkoutTimer(dayKey, rec, session, programDayIndex) {
  var wrap=document.getElementById('sessionTimer'); if(!wrap) return;
  var meta=getSessionMeta(rec, programDayIndex);
  if(!meta.startedAt) {
    wrap.innerHTML='<span class="small dim">No session time yet</span><span class="timer-actions"><button class="btn btn-primary btn-sm" id="startWorkoutBtn">Start</button><button class="btn btn-sm" id="manualDurationBtn">Enter time</button></span>';
    document.getElementById('startWorkoutBtn').onclick=function(){startWorkoutSession(dayKey,session,programDayIndex);};
    document.getElementById('manualDurationBtn').onclick=function(){setManualSessionDuration(dayKey,session,programDayIndex);};
    return;
  }
  if(meta.completedAt) {
    wrap.innerHTML='<span><strong>'+formatDuration(meta.durationMinutes||Math.round(workoutElapsed(meta)/60))+'</strong><span class="small dim"> total</span></span><span class="timer-actions"><span class="small dim">Saved</span><button class="btn btn-sm" id="editDurationBtn">Edit</button></span>';
    document.getElementById('editDurationBtn').onclick=function(){setManualSessionDuration(dayKey,session,programDayIndex);};
    return;
  }
  var doneCount = session.exercises.reduce(function(total, ex){
    var actualId=(rec.swaps&&rec.swaps[ex.id])||ex.id;
    return total+((rec.workout||{})[actualId]||[]).filter(Boolean).length;
  },0);
  var plannedCount = session.exercises.reduce(function(total, ex){return total+(ex.sets||0);},0);
  var canFinish = doneCount >= plannedCount;
  wrap.innerHTML='<span><strong id="workoutElapsed">'+formatDuration(Math.floor(workoutElapsed(meta)/60))+'</strong><span class="small dim"> session</span></span><span class="timer-actions">'+(canFinish?'<button class="btn btn-primary btn-sm" id="endWorkoutBtn">Finish</button>':'<span class="small dim">Keep logging</span>')+'</span>';
  var endButton=document.getElementById('endWorkoutBtn');
  if(endButton) endButton.onclick=function(){
    var hasSets=Object.keys(rec.workout||{}).some(function(id){return (rec.workout[id]||[]).some(Boolean);});
    if(!hasSets&&!confirm('No sets are logged. End this session anyway?')) return;
    endWorkoutSession(dayKey, programDayIndex, session);
  };
  if(!meta.completedAt) {
    if(workoutTimer.interval) clearInterval(workoutTimer.interval);
    workoutTimer.interval=setInterval(function(){var el=document.getElementById('workoutElapsed');if(el){var seconds=workoutElapsed(meta);el.textContent=Math.floor(seconds/60)+':'+pad(seconds%60);}},1000);
  }

  function renderRestTimer() {
    var wrap=document.getElementById('restTimerWrap');
    if(!wrap) return;
    if(!restTimer.remaining){wrap.innerHTML='';return;}
    wrap.innerHTML='<div class="rest-bar"><span><span class="small dim">Rest</span><br><strong>'+formatDuration(Math.ceil(restTimer.remaining/60))+'</strong></span><button class="btn btn-primary" id="skipRestBtn">Skip</button></div>';
    document.getElementById('skipRestBtn').onclick=function(){clearInterval(restTimer.interval);restTimer.remaining=0;renderRestTimer();};
  }

  function startRestTimer(seconds) {
    clearInterval(restTimer.interval);
    restTimer.remaining=seconds||90;
    renderRestTimer();
    restTimer.interval=setInterval(function(){
      restTimer.remaining--;
      if(restTimer.remaining<=0){clearInterval(restTimer.interval);restTimer.remaining=0;}
      renderRestTimer();
    },1000);
  }
}

  document.querySelectorAll('[data-logset]').forEach(function(btn){
    btn.addEventListener('click', function(){
      triggerHaptic();
      var id = btn.dataset.logset;
      var setIndex = parseInt(btn.dataset.setIndex,10);
      var wEl = document.querySelector('.set-weight[data-ex="'+id+'"][data-set-index="'+setIndex+'"]');

        return (rec.workout[workoutId]||[]).some(Boolean);
      });
      if(!sessionMeta.startedAt) sessionMeta.startedAt=new Date().toISOString();
      if(!hadLoggedSets) sessionMeta.firstSetAt=new Date().toISOString();
      sessionMeta.lastSetAt=new Date().toISOString();
      sessionMeta.sessionLabel=session.label;
      rec.workout[id][setIndex] = {weight:w,reps:r,rir:rirValue};
      if (rec.workoutDraft[id]) delete rec.workoutDraft[id][setIndex];
      sessionMeta.updatedAt=new Date().toISOString();
      // Check if all exercises done (2+ sets each)
      var allDone = session.exercises.every(function(ex){var actualId=(rec.swaps&&rec.swaps[ex.id])||ex.id;return (rec.workout[actualId]||[]).filter(Boolean).length>=(ex.sets||2);});
      if(allDone && !rec.workoutDone){
        rec.workoutDone=true; profile.xp=(profile.xp||0)+30; sv('rg_profile',profile);
        showToast('Session complete! +30 XP 🎉','ok');
      } else {
        profile.xp=(profile.xp||0)+3; sv('rg_profile',profile);
      }
      saveDayRecord(key,rec);
      renderGym();
      if(navigator.vibrate) navigator.vibrate(35);
      var loggedExercise=getExerciseData(id)||{};
      startRestTimer(loggedExercise.rest||90);
    });
  });

  document.querySelectorAll('.set-weight,.set-reps,.set-rir').forEach(function(input){
    input.addEventListener('input', function(){
      var draftRec=dayRecord(key), id=input.dataset.ex, index=parseInt(input.dataset.setIndex,10);
      draftRec.workoutDraft=draftRec.workoutDraft||{};
      draftRec.workoutDraft[id]=draftRec.workoutDraft[id]||[];
      var row={
        weight: parseFloat(document.querySelector('.set-weight[data-ex="'+id+'"][data-set-index="'+index+'"]').value)||'',
        reps: parseInt(document.querySelector('.set-reps[data-ex="'+id+'"][data-set-index="'+index+'"]').value,10)||'',
        rir: (document.querySelector('.set-rir[data-ex="'+id+'"][data-set-index="'+index+'"]').value || null)
      };
      draftRec.workoutDraft[id][index]=row;
      saveDayRecord(key,draftRec);
    });
  });

  document.querySelectorAll('[data-add-set]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var draftRec=dayRecord(key), id=btn.dataset.addSet;
      draftRec.workoutDraft=draftRec.workoutDraft||{};
      draftRec.workoutDraft[id]=draftRec.workoutDraft[id]||[];
      var count=Math.max((draftRec.workout&&draftRec.workout[id]||[]).length,draftRec.workoutDraft[id].length);
      draftRec.workoutDraft[id][count]={weight:'',reps:'',rir:null};
      saveDayRecord(key,draftRec);
      renderGym();
    });
  });

  document.querySelectorAll('[data-remove-draft]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var draftRec=dayRecord(key), id=btn.dataset.removeDraft, index=parseInt(btn.dataset.setIndex,10);
      if(draftRec.workoutDraft&&draftRec.workoutDraft[id]){
        draftRec.workoutDraft[id].splice(index,1);
        saveDayRecord(key,draftRec);
        renderGym();
      }
    });
  });

  document.querySelectorAll('.swap-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openSwapSheet(btn.dataset.swapOrig, btn.dataset.swapCurr, btn.dataset.muscle, key);
    });
  });

  document.querySelectorAll('[data-delete-set]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var current=dayRecord(key), id=btn.dataset.deleteSet, index=parseInt(btn.dataset.setIndex,10);
      if(current.workout && current.workout[id]) { current.workout[id].splice(index,1); current.workoutDone=false; saveDayRecord(key,current); renderGym(); }
    });
  });
  document.querySelectorAll('[data-edit-set]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var current=dayRecord(key), id=btn.dataset.editSet, index=parseInt(btn.dataset.setIndex,10), set=current.workout&&current.workout[id]&&current.workout[id][index];
      if(!set) return;
      var weight=prompt('Weight (kg)',set.weight), reps=prompt('Reps',set.reps), effort=prompt('RIR (0 = failure, blank = not logged)',set.rir===0?'0':(set.rir==null?'':set.rir));
      if(weight===null||reps===null||effort===null) return;
      var w=parseFloat(weight), r=parseInt(reps,10);
      if(!w||!r||w<=0||r<=0){showToast('Enter valid weight and reps','warn');return;}
      var rir=effort.trim()===''?null:parseInt(effort,10);
      if(rir!==null&&(isNaN(rir)||rir<0||rir>3)){showToast('RIR must be blank or 0 to 3','warn');return;}
      current.workout[id][index]={weight:w,reps:r,rir:rir}; saveDayRecord(key,current); renderGym();
    });
  });
}

function workoutElapsed(meta) {
  if(!meta || !meta.startedAt) return 0;
  var start = meta.firstSetAt || meta.startedAt;
  var end = meta.completedAt || meta.lastSetAt || new Date().toISOString();
  return Math.max(0, Math.floor((new Date(end).getTime()-new Date(start).getTime())/1000));
}

function formatDuration(minutes) {
  var total=Math.max(0,Number(minutes)||0);
  return Math.floor(total/60)+':'+pad(total%60);
}

function startWorkoutSession(dayKey, session, programDayIndex) {
  var rec=dayRecord(dayKey);
  var meta=getSessionMeta(rec, programDayIndex);
  if(!meta.startedAt) {
    meta.startedAt=new Date().toISOString();
    meta.sessionLabel=session.label;
    saveDayRecord(dayKey,rec);
  }
  renderGym();
}

function endWorkoutSession(dayKey, programDayIndex, session) {
  var rec=dayRecord(dayKey);
  var meta=getSessionMeta(rec, programDayIndex);
  if(!meta.startedAt || meta.completedAt) return;
  meta.completedAt=new Date().toISOString();
  rec.workoutDone=true;
  var sessionEnd=meta.lastSetAt||meta.completedAt;
  var sessionStart=meta.firstSetAt||meta.startedAt;
  meta.durationMinutes=Math.max(1,Math.round((new Date(sessionEnd).getTime()-new Date(sessionStart).getTime())/60000));
  saveDayRecord(dayKey,rec);
  if(workoutTimer.interval) clearInterval(workoutTimer.interval);
  renderGym();
  showWorkoutSummary(rec, programDayIndex, session);
}

function showWorkoutSummary(rec, programDayIndex, session) {
  var sets=0, volume=0;
  (session.exercises||[]).forEach(function(ex){
    var id=(rec.swaps&&rec.swaps[ex.id])||ex.id;
    ((rec.workout||{})[id]||[]).filter(Boolean).forEach(function(s){sets++;volume+=(Number(s.weight)||0)*(Number(s.reps)||0);});
  });
  var meta=getSessionMeta(rec, programDayIndex), minutes=meta.durationMinutes||0;
  var overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet completion-sheet"><div class="sheet-handle"></div><div class="completion-mark">✓</div><div class="sheet-title">Workout complete</div><div class="small dim">'+esc(meta.sessionLabel||'Session')+'</div><div class="completion-stats"><div><strong>'+formatDuration(minutes)+'</strong><span>duration</span></div><div><strong>'+sets+'</strong><span>sets</span></div><div><strong>'+Math.round(volume).toLocaleString()+'</strong><span>kg volume</span></div></div><button class="btn btn-primary" id="closeWorkoutSummary" style="width:100%;margin-top:16px">Done</button></div>';
  document.body.appendChild(overlay);
  if(navigator.vibrate) navigator.vibrate([30,50,30]);
  overlay.querySelector('#closeWorkoutSummary').onclick=function(){overlay.remove();};
}

function setManualSessionDuration(dayKey, session, programDayIndex) {
  var rec=dayRecord(dayKey);
  var meta=getSessionMeta(rec, programDayIndex);
  meta.sessionLabel=meta.sessionLabel||session.label;
  var current=meta.durationMinutes||Math.round(workoutElapsed(meta)/60)||'';
  var value=prompt('Total session time in minutes', String(current));
  if(value===null) return;
  var minutes=Number(value);
  if(!Number.isFinite(minutes)||minutes<1||minutes>1440) {
    showToast('Enter a duration from 1 to 1440 minutes','warn');
    return;
  }
  meta.durationMinutes=Math.round(minutes);
  meta.sessionLabel=session.label;
  if(!meta.startedAt) meta.completedAt=meta.completedAt||new Date().toISOString();
  meta.updatedAt=new Date().toISOString();
  saveDayRecord(dayKey,rec);
  showToast('Session time saved','ok');
  renderGym();
}

  function totals(){
    var t={kcal:0,protein:0,carbs:0,fat:0};
    ingredients.forEach(function(ing){var m=foodMacros(ing.food,ing.servings);t.kcal+=m.kcal;t.protein+=m.protein;t.carbs+=m.carbs;t.fat+=m.fat;});
    return t;
  }
  function refresh(){
    var t=totals();
    var ir=overlay.querySelector('#ingList'); if(ir) ir.innerHTML=renderIngredients();
    var tr=overlay.querySelector('#recipeTotals'); if(tr) tr.textContent='Total: '+Math.round(t.kcal)+' kcal · '+t.protein.toFixed(1)+'P · '+t.carbs.toFixed(1)+'C · '+t.fat.toFixed(1)+'F';
    overlay.querySelectorAll('[data-ing]').forEach(function(b){
      b.addEventListener('click',function(){ingredients.splice(parseInt(b.dataset.ing,10),1);refresh();});
    });
  }
  overlay.innerHTML='<div class="sheet">'
    +'<div class="sheet-handle"></div>'
    +'<div class="sheet-title">Build recipe</div>'
    +'<label class="eyebrow" style="margin-top:8px">Recipe name</label><input type="text" id="recName" placeholder="e.g. Morning oats bowl">'
    +'<button class="btn btn-sm" id="addIngBtn" style="margin-top:10px">'+ic('plus')+' Add ingredient</button>'
    +'<div id="ingList" style="margin-top:8px"></div>'
    +'<div id="recipeTotals" style="font-size:13px;color:var(--text-muted);margin-top:8px">Total: 0 kcal</div>'
    +'<div class="modal-actions" style="margin-top:14px">'
      +'<button class="btn" id="cancelRcpBtn">Cancel</button>'
      +'<button class="btn btn-primary" id="saveRcpBtn">Save & add</button>'
    +'</div></div>';
  document.body.appendChild(overlay);
  refresh();
  document.getElementById('cancelRcpBtn').addEventListener('click',function(){overlay.remove();});
  document.getElementById('addIngBtn').addEventListener('click',function(){
    openFoodSearch(function(food,servings){ingredients.push({food:food,servings:servings});refresh();});
  });
  document.getElementById('saveRcpBtn').addEventListener('click',function(){
    var name=document.getElementById('recName').value.trim();
    if(!name){showToast('Enter a recipe name','warn');return;}
    var t=totals();
    var g=ingredients.reduce(function(s,ing){return s+ing.food.serving_g*ing.servings;},0)||100;
    var factor=100/g;
    var recipe={name:name,unit:'1 serving',serving_g:g,kcal:+(t.kcal*factor).toFixed(1),protein:+(t.protein*factor).toFixed(2),carbs:+(t.carbs*factor).toFixed(2),fat:+(t.fat*factor).toFixed(2),ingredients:ingredients.map(function(i){return {name:i.food.name,servings:i.servings};})};
    FoodDB.addRecipe(recipe).then(function(id){
      overlay.remove();
      var pseudo=Object.assign({},recipe,{id:id,_type:'recipe'});
      if(callback) openServingSelector(pseudo,callback,null);
    });
  });
}

function seedMockData() {
  if(!profile) return;
  
  // Clear existing day logs to avoid overlaps
  allDayKeys().forEach(function(k){
    localStorage.removeItem('rg_day_' + k);
  });
  
  var today = new Date();
  var startD = addDays(today, -21);
  profile.startDate = startD.toISOString().split('T')[0];
  profile.startWeight = 54.0;
  profile.targetWeight = 60.0;
  sv('rg_profile', profile);

  var plan = profile.mealPlan || DEFAULT_MEAL_PLAN;
  var tdays = profile.trainingDays || [1,3,5];
  
  var prog = getActiveProgram();
  var sessionRotation = 0;
  
  for(var i=0; i<=21; i++) {
    var d = addDays(startD, i);
    var key = dateKey(d);
    var isTrain = tdays.includes(d.getDay());
    
    // Weight curve: linear increase from 54.0 to 54.8 with fluctuation
    var weight = 54.0 + (i * 0.04) + (Math.sin(i * 1.5) * 0.08);
    weight = +weight.toFixed(1);
    
    var sleep = +(7.0 + (Math.cos(i) * 0.8) + (Math.sin(i / 2) * 0.5)).toFixed(1);
    var readiness = Math.round(3.5 + (Math.sin(i) * 1.2));
    if (readiness < 1) readiness = 1;
    if (readiness > 5) readiness = 5;
    
    var note = '';
    if (i === 1) note = 'Bulk started. Appetite high.';
    else if (i === 4) note = 'Felt strong on compound lifts.';
    else if (i === 7) note = 'First week complete. Gained slightly.';
    else if (i === 11) note = 'Rough sleep last night, but recovery is fine.';
    else if (i === 14) note = 'PR on squats! Feeling great.';
    else if (i === 18) note = 'Energy levels are solid, weight is trending up.';
    else if (i === 21) note = 'Bulk moving fast, ready to calibrate calorie targets.';

    var rec = {
      weight: weight,
      sleep: sleep,
      readiness: readiness,
      recovery: readiness >= 3 ? 'good' : 'bad',
      note: note,
      meals: {},
      workout: {},
      workoutDone: isTrain,
      badAppetite: false,
      avocados: (i % 5 === 0) ? 1 : 0,
      extra: []
    };
    
    // Populate meals
    Object.keys(plan).forEach(function(gKey){
      var group = plan[gKey];
      if(group.gymOnly && !isTrain) return;
      group.items.forEach(function(item){
        rec.meals[item.id] = true;
      });
    });
    
    // Random extra snacks
    if (i % 3 === 0) {
      rec.extra.push({ name: 'Rice & Ghee Extra', kcal: 250, protein: 4, carbs: 50, fat: 5, servings: 1 });
    } else if (i % 4 === 0) {
      rec.extra.push({ name: 'Protein Bar', kcal: 220, protein: 20, carbs: 15, fat: 6, servings: 1 });
    }
    
    // Populate workout sets if training day
    if (isTrain) {
      var sess = prog[sessionRotation % prog.length];
      sessionRotation++;
      
      sess.exercises.forEach(function(ex){
        var weekNum = Math.floor(i / 7) + 1;
        var baseWeight = 0;
        
        if (ex.id === 'squat') baseWeight = 50 + (weekNum * 2.5);
        else if (ex.id === 'bench') baseWeight = 40 + (weekNum * 2.5);
        else if (ex.id === 'rdl') baseWeight = 45 + (weekNum * 2.5);
        else if (ex.id === 'ohp') baseWeight = 30 + (weekNum * 2.5);
        else if (ex.id === 'barbell_row') baseWeight = 35 + (weekNum * 2.5);
        else if (ex.id === 'leg_press') baseWeight = 100 + (weekNum * 5);
        else if (ex.id === 'lat_pulldown') baseWeight = 40 + (weekNum * 2.5);
        else if (ex.id === 'cable_row') baseWeight = 35 + (weekNum * 2.5);
        else if (ex.id === 'incline_bench') baseWeight = 18 + (weekNum * 2);
        else baseWeight = 15 + (weekNum * 1.25);
        
        var targetSets = ex.sets || 3;
        rec.workout[ex.id] = [];
        for(var s=0; s<targetSets; s++) {
          var reps = 8 + (weekNum - 1) + (s % 2 === 0 ? 0 : 1);
          rec.workout[ex.id].push({ weight: baseWeight, reps: reps });
        }
      });
    }
    
    saveDayRecord(key, rec);
  }
}

}

function handlePhotoUpload(file) {
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var MAX_WIDTH = 400; var MAX_HEIGHT = 400;
      var width = img.width; var height = img.height;
      if (width > height) {
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
      } else {
        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
      }
      canvas.width = width; canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      if(!profile.photos) profile.photos=[];
      profile.photos.push({date: new Date().toISOString(), srcBase64: dataUrl});
      sv('rg_profile', profile);
      renderProgress();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function exportData() {
  FoodDB.exportAll().then(function(dbData){
    var keys = allDayKeys();
    var keySet = {};
    keys.forEach(function(k){ keySet[k] = true; });
    Object.keys(localStorage).forEach(function(k){ if(k.indexOf('rg_day_') === 0) keySet[k.slice(7)] = true; });
    Object.keys(SQLiteStorage.cache || {}).forEach(function(k){ if(k.indexOf('rg_day_') === 0) keySet[k.slice(7)] = true; });
    keys = Object.keys(keySet).sort();
    var data = {
      app:'Iron Log',
      version:3,
      exported: new Date().toISOString(),
      profile:ls('rg_profile',null),
      meals:ls('rg_meals',DEFAULT_MEALS),
      recentFoods:ls('rg_recent_foods',[]),
      lastBackup:ls('rg_last_backup',null),
      workoutSessions:ls(WORKOUT_SESSIONS_KEY,{version:WORKOUT_SESSIONS_VERSION,sessions:{},migrated:false}),
      dayKeys:keys,
      days:{},
      idb:dbData
    };
    keys.forEach(function(k){ data.days[k]=dayRecord(k); });
    var blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download='iron-log-backup-'+todayKey()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    sv('rg_last_backup', Date.now());
    showToast('Profile, progress, meals, and workouts exported','ok');
  }).catch(function(err) {
    console.error('Export failed:', err);
    showToast('Export failed. Try again after freeing device storage.','warn');
  });
}

function importData() {
  var input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.addEventListener('change',function(){
    var file=input.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(e){
      try {
        var data=JSON.parse(e.target.result);
        if(!data.profile || !data.days || typeof data.days !== 'object') throw new Error('Invalid backup file');
        if(!confirm('This will overwrite all current data. Continue?')) return;
        var importedKeys=Object.keys(data.days), existingKeys=[];
        Object.keys(localStorage).forEach(function(k){if(k.indexOf('rg_day_')===0) existingKeys.push(k.slice(7));});
        Object.keys(SQLiteStorage.cache||{}).forEach(function(k){if(k.indexOf('rg_day_')===0&&existingKeys.indexOf(k.slice(7))<0) existingKeys.push(k.slice(7));});
        existingKeys.forEach(function(k){if(importedKeys.indexOf(k)<0) SQLiteStorage.delete('rg_day_'+k);});
        sv('rg_profile',data.profile);
        sv('rg_meals',data.meals||DEFAULT_MEALS);
        sv('rg_recent_foods',data.recentFoods||[]);
        Object.keys(data.days||{}).forEach(function(k){sv('rg_day_'+k,data.days[k]);});
        if(data.workoutSessions) sv(WORKOUT_SESSIONS_KEY,data.workoutSessions);
        FoodDB.importAll(data.idb||{}).then(function(){ profile=data.profile; sv('rg_last_backup', Date.now()); showToast('Profile, progress, meals, and workouts restored','ok'); setTimeout(function(){location.reload();},800); }).catch(function(){ showToast('Food database restore failed','warn'); });
      } catch(err) { console.error('Import failed:', err); showToast('Invalid or corrupted backup file','warn'); }
    };
    reader.readAsText(file);
  });
  input.click();
}

function requestPersistentStorage() {
  if (!navigator.storage || !navigator.storage.persist) return;
  navigator.storage.persist().then(function(granted) {
    if (!granted) console.info('Persistent storage was not granted by the browser');
  }).catch(function(err) {
    console.warn('Persistent storage request failed:', err);
  });
}

function getWeightHistory() {
  var entries = Array.isArray(profile.weightEntries) ? profile.weightEntries.slice() : [];
  allDayKeys().forEach(function(k) {
    var r=dayRecord(k);
    if(r.weight!=null && !entries.some(function(e){return e.dayKey===k;})) entries.push({id:'legacy_'+k,dayKey:k,weight:r.weight,createdAt:k+'T12:00:00'});
  });
  return entries.filter(function(e){return e.weight!=null;}).sort(function(a,b){return String(a.createdAt||a.dayKey).localeCompare(String(b.createdAt||b.dayKey));});
}

function getProgressRows(range, entries) {
  var cutoff = range === 'all' ? 0 : Date.now() - ({'1w':7,'1m':30,'3m':90}[range]||30)*86400000;
  return entries.filter(function(e){return new Date(e.createdAt||e.dayKey+'T12:00:00').getTime() >= cutoff;});
}

function getRollingWeightValues(entries, source) {
  source=source||entries;
  return entries.map(function(entry, i) {
    var day=new Date((entry.dayKey||entry.createdAt).slice(0,10)+'T12:00:00');
    var start=addDays(day,-6).getTime(), end=day.getTime();
    var window=source.filter(function(e){var t=new Date((e.dayKey||e.createdAt).slice(0,10)+'T12:00:00').getTime();return t>=start&&t<=end;});
    var avg=window.reduce(function(sum,e){return sum+Number(e.weight);},0)/window.length;
    return {value:+avg.toFixed(2),label:entry.dayKey+' · 7-day avg '+avg.toFixed(2)+' kg'};
  });
}

function goalTrajectoryText(entries) {
  var target=Number(profile.targetWeight), direction=goalDirection();
  if(!target||entries.length<3) return 'Log 3 weigh-ins over 14+ days for an estimate';
  var firstDate=new Date((entries[0].dayKey||entries[0].createdAt).slice(0,10)+'T12:00:00');
  var lastDate=new Date((entries[entries.length-1].dayKey||entries[entries.length-1].createdAt).slice(0,10)+'T12:00:00');
  var weeks=(lastDate-firstDate)/604800000;
  if(weeks<2) return 'Keep logging for 14+ days for an estimate';
  var rate=(entries[entries.length-1].weight-entries[0].weight)/weeks;
  if(!Number.isFinite(rate)||direction*rate<=0) return 'No clear trend toward goal yet';
  var weeksLeft=Math.abs((target-entries[entries.length-1].weight)/rate);
  if(!Number.isFinite(weeksLeft)||weeksLeft>260) return 'Trend is too slow to estimate';
  var eta=new Date(lastDate.getTime()+weeksLeft*604800000);
  return 'Estimated '+eta.toLocaleDateString([], {month:'short',year:'numeric'})+' · based on logged intake and weight trend';
}

function progressPlot(values, goal) {
  if(!values.length) return '<div class="empty-note">Log data to see this trend.</div>';
  var nums=values.map(function(v){return Number(v.value);}).concat(goal!=null?[goal]:[]);
  var rawMin=Math.min.apply(null,nums), rawMax=Math.max.apply(null,nums), rawSpan=rawMax-rawMin;
  var pad=rawSpan?Math.max(rawSpan*.18,.5):Math.max(Math.abs(rawMax)*.03,.5);
  var min=rawMin-pad, max=rawMax+pad, span=max-min||1;
  var points=values.map(function(v,i){var x=i/Math.max(1,values.length-1)*100,y=8+((max-v.value)/span)*84;return {x:x,y:y,v:v};});
  var poly=points.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');
  var first=values[0].value, last=values[values.length-1].value, delta=last-first;
  var deltaText=values.length>1?(delta===0?'No change':(delta>0?'+':'')+delta.toFixed(1)+' kg'):'First entry';
  var labels=[values[0],values[Math.floor((values.length-1)/2)],values[values.length-1]].map(function(v){var raw=String(v.label||'').slice(0,10);return raw.replace(/^\\d{4}-/,'').replace('-','/');});
  var goalY=goal!=null?8+((max-goal)/span)*84:null;
  var goalLine=goalY!=null&&goalY>=0&&goalY<=100?'<div class="chart-goal" style="top:'+goalY+'%"><span>goal '+Number(goal).toFixed(1)+'</span></div>':'';
  var area=points.length>1?poly+' 100,100 0,100':'';
  return '<div class="plot-caption"><span>'+values.length+' point'+(values.length===1?'':'s')+'</span><b class="plot-change">'+deltaText+'</b></div>'
    +'<div class="plot-shell"><div class="plot-current">'+Number(last).toFixed(1)+'</div><div class="line-chart" aria-label="Trend from '+first+' to '+last+'"><span class="chart-max">'+max.toFixed(1)+'</span><span class="chart-min">'+min.toFixed(1)+'</span>'+goalLine
    +'<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="plotFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--amber)" stop-opacity=".28"/><stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs>'
    +(area?'<polygon points="'+area+'" fill="url(#plotFill)"/>':'')
    +'<polyline points="'+poly+'" fill="none" stroke="var(--amber)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>'
    +points.map(function(p,i){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(i===points.length-1?'3':'2.2')+'" fill="'+(i===points.length-1?'var(--amber-light)':'var(--amber)')+'" stroke="var(--surface)" stroke-width="1"><title>'+esc(p.v.label||p.v.value)+'</title></circle>';}).join('')
    +'</svg></div><div class="plot-axis"><span>'+esc(labels[0])+'</span><span>'+esc(labels[1])+'</span><span>'+esc(labels[2])+'</span></div></div>';
}

function workoutHistoryHTML() {
  var sessions=getWorkoutSessions().filter(function(session) {
    return (session.exercises||[]).some(function(exercise) {
      return (exercise.sets||[]).some(Boolean);
    });
  }).reverse();
  if(!sessions.length) return '<div class="empty-note">Completed workouts will appear here.</div>';

  var weeks={};
  sessions.forEach(function(session) {
    var week=Number(session.week)||1;
    (weeks[week]||(weeks[week]=[])).push(session);
  });
  return Object.keys(weeks).sort(function(a,b){return Number(b)-Number(a);}).map(function(week) {
    var cards=weeks[week].map(function(session) {
      var exercises=session.exercises||[], total=exercises.reduce(function(count, exercise) {
        return count+(exercise.sets||[]).filter(Boolean).length;
      },0);
      var date=session.dayKey ? new Date(session.dayKey+'T00:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}) : 'Date not recorded';
      var duration=session.durationMinutes!=null ? Number(session.durationMinutes)+' min' : 'Duration not recorded';
      var label=session.programLabel||session.sessionLabel||'Workout';
      var dayLabel=session.day ? 'Day '+session.day+' · ' : '';
      var details=exercises.map(function(exercise) {
        var ex=getExerciseData(exercise.id)||{name:exercise.id}, sets=(exercise.sets||[]).filter(Boolean), pr=getExercisePR(exercise.id);
        return '<div><strong>'+esc(ex.name)+'</strong>'+sets.map(function(s,i){
          var isPR=pr&&s.weight===pr.weight&&s.reps===pr.reps;
          return '<div class="history-set-row"><span>Set '+(i+1)+'</span><span>'+s.weight+' kg × '+s.reps+(s.rir===0?' · failure':(s.rir!=null?' · '+s.rir+' RIR':''))+(isPR?' · <b style="color:var(--amber)">PR</b>':'')+'</span></div>';
        }).join('')+'</div>';
      }).join('');
      return '<details class="history-workout"><summary><strong>'+esc(dayLabel+label)+'</strong><span>'+date+' · '+duration+' · '+total+' '+(total===1?'set':'sets')+'</span></summary><div style="padding-top:12px">'+details+'</div></details>';
    }).join('');
    return '<div class="eyebrow" style="margin-top:16px">Week '+esc(week)+'</div>'+cards;
  }).join('');
}

function weightEntriesHTML(entries) {

function renderProgressSimple(mode) {
  mode=mode||'body';
  var entries=getWeightHistory(), records=allDayKeys().map(function(k){var r=dayRecord(k),t=getDayTotals(k);return {key:k,weight:r.weight,kcal:t.kcal,protein:t.protein};});
  var workoutSessions=getWorkoutSessions().filter(function(session){return (session.exercises||[]).some(function(exercise){return (exercise.sets||[]).some(Boolean);});});
  var current=entries.length?entries[entries.length-1].weight:null, range='1w';
  var exOptions=[]; getActiveProgram().forEach(function(s){s.exercises.forEach(function(e){if(!exOptions.some(function(x){return x.id===e.id;}))exOptions.push(e);});});
  allDayKeys().forEach(function(key){Object.keys(dayRecord(key).workout||{}).forEach(function(id){var e=getExerciseData(id);if(e&&!exOptions.some(function(x){return x.id===id;}))exOptions.push(e);});});
  var render=function(){
    var rangeEntries=getProgressRows(range,entries), weightValues=getRollingWeightValues(rangeEntries,entries);
    var cutoff = range === 'all' ? 0 : Date.now() - ({'1w':7,'1m':30,'3m':90}[range]||30)*86400000;
    var rangeRecords=records.filter(function(r){return new Date(r.key+'T23:59:59').getTime()>=cutoff;});
    var liftControl=document.getElementById('liftSelect');
    var selected=liftControl?liftControl.value:null, liftValues=[];
    rangeRecords.forEach(function(r){var best=0;(dayRecord(r.key).workout||{})[selected]&&dayRecord(r.key).workout[selected].forEach(function(s){if(s)best=Math.max(best,calcE1RM(s.weight,s.reps));});if(best)liftValues.push({value:best,label:r.key+' · '+best.toFixed(1)+' kg'});});
    var allLiftValues=[];
    rangeRecords.forEach(function(r){var total=0,count=0;Object.keys(dayRecord(r.key).workout||{}).forEach(function(id){var best=0;(dayRecord(r.key).workout[id]||[]).forEach(function(s){if(s){best=Math.max(best,calcE1RM(s.weight,s.reps));}});if(best){total+=best;count++;}});if(count)allLiftValues.push({value:total/count,label:r.key});});
    var first=allLiftValues.length?allLiftValues[0].value:1;
    var weightPlot=document.getElementById('weightPlot'); if(weightPlot) weightPlot.innerHTML=progressPlot(weightValues,profile.targetWeight);
    var liftPlot=document.getElementById('liftPlot'); if(liftPlot) liftPlot.innerHTML=progressPlot(liftValues);
    var direction=goalDirection(), latest=weightValues.length?weightValues[weightValues.length-1].value:null;
    var trend=weightValues.length>1?latest-weightValues[0].value:0;
    var status=weightValues.length>1?(direction*trend>0?'moving toward goal':direction*trend<0?'moving away from goal':'flat'):'need more entries';
    var weightMeta=document.getElementById('weightMeta'); if(weightMeta) weightMeta.innerHTML=latest!=null?(latest+' kg 7-day avg · goal '+(profile.targetWeight||'—')+' kg · '+status+'<br><span class="progress-summary">'+esc(goalTrajectoryText(entries))+'</span>'):'No weight entries yet';
    var liftMeta=document.getElementById('liftMeta');
    if(liftMeta) {
      var firstLift=liftValues.length?liftValues[0].value:null, latestLift=liftValues.length?liftValues[liftValues.length-1].value:null;
      liftMeta.textContent=latestLift!=null?(latestLift.toFixed(1)+' kg e1RM'+(firstLift!=null&&liftValues.length>1?' · '+(latestLift-firstLift>=0?'+':'')+(latestLift-firstLift).toFixed(1)+' since start':'')):'No lift entries yet';
    }
  };
  var bodySection='<section class="progress-card"><div class="progress-card-head"><div><span class="eyebrow">'+esc(goalLabel())+'</span><h2>Bodyweight</h2></div><strong>'+(current!=null?current.toFixed(1)+' kg':'—')+'</strong></div><div id="weightMeta" class="progress-summary"></div><div class="range-row"><button class="range active" data-range="1w">7d</button><button class="range" data-range="1m">30d</button><button class="range" data-range="3m">90d</button></div><div id="weightPlot"></div><div class="progress-entry"><input id="progressWeight" type="number" step="0.1" min="20" max="300" placeholder="Log weight" inputmode="decimal"><button class="btn btn-primary" id="saveProgressWeight">Save</button></div><details class="progress-more"><summary>Recent weigh-ins</summary><div class="weight-entry-list">'+weightEntriesHTML(entries)+'</div></details></section><section class="progress-card"><div class="progress-card-head"><div><span class="eyebrow">Nutrition</span><h2>Calories & protein</h2></div><span class="progress-summary">last 7 days</span></div>'+nutritionProgressHTML(records)+'</section>';
  var liftSection='<section class="progress-card"><div class="progress-card-head"><div><span class="eyebrow">Strength</span><h2>Lift progress</h2></div><span id="liftMeta" class="progress-summary"></span></div><select id="liftSelect" class="compact-select">'+exOptions.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>';}).join('')+'</select><div id="liftPlot"></div></section><section class="progress-card"><div class="progress-card-head"><div><span class="eyebrow">Training</span><h2>Weekly work</h2></div><span class="progress-summary">7 days</span></div>'+weeklyVolumeChart()+'</section>';
  document.getElementById('content').innerHTML=
    '<div class="topbar"><div><span class="eyebrow">'+personalizedEyebrow('simple progress')+'</span><div class="title">Progress</div></div><button class="icon-btn" id="settingsBtn" aria-label="Settings">'+ic('settings')+'</button></div>'
    +'<div class="progress-intro">'+(mode==='body'?'Weight and nutrition':'Lift progress and weekly work')+'</div>'
    +'<div class="progress-nav"><button class="btn '+(mode==='body'?'active':'')+'" id="bodyProgressBtn">Body & food</button><button class="btn '+(mode==='lifts'?'active':'')+'" id="liftProgressBtn">Lifts</button></div>'
    +(mode==='body'?bodySection:liftSection)
    +'<details class="history-details"><summary>Workout history · '+workoutSessions.length+' '+(workoutSessions.length===1?'session':'sessions')+'</summary>'+workoutHistoryHTML()+'</details>';
  document.getElementById('settingsBtn').onclick=openSettings;
  document.getElementById('bodyProgressBtn').onclick=function(){renderProgressSimple('body');};
  document.getElementById('liftProgressBtn').onclick=function(){renderProgressSimple('lifts');};
  document.querySelectorAll('[data-range]').forEach(function(btn){btn.onclick=function(){range=btn.dataset.range;document.querySelectorAll('[data-range]').forEach(function(b){b.classList.toggle('active',b===btn);});render();};});
  var liftSelect=document.getElementById('liftSelect'); if(liftSelect) liftSelect.onchange=render;
  document.querySelectorAll('[data-edit-weight]').forEach(function(btn){btn.onclick=function(){editWeightEntry(btn.dataset.editWeight);};});
  document.querySelectorAll('[data-delete-weight]').forEach(function(btn){btn.onclick=function(){deleteWeightEntry(btn.dataset.deleteWeight);};});
  var saveWeight=document.getElementById('saveProgressWeight'); if(saveWeight) saveWeight.onclick=function(){var value=parseFloat(document.getElementById('progressWeight').value);if(!value||value<20||value>300){showToast('Enter a valid weight','warn');return;}profile.weightEntries=profile.weightEntries||[];profile.weightEntries.push({id:'weight_'+Date.now(),dayKey:todayKey(),weight:value,createdAt:new Date().toISOString()});sv('rg_profile',profile);var r=dayRecord(todayKey());r.weight=value;saveDayRecord(todayKey(),r);showToast('Bodyweight saved','ok');renderProgressSimple('body');};
  render();
}

function addQuickFood(key) {
  var overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Quick add</div><div class="small dim">Use this when you know the calories and protein.</div>'
    +'<label class="eyebrow">Calories</label><input type="number" id="quickKcal" inputmode="numeric" placeholder="e.g. 300">'
    +'<label class="eyebrow">Protein (g)</label><input type="number" id="quickProtein" inputmode="decimal" placeholder="e.g. 25">'
    +'<div class="modal-actions"><button class="btn" id="quickCancel">Cancel</button><button class="btn btn-primary" id="quickSave">Add</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#quickCancel').onclick=function(){overlay.remove();};
  overlay.querySelector('#quickSave').onclick=function(){
    var kcal=parseInt(document.getElementById('quickKcal').value,10);
    var protein=parseFloat(document.getElementById('quickProtein').value)||0;
    if(!kcal || kcal<1 || protein<0){showToast('Enter calories and protein','warn');return;}
    var rec=dayRecord(key); rec.extra.push({name:'Quick add',kcal:kcal,protein:protein,carbs:0,fat:0,servings:1});
    saveDayRecord(key,rec); addRecent('Quick add',kcal,protein,0,0); overlay.remove(); renderTodaySimple();
  };
}

function renderTodaySimple() {
  var key=todayKey(), rec=dayRecord(key), tot=getDayTotals(key), targets=getTargetsForDate(key);
  var calorieDelta=targets.kcal-tot.kcal;
  var calorieRemaining=Math.max(0,calorieDelta);
  var calPct=Math.min(100,Math.round((tot.kcal/targets.kcal)*100));
  var proteinPct=Math.min(100,Math.round((tot.protein/targets.protein)*100));
  var tdays=profile.trainingDays||[1,2,3,5,6], isTraining=tdays.includes(new Date().getDay());
  var chosen=rec.workoutDone?getNextProgramWorkout():getWorkoutForDate(key,rec), session=chosen.session, hasWorkout=isTraining||rec.selectedWorkout!=null;
  var done=session.exercises.filter(function(ex){return (rec.workout||{})[ex.id]&&rec.workout[ex.id].length;}).length;
  var recent=ls('rg_recent_foods',[]).slice(0,5);
  var recentHtml=recent.length?'<div class="chips-row">'+recent.map(function(r){return '<button class="chip quick-recent" data-food="'+encodeURIComponent(JSON.stringify(r))+'">'+esc(r.name)+'</button>';}).join('')+'</div>':'';
  document.getElementById('content').innerHTML=
    '<div class="topbar"><div><span class="eyebrow">'+personalizedEyebrow(new Date().toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}))+'</span><div class="title">Today</div></div><button class="icon-btn" id="settingsBtn" aria-label="Settings">'+ic('settings')+'</button></div>'
    +'<section class="focus-card"><button class="focus-number" id="calorieDetails" aria-label="Show macro details"><span class="eyebrow">'+(calorieDelta>=0?'calories remaining':'calories over target')+'</span><strong>'+Math.abs(calorieDelta).toLocaleString()+'</strong><span class="focus-target">of '+targets.kcal.toLocaleString()+' kcal</span></button><div class="progress-track"><span style="width:'+calPct+'%"></span></div><div class="macro-hidden" id="macroDetails"><span>Carbs <b>'+tot.carbs+'g</b></span><span>Fat <b>'+tot.fat+'g</b></span></div></section>'
    +'<section class="simple-section"><div class="section-head"><span class="eyebrow">protein</span><span class="mono">'+tot.protein+' / '+targets.protein+'g</span></div><div class="progress-track protein-track"><span style="width:'+proteinPct+'%"></span></div></section>'
    +'<section class="today-workout '+(!hasWorkout?'rest':'')+'"><div><span class="eyebrow">today\'s workout</span><strong>'+ (hasWorkout?esc(session.label):'Rest day')+'</strong><span class="small dim">'+(hasWorkout?done+' of '+session.exercises.length+' exercises':'')+'</span></div><button class="btn '+(hasWorkout?'btn-primary':'')+'" id="startWorkout">'+(hasWorkout?'Start':'Choose')+'</button></section>'
    +'<section class="simple-section"><div class="section-head"><span class="eyebrow">bodyweight</span><span class="small dim">once daily</span></div><div class="inline-entry"><input type="number" id="todayWeight" step="0.1" inputmode="decimal" placeholder="kg" value="'+(rec.weight||'')+'"><button class="btn" id="saveTodayWeight">Save</button></div></section>'
    +'<section class="simple-section"><div class="section-head"><span class="eyebrow">today\'s food</span></div>'+(rec.extra.length?'<div class="food-log-list">'+rec.extra.map(function(item,i){return '<div class="food-log-row"><span><strong>'+esc(item.name)+'</strong><small>'+Math.round(item.kcal* (item.servings||1))+' kcal · '+Math.round((item.protein||0)*(item.servings||1))+'g protein</small></span><button class="btn-ghost food-delete" data-food-index="'+i+'" aria-label="Delete '+esc(item.name)+'">Delete</button></div>';}).join('')+'</div>':'<div class="small dim">Nothing logged</div>')+recentHtml+'<div class="food-actions"><button class="btn" id="quickFoodBtn">Quick add</button><button class="btn btn-primary" id="addFoodBtn">Search food</button></div></section>'
  document.getElementById('settingsBtn').onclick=openSettings;
  document.getElementById('calorieDetails').onclick=function(){document.getElementById('macroDetails').classList.toggle('open');};
  document.getElementById('startWorkout').onclick=function(){if(!hasWorkout) chooseWorkoutForDate(key); else {tab='gym';renderApp();}};
  document.getElementById('saveTodayWeight').onclick=function(){var w=parseFloat(document.getElementById('todayWeight').value);if(!w||w<20||w>300){showToast('Enter a valid weight','warn');return;}profile.weightEntries=profile.weightEntries||[];profile.weightEntries.push({id:'weight_'+Date.now(),dayKey:key,weight:w,createdAt:new Date().toISOString()});sv('rg_profile',profile);rec.weight=w;saveDayRecord(key,rec);showToast('Bodyweight saved','ok');renderTodaySimple();};
  document.getElementById('addFoodBtn').onclick=function(){openFoodSearch(function(food,s){addFoodToDay(key,food,s);});};
  document.getElementById('quickFoodBtn').onclick=function(){addQuickFood(key);};
  document.querySelectorAll('.quick-recent').forEach(function(btn){btn.onclick=function(){var r=JSON.parse(decodeURIComponent(btn.dataset.food));rec.extra.push({name:r.name,kcal:r.kcal,protein:r.protein||0,carbs:r.carbs||0,fat:r.fat||0,servings:1});saveDayRecord(key,rec);renderTodaySimple();};});
  document.querySelectorAll('.food-delete').forEach(function(btn){btn.onclick=function(){var current=dayRecord(key);current.extra.splice(parseInt(btn.dataset.foodIndex,10),1);saveDayRecord(key,current);showToast('Food entry deleted','ok');renderTodaySimple();};});
}

// ═══════════════════════════════════════════════════════════════════════════════
// SHELL + NAV
// ═══════════════════════════════════════════════════════════════════════════════
function renderApp() {
  document.getElementById('app').innerHTML =
    '<main class="content" id="content"></main>'
    +'<nav class="bottomnav">'
      +'<button class="navitem'+(tab==='today'?' active':'')+'" data-tab="today">'+ic('home')+'<span>Today</span></button>'
      +'<button class="navitem'+(tab==='progress'?' active':'')+'" data-tab="progress">'+ic('chart')+'<span>Progress</span></button>'
      +'<button class="navitem'+(tab==='gym'?' active':'')+'" data-tab="gym">'+ic('barbell')+'<span>Gym</span></button>'
    +'</nav>';
  renderTab();
  document.querySelectorAll('.navitem').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(workoutTimer.interval){clearInterval(workoutTimer.interval);workoutTimer.interval=null;}
      if(restTimer.interval){clearInterval(restTimer.interval);restTimer.interval=null;restTimer.remaining=0;}
      tab=btn.dataset.tab;
      document.querySelectorAll('.navitem').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
      renderTab();
    });
  });
}

function renderTab() {
  if(tab==='today') renderTodaySimple();
  else if(tab==='progress') renderProgressSimple();
  else renderGym();
}

// ── Boot ────────────────────────────────────────────────────────────────────────
SQLiteStorage.init(function(){
  requestPersistentStorage();
  profile = ls('rg_profile', null);
  migrateWorkoutSessions();
  FoodDB.open().then(function(){
    if(profile) {
      migrateFoodTotals();
      if(!profile.mealPlan) {
        profile.mealPlan = JSON.parse(JSON.stringify(DEFAULT_MEAL_PLAN));
        sv('rg_profile', profile);
      }
    }
    if(!profile) {
      renderOnboarding();
    } else {
      if(profile.pin) {
        delete profile.pin;
        sv('rg_profile', profile);
      }
      renderApp();
      if (location.hash === '#checkin' || location.search.indexOf('checkin') > -1) {
        openCheckinSheet(todayKey());
      }
    }
  }).catch(function(err){
    document.getElementById('app').innerHTML='<div class="loading"><div style="color:var(--rust-light)">IndexedDB error. Please reload.</div><div style="font-size:12px;color:var(--text-muted)">'+err.message+'</div></div>';
  });
});

// ── Service Worker ──────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>

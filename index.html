<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Iron Log</title>
<meta name="description" content="Private offline workout logger for the Iron Log 5-day muscle-building split.">
<meta name="theme-color" content="#15130F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href="manifest.json">
<script src="db.js"></script>
<style>
:root {
  --bg:#15130F; --surface:#1F1B15; --surface-raised:#262019; --surface-hi:#2E2720;
  --border:#332B20; --border-strong:#4A3A22;
  --text:#F8F4ED; --text-secondary:#C0B5A1; --text-muted:#968E7E;
  --amber:#D98B3F; --amber-light:#F0B36B; --amber-dark:#A8651F;
  --sage:#7C9473; --sage-light:#A8C29C; --sage-dark:#57714F;
  --rust:#B5503D; --rust-light:#D17B68; --rust-dark:#823828;
  --nav-h:60px; --safe-b:env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; min-height: 100dvh;
  overscroll-behavior: none;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding: 20px 18px calc(var(--nav-h) + var(--safe-b) + 24px); }
.mono { font-family: 'Space Mono', monospace; }
.dim { color: var(--text-muted); }
.small { font-size: 12px; }
.sage { color: var(--sage-light); }
.rust { color: var(--rust-light); }
.amber { color: var(--amber-light); }
.eyebrow { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); display: block; }
.title { font-size: 21px; font-weight: 600; margin-top: 1px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.stat-chip { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-secondary); }
.icon-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 10px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; line-height: 0; border-radius: 10px; }
.icon-btn:active, .icon-btn:focus-visible { background: var(--surface); color: var(--amber-light); }
.icon { display: inline-flex; vertical-align: middle; flex-shrink: 0; }
/* ── Gauge ── */
.gauge-wrap { position: relative; margin: 0 auto; width: 100%; max-width: 320px; }
.gauge-readout { text-align: center; margin-top: -18px; padding-bottom: 4px; }
.gauge-readout .big { font-size: 28px; font-weight: 600; font-family: 'Space Mono', monospace; }
.gauge-readout .dim { font-size: 14px; }
.status-pill-wrap { text-align: center; margin: 6px 0 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 13px; border-radius: 20px; font-weight: 500; }
/* ── Macro bars ── */
.macro-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.macro-card { background: var(--surface); border-radius: 10px; padding: 10px 10px 8px; }
.macro-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
.macro-val { font-size: 15px; font-weight: 600; font-family: 'Space Mono', monospace; margin: 2px 0; }
.macro-bar-track { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.macro-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
/* ── Input rows ── */
input[type=number], input[type=text], select {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 11px 14px; font-family: inherit; font-size: 15px; width: 100%;
  -webkit-appearance: none; appearance: none; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus {
  border-color: var(--amber);
  box-shadow: 0 0 0 3px rgba(217, 139, 63, 0.12);
}
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
input[type=number] {
  -moz-appearance: textfield;
}
input::placeholder { color: var(--text-muted); }
.row-input { display: flex; gap: 8px; margin-top: 6px; }
.row-input input { flex: 1; }
.btn { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); border-radius: 10px; padding: 9px 16px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
.btn:active { background: var(--surface-raised); }
.btn-primary { background: var(--amber); color: #2A1800; border-color: var(--amber); }
.btn-primary:active { background: var(--amber-dark); border-color: var(--amber-dark); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-ghost { background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 13px; cursor: pointer; padding: 0; }
/* ── Section ── */
.section { margin-bottom: 32px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
/* ── Meal rows ── */
.meal-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(242,237,228,0.05); }
.meal-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-raised); display: flex; align-items: center; justify-content: center; color: var(--text-muted); flex-shrink: 0; }
.meal-info { flex: 1; min-width: 0; }
.meal-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meal-macros { font-size: 11px; color: var(--text-muted); font-family: 'Space Mono', monospace; margin-top: 1px; }
.meal-toggle { background: none; border: none; cursor: pointer; padding: 6px; line-height: 0; flex-shrink: 0; }
/* ── Chips ── */
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.chips-row::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary); font-size: 12px; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-family: inherit; flex-shrink: 0; }
.chip:active { background: var(--surface-raised); }
/* ── Add food btn ── */
.add-food-btn { background: none; border: none; color: var(--text-muted); font-size: 13px; padding: 10px 0; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; }
/* ── Mission Control ── */
.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.mc-card { background: var(--surface); border-radius: 12px; padding: 12px; border: 1px solid var(--border); cursor: pointer; user-select: none; }
.mc-card:active { background: var(--surface-raised); }
.mc-icon { font-size: 18px; margin-bottom: 4px; display: block; }
.mc-val { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
.mc-sub { font-size: 11px; color: var(--text-muted); line-height: 1.3; }
/* ── Stat grid (Progress) ── */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border-radius: 12px; padding: 13px 14px; }
.stat-val { font-size: 21px; font-weight: 600; font-family: 'Space Mono', monospace; margin-top: 3px; }
.stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
/* ── Charts ── */
.chart-wrap { position: relative; height: 150px; }
.chart-empty { display: flex; align-items: center; justify-content: center; height: 150px; color: var(--text-muted); font-size: 13px; text-align: center; padding: 0 16px; }
.volume-bars { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.volume-bar-row { display:grid; grid-template-columns:104px 1fr 24px; gap:8px; align-items:center; font-size:11px; color:var(--text-secondary); }
.volume-bar-row b { color:var(--text); font-family:'Space Mono',monospace; text-align:right; font-size:11px; }
.volume-bar-track { height:10px; border-radius:99px; background:linear-gradient(90deg,rgba(143,163,186,.14),rgba(143,163,186,.08)); overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.2); }
.volume-bar-track i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--amber),var(--amber-light)); box-shadow:0 0 10px rgba(184,243,74,.22); transition:width .25s ease; }
/* ── Ledger ── */
.ledger-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.ledger-cell { width: 13px; height: 13px; border-radius: 2px; cursor: default; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }
/* ── Advisory banner ── */
.advisory { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 13px 14px; display: flex; gap: 10px; align-items: flex-start; color: var(--text-secondary); font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
.advisory .advisory-icon { color: var(--amber); margin-top: 1px; flex-shrink: 0; }
.advisory-actions { display: flex; gap: 8px; margin-top: 8px; }
/* ── Gym tab ── */
.rest-day { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 50px 0 40px; color: var(--text-muted); text-align: center; }
.rest-label { font-size: 18px; font-weight: 500; color: var(--text); }
.exercise-card { background: var(--surface); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; }
.exercise-name { font-size: 15px; font-weight: 600; }
.exercise-cue { font-size: 12px; color: var(--text-muted); margin-top: 2px; margin-bottom: 10px; }
.set-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; min-height: 28px; }
.set-chip { background: var(--surface-raised); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-family: 'Space Mono', monospace; }
.exercise-extra { display: block; }
.logged-count { font-size: 10px; color: var(--text-muted); font-family: 'Space Mono', monospace; margin: 2px 0 0; }
.set-add-row { display: flex; gap: 8px; }
.set-add-row input { flex: 1; min-width: 0; }
.set-add-row .btn { min-width: 64px; min-height: 44px; }
.timer-bar { background: var(--surface); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
.timer-bar .mono { font-size: 16px; flex: 1; }
/* ── Volume summary ── */
.vol-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
.vol-table th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 4px 0; border-bottom: 1px solid var(--border); }
.vol-table td { padding: 5px 0; border-bottom: 1px solid rgba(242,237,228,0.04); }
.vol-table .sets-val { font-family: 'Space Mono', monospace; color: var(--amber-light); }
/* ── Onboarding ── */
.onboard { display: flex; flex-direction: column; gap: 8px; padding: 48px 24px 48px; max-width: 420px; margin: 0 auto; }
.onboard-title { font-size: 28px; font-weight: 700; color: var(--amber); }
.onboard-sub { color: var(--text-muted); margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
.onboard label { font-size: 12px; color: var(--text-secondary); margin-top: 10px; display: block; }
/* ── Bottom nav ── */
.bottomnav { display: flex; justify-content: space-around; padding: 8px 0 calc(8px + var(--safe-b));
  background: var(--bg); border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; max-width: 480px; margin: 0 auto; }
.navitem { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10px; cursor: pointer; padding: 6px 16px; min-height: 44px; font-family: inherit; }
.navitem.active { color: var(--amber); }
/* ── Overlay / Modal ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0; }
.sheet { background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 20px 20px calc(20px + var(--safe-b)); max-height: 92dvh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.sheet-handle { width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 12px; }
.sheet-title { font-size: 17px; font-weight: 600; }
.modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-muted); cursor: pointer; line-height: 0; }
.day-toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.day-toggle { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; padding: 7px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
.day-toggle.active { background: var(--amber); color: #2A1800; border-color: var(--amber); font-weight: 600; }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-actions .btn { flex: 1; }
/* ── Food search ── */
.search-result { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(242,237,228,0.05); cursor: pointer; }
.search-result:active { background: var(--surface-raised); border-radius: 8px; }
.search-result-name { font-size: 14px; font-weight: 500; flex: 1; }
.search-result-meta { font-size: 11px; color: var(--text-muted); font-family: 'Space Mono', monospace; }
.search-result-tag { font-size: 10px; background: var(--surface-raised); border-radius: 4px; padding: 2px 6px; color: var(--text-muted); }
/* ── Food detail ── */
.food-detail-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 14px; }
.food-detail-macro { background: var(--surface); border-radius: 8px; padding: 8px; text-align: center; }
.food-detail-macro .val { font-size: 14px; font-weight: 600; font-family: 'Space Mono', monospace; }
.food-detail-macro .lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
/* ── Readiness stars ── */
.star-row { display: flex; gap: 6px; margin-top: 6px; }
.star-btn { background: none; border: none; font-size: 22px; cursor: pointer; padding: 2px; opacity: 0.3; transition: opacity 0.1s; }
.star-btn.active { opacity: 1; }
/* ── Shield/XP ── */
.shield-btn { display: flex; align-items: center; gap: 8px; color: var(--amber-light); background: rgba(217,139,63,0.08); border: 1px solid rgba(217,139,63,0.25); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px; font-family: inherit; width: 100%; margin-bottom: 14px; }
/* ── Regression readout ── */
.regression-card { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.regression-val { font-size: 18px; font-weight: 600; font-family: 'Space Mono', monospace; }
.regression-ci { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
/* ── Loading ── */
.loading { display: flex; align-items: center; justify-content: center; min-height: 100dvh; color: var(--text-muted); font-size: 14px; flex-direction: column; gap: 12px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ── Recipe builder ── */
.ingredient-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(242,237,228,0.05); }
.ingredient-name { flex: 1; font-size: 13px; }
.ingredient-servings { width: 60px; }
/* ── Exercise history ── */
.e1rm-note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
/* ── Progress exercise selector ── */
.ex-select-wrap { margin-bottom: 10px; }
/* ── Compact task-first layout ── */
.content { padding: 16px 14px calc(var(--nav-h) + var(--safe-b) + 18px); }
.topbar { margin-bottom: 12px; }
.section { margin-bottom: 22px; }
.section-head { margin-bottom: 7px; }
.macro-grid { gap: 6px; margin-bottom: 14px; }
.macro-card { border-radius: 8px; padding: 8px 9px 7px; }
.mc-grid { gap: 8px; margin-bottom: 18px; }
.mc-card { border-radius: 9px; padding: 10px; }
.stat-grid { gap: 8px; margin-bottom: 16px; }
.stat-card { border-radius: 9px; padding: 10px 11px; }
.advisory { border-radius: 9px; padding: 10px 11px; margin-bottom: 8px; }
.regression-card { border-radius: 9px; padding: 10px 11px; margin-bottom: 10px; }
.chart-wrap { height: 136px; }
.chart-empty { height: 136px; }
.meal-row { padding: 9px 0; }
.section > .eyebrow { margin-bottom: 7px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber-light); outline-offset: 2px; }

/* ── Iron Log visual system ── */
:root {
  --bg: #0b1220;
  --surface: #121d2d;
  --surface-raised: #18263a;
  --surface-hi: #21334b;
  --border: #263b55;
  --border-strong: #3a5573;
  --text: #f5f8fc;
  --text-secondary: #c5d2e2;
  --text-muted: #8fa3ba;
  --amber: #b8f34a;
  --amber-light: #d3ff78;
  --amber-dark: #83b52b;
  --sage: #55d6be;
  --sage-light: #8cebd9;
  --sage-dark: #237b6c;
  --rust: #ff7b83;
  --rust-light: #ffadb1;
  --rust-dark: #a63e4b;
  --nav-h: 72px;
}
body {
  background: radial-gradient(circle at 50% -10%, #1b3049 0, var(--bg) 42%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0.01em;
}
#app { max-width: 560px; }
.content { padding: 22px 16px calc(var(--nav-h) + var(--safe-b) + 28px); }
.gym-page { padding-top: 8px; }
.topbar { align-items: center; margin-bottom: 20px; }
.title { font-size: 25px; letter-spacing: -0.02em; }
.eyebrow { color: #a8bbd0; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
.section { margin-bottom: 26px; }
.section-head { margin-bottom: 10px; }
.section-head .eyebrow, .section > .eyebrow { color: #b7c8da; }
.macro-grid, .stat-grid, .mc-grid { gap: 10px; }
.macro-card, .stat-card, .mc-card, .exercise-card, .timer-bar, .regression-card {
  background: linear-gradient(145deg, rgba(24,38,58,.98), rgba(15,27,43,.98));
  border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0,0,0,.14);
}
.macro-card, .stat-card { border-radius: 14px; padding: 13px 12px; }
.mc-card { border-radius: 16px; padding: 15px; }
.mc-card:active, .exercise-card:active { border-color: var(--border-strong); }
.macro-label, .stat-sub, .mc-sub { color: #a9bbce; }
.macro-val, .stat-val, .mc-val { color: var(--text); }
.macro-bar-track { height: 5px; background: #24364e; }
.macro-bar-fill { background: var(--amber); }
input[type=number], input[type=text], input[type=password], select {
  min-height: 48px;
  background: #0f1a2a;
  border: 1px solid #38516d;
  color: var(--text);
  border-radius: 12px;
  font-size: 16px;
}
input:focus, select:focus { border-color: var(--amber); box-shadow: 0 0 0 4px rgba(184,243,74,.14); }
input::placeholder { color: #7f95ad; }
.btn {
  min-height: 44px;
  background: #1b2b42;
  border-color: #47627f;
  color: var(--text);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
}
.btn-primary { background: var(--amber); color: #142000; border-color: var(--amber); box-shadow: 0 5px 16px rgba(184,243,74,.16); }
.btn-primary:active { background: var(--amber-dark); }
.btn-ghost { min-height: 36px; color: #b7c8da; }
.exercise-card { border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; }
.exercise-card.completed-card { background:rgba(18,29,45,.7); }
.exercise-card.completed-card .exercise-extra { display:block; }
.exercise-card.completed-card .exercise-name { color:var(--text-secondary); }
.exercise-card.completed-card .logged-count { color:var(--amber-light); }
.exercise-card.active-card .exercise-extra { display:block; }
.exercise-card.active-card { border-color:var(--border-strong); }
.exercise-name { font-size: 15px; line-height: 1.2; }
.exercise-cue { color: #a9bbce; line-height: 1.45; }
.logged-count { color: #9cb1c7; font-size: 11px; }
.set-add-row { gap: 10px; margin-top: 12px !important; }
.set-add-row input { min-width: 0; }
.set-add-row .btn { flex: 0 0 72px; }
.set-chip { background: #223751; border: 1px solid #35516e; color: #d7e4f2; padding: 7px 10px; }
.advisory { background: #14253a; border-color: #38536f; border-radius: 14px; color: #d1deeb; }
.advisory .advisory-icon { color: var(--amber); }
.bottomnav {
  max-width: 560px;
  padding: 8px 8px calc(8px + var(--safe-b));
  background: rgba(11,18,32,.94);
  border-top: 1px solid #29415d;

function getExerciseData(id) {
  var allProg = IRON_LOG_PROGRAM;
  var allEx = ALTERNATES.slice();
  allProg.forEach(function(s){ allEx = allEx.concat(s.exercises); });
  return allEx.find(function(e){ return e.id === id; });
}

function getAllExercisesForMuscle(muscleStr) {
  var allProg = IRON_LOG_PROGRAM;
  var allEx = ALTERNATES.slice();
  allProg.forEach(function(s){ allEx = allEx.concat(s.exercises); });
  var seen = {}; var out = [];
  allEx.forEach(function(e){
    if(!seen[e.id] && (e.muscle === muscleStr || e.muscle.indexOf(muscleStr)>-1 || muscleStr.indexOf(e.muscle)>-1)) {
      seen[e.id] = true; out.push(e);
    }
  });
  return out;
}

// Volume table calculation dynamically based on active program
function getWeeklyVolume() {
  var prog = getActiveProgram();
  var v = { 'Quads / Glutes': 0, 'Hamstrings': 0, 'Chest': 0, 'Back': 0, 'Shoulders': 0, 'Biceps': 0, 'Triceps': 0, 'Calves': 0 };
  prog.forEach(function(sess){
    sess.exercises.forEach(function(ex){
      var m = String(ex.muscle || '').toLowerCase().split(',').map(function(mu){ return mu.trim(); });
      m.forEach(function(mu){
        var mapped = mu==='quads'?'Quads / Glutes':mu==='glutes'?'Quads / Glutes':mu==='hamstrings'?'Hamstrings':mu==='chest'?'Chest':mu==='back'?'Back':mu==='shoulders'?'Shoulders':mu==='biceps'?'Biceps':mu==='triceps'?'Triceps':mu==='calves'?'Calves':'';
        if(mapped) v[mapped] += ex.sets;
      });
    });
  });
  return Object.keys(v).map(function(k){ return {muscle:k, sets:v[k]}; });
}

function getLoggedWeeklyVolume() {
  var totals = { 'Quads / Glutes': 0, Hamstrings: 0, Chest: 0, Back: 0, Shoulders: 0, Biceps: 0, Triceps: 0, Calves: 0 };
  var cutoff = Date.now() - 7 * 86400000;
  allDayKeys().forEach(function(key) {
    if (new Date(key + 'T23:59:59').getTime() < cutoff) return;
    var workout = dayRecord(key).workout || {};
    Object.keys(workout).forEach(function(id) {
      var ex = getExerciseData(id);
      if (!ex) return;
      var count = workout[id].filter(Boolean).length;
      String(ex.muscle || '').toLowerCase().split(',').forEach(function(mu) {
        var mapped = mu.trim()==='quads'||mu.trim()==='glutes'?'Quads / Glutes':mu.trim().replace(/^./,function(c){return c.toUpperCase();});
        if (totals[mapped] != null) totals[mapped] += count;
      });
    });
  });
  return Object.keys(totals).map(function(muscle){ return {muscle:muscle, sets:totals[muscle]}; });
}

function weeklyVolumeChart() {
  var data = getLoggedWeeklyVolume(), max = Math.max.apply(null, data.map(function(v){return v.sets;}).concat([1]));
  return '<div class="volume-bars">'+data.map(function(v) {
    var pct = Math.round(v.sets / max * 100);
    return '<div class="volume-bar-row"><span>'+esc(v.muscle)+'</span><div class="volume-bar-track"><i style="width:'+pct+'%"></i></div><b>'+v.sets+'</b></div>';
  }).join('')+'</div><div class="small dim" style="margin-top:8px">Working sets · last 7 days</div>';
}

function nutritionProgressHTML(records) {
  var recent=records.slice(-7), days=recent.filter(function(r){return r.kcal>0;});
  if(!days.length) return '<div class="empty-note">Log food for a few days to see this summary.</div>';
  var kcal=Math.round(days.reduce(function(sum,r){return sum+r.kcal;},0)/days.length);
  var protein=Math.round(days.reduce(function(sum,r){return sum+r.protein;},0)/days.length);
  var target=days.reduce(function(sum,r){return sum+getTargetsForDate(r.key).kcal;},0)/days.length;
  var proteinTarget=Math.round(days.reduce(function(sum,r){return sum+getTargetsForDate(r.key).protein;},0)/days.length);
  var kcalPct=Math.min(100,Math.round(kcal/target*100)), proteinPct=Math.min(100,Math.round(protein/proteinTarget*100));
  return '<div class="nutrition-summary"><div><strong>'+kcal+'</strong><span>avg kcal</span></div><div><strong>'+protein+'g</strong><span>avg protein</span></div><div><strong>'+Math.round(target)+'</strong><span>avg target</span></div></div>'
    +'<div class="nutrition-bars"><div><div class="nutrition-bar-head"><span>Calories</span><b>'+kcalPct+'%</b></div><div class="nutrition-bar-track"><i style="width:'+kcalPct+'%"></i></div></div>'
    +'<div><div class="nutrition-bar-head"><span>Protein</span><b>'+proteinPct+'%</b></div><div class="nutrition-bar-track protein"><i style="width:'+proteinPct+'%"></i></div></div></div>';
}

// ── LocalStorage & SQLite helpers ────────────────────────────────────────────────
var SQLiteStorage = {
  db: null,
  cache: {},
  active: false,
  
  init: function(callback) {
    var self = this;
    if (window.Capacitor && window.Capacitor.isPluginAvailable('CapacitorSQLite')) {
      try {
        var sqlite = window.Capacitor.Plugins.CapacitorSQLite;
        sqlite.createConnection({ database: 'regain_storage', version: 1, encrypted: false, mode: 'no-encryption' })
          .then(function(conn) {
            self.db = conn;
            return sqlite.open({ database: 'regain_storage' });
          })
          .then(function() {
            var query = 'CREATE TABLE IF NOT EXISTS rg_storage (key TEXT PRIMARY KEY, value TEXT);';
            return window.Capacitor.Plugins.CapacitorSQLite.execute({ database: 'regain_storage', statements: query });
          })
          .then(function() {
            var select = 'SELECT * FROM rg_storage;';
            return window.Capacitor.Plugins.CapacitorSQLite.query({ database: 'regain_storage', statement: select });
          })
          .then(function(res) {
            if (res && res.values) {
              res.values.forEach(function(row) {
                self.cache[row.key] = row.value;
                localStorage.setItem(row.key, row.value); // Self-healing sync
              });
            }
            self.active = true;
            console.log('SQLite database pre-loaded successfully!');
            if (callback) callback();
          })
          .catch(function(err) {
            console.error('SQLite init error, falling back to LocalStorage:', err);
            self.active = false;
            if (callback) callback();
          });
      } catch(e) {
        console.error('Capacitor SQLite plugin error:', e);
        self.active = false;
        if (callback) callback();
      }
    } else {
      self.active = false;
      if (callback) callback();
    }
  },
  
  get: function(key) {
    return this.cache[key] || null;
  },
  
  set: function(key, valStr) {
    this.cache[key] = valStr;
    if (this.active && window.Capacitor) {
      var query = 'INSERT OR REPLACE INTO rg_storage (key, value) VALUES (?, ?);';
      window.Capacitor.Plugins.CapacitorSQLite.executeJSPS({
        database: 'regain_storage',
        statements: query,
        values: [key, valStr]
      }).catch(function(e) {
        console.error('SQLite write error:', e);
      });
    }
  },
  
  delete: function(key) {
    delete this.cache[key];
    localStorage.removeItem(key);
    if (this.active && window.Capacitor) {
      var query = 'DELETE FROM rg_storage WHERE key = ?;';
      window.Capacitor.Plugins.CapacitorSQLite.executeJSPS({
        database: 'regain_storage',
        statements: query,
        values: [key]
      }).catch(function(e) {
        console.error('SQLite delete error:', e);
      });
    }
  },

  clear: function() {
    var self=this;
    Object.keys(this.cache).forEach(function(key){delete self.cache[key];});
    localStorage.clear();
    if(this.active && window.Capacitor) {
      return window.Capacitor.Plugins.CapacitorSQLite.executeJSPS({
        database:'regain_storage',
        statements:'DELETE FROM rg_storage;'
      }).catch(function(e){console.error('SQLite clear error:',e);throw e;});
    }
    return Promise.resolve();
  }
};

function ls(k, fb) {
  try {
    var v = SQLiteStorage.active ? SQLiteStorage.get(k) : localStorage.getItem(k);
    return v ? JSON.parse(v) : fb;
  } catch(e) {
    return fb;
  }
}

function sv(k, v) {
  try {
    var valStr = JSON.stringify(v);
    localStorage.setItem(k, valStr);
    SQLiteStorage.set(k, valStr);
    return true;
  } catch(e) {
    console.error('Save failed for '+k, e);
    if(typeof showToast === 'function') showToast('Could not save data. Export a backup and try again.','warn');
    return false;
  }
}

function hashPin(pin, salt) {
  var bytes = new TextEncoder().encode(pin);
  return crypto.subtle.importKey('raw', bytes, 'PBKDF2', false, ['deriveBits']).then(function(key) {
    return crypto.subtle.deriveBits({name:'PBKDF2', salt:new TextEncoder().encode(salt), iterations:310000, hash:'SHA-256'}, key, 256);
  }).then(function(bits) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(bits)));
  });
}

function verifyPin(pin, stored) {
  return hashPin(pin, stored.salt).then(function(hash) { return hash === stored.hash; });
}

// ── Profile / Day helpers ──────────────────────────────────────────────────────
function dayRecord(key) { return ls('rg_day_'+key, {weight:null,sleep:null,readiness:null,meals:{},extra:[],workout:{},workoutDone:false,shielded:false}); }
var WORKOUT_SESSIONS_KEY = 'rg_workout_sessions';
var WORKOUT_SESSIONS_VERSION = 2;

function workoutSessionId(dayKey, programDayIndex) {
  var suffix = programDayIndex == null ? 'all' : String(programDayIndex);
  return 'workout_session_' + String(dayKey || '').replace(/[^0-9A-Za-z_-]/g, '_') + '_' + suffix;
}

function workoutHasSets(workout) {
  return workout && Object.keys(workout).some(function(id) {
    return Array.isArray(workout[id]) && workout[id].some(function(set) {
      return set && (Number(set.weight) > 0 || Number(set.reps) > 0);
    });
  });
}

function programDayIdentity(sequence, programLength) {
  var length = Math.max(1, Number(programLength) || (getActiveProgram() || []).length || 1);
  var position = Math.max(0, Number(sequence) || 0);
  var dayIndex = position % length;
  var week = Math.floor(position / length) + 1;
  var programDay = (getActiveProgram() || [])[dayIndex] || {};
  return {
    week: week,
    day: dayIndex + 1,
    index: dayIndex,
    label: programDay.label || ('Day ' + (dayIndex + 1))
  };
}

function workoutExerciseMatch(exercise, planned) {
  if (!exercise || !planned) return 0;
  if (exercise.id === planned.id) return 3;
  var actual = String(exercise.muscle || '').toLowerCase().split(',');
  var target = String(planned.muscle || '').toLowerCase().split(',');
  return actual.some(function(muscle) {
    return target.some(function(candidate) { return muscle.trim() && muscle.trim() === candidate.trim(); });
  }) ? 1 : 0;
}

function groupWorkoutExercises(workout) {
  var program = getActiveProgram() || [];
  var groups = program.map(function(day, index) {
    return {index:index, label:day.label, exercises:[], score:0};
  });
  Object.keys(workout || {}).forEach(function(id) {
    var exercise = getExerciseData(id) || {id:id, name:id, muscle:''};
    var best = -1;
    var bestScore = -1;
    groups.forEach(function(group, index) {
      var score = (program[index].exercises || []).reduce(function(total, planned) {
        return Math.max(total, workoutExerciseMatch(exercise, planned));
      }, 0);
      if (score > bestScore) { bestScore = score; best = index; }
    });
    if (best >= 0) {
      groups[best].score += Math.max(0, bestScore);
      groups[best].exercises.push({id:id, sets:workout[id] || []});
    }
  });
  return groups.filter(function(group) { return group.exercises.length; });
}

function workoutSessionStore() {
  var stored = ls(WORKOUT_SESSIONS_KEY, null);
  if (!stored || stored.version !== WORKOUT_SESSIONS_VERSION || !stored.sessions) {
    return {version:WORKOUT_SESSIONS_VERSION, sessions:{}, migrated:false};
  }
  return stored;
}

function saveWorkoutSession(session) {
  if (!session || !session.id) return false;
  var store = workoutSessionStore();
  store.sessions[session.id] = session;
  return sv(WORKOUT_SESSIONS_KEY, store);
}

function getWorkoutSession(dayKey, programDayIndex) {
  var store = workoutSessionStore();
  var exact = store.sessions[workoutSessionId(dayKey, programDayIndex)];
  if (exact) return exact;
  return store.sessions[workoutSessionId(dayKey, 'all')] || null;
}

function getWorkoutSessions() {
  var store = workoutSessionStore();
  return Object.keys(store.sessions).map(function(id) { return store.sessions[id]; }).sort(function(a,b) {
    return String(a.dayKey || '').localeCompare(String(b.dayKey || ''));
  });
}

function workoutDayKeys() {
  var keys = {};
  Object.keys(localStorage).forEach(function(key) {
    if (key.indexOf('rg_day_') === 0) keys[key.slice(7)] = true;
  });
  Object.keys(SQLiteStorage.cache || {}).forEach(function(key) {
    if (key.indexOf('rg_day_') === 0) keys[key.slice(7)] = true;
  });
  return Object.keys(keys);
}

function saveWorkoutSessionFromDay(dayKey, rec, sequence) {
  if (!rec || !workoutHasSets(rec.workout)) return null;
  var groups = groupWorkoutExercises(rec.workout);
  var programLength=(getActiveProgram() || []).length;
  var saved=[];
  groups.forEach(function(group, groupIndex) {
    var identity = programDayIdentity(sequence + groupIndex, programLength);
    var groupMeta=(rec.workoutMetaBySession||{})[String(group.index)]||rec.workoutMeta||{};
    var session = {
      id: workoutSessionId(dayKey, group.index),
      dayKey: dayKey,
      week: identity.week,
      day: group.index + 1,
      programDay: group.index,
      programLabel: group.label || identity.label,
      exerciseGroups: [group],
      exercises: group.exercises,
      completed: !!(groupMeta.completedAt || rec.workoutDone),
      completedAt: groupMeta.completedAt || null,
      startedAt: groupMeta.startedAt || null,
      durationMinutes: groupMeta.durationMinutes || null,
      updatedAt: new Date().toISOString()
    };
    saveWorkoutSession(session);
    saved.push(session);
  });
  return saved;
}

function migrateWorkoutSessions() {
  var store = workoutSessionStore();
  if (store.migrated) return;
  var records = [];
  workoutDayKeys().sort().forEach(function(key) {
    var rec = dayRecord(key);
    if (workoutHasSets(rec.workout)) records.push({key:key, rec:rec});
  });
  records.forEach(function(item, index) {
    saveWorkoutSessionFromDay(item.key, item.rec, index * ((getActiveProgram() || []).length || 1));
  });
  store = workoutSessionStore();
  store.migrated = true;
  sv(WORKOUT_SESSIONS_KEY, store);
}

function saveDayRecord(key,rec){
  sv('rg_day_'+key, rec);
  saveWorkoutSessionFromDay(key, rec, Object.keys(workoutSessionStore().sessions).length);
}

function goalDirection() {

function goalLabel() {

}

function goalRateLabel() {

}

function profileName() {

function personalizedEyebrow(context) {

function currentWeight() {
  var keys = allDayKeys().reverse();
  for (var i = 0; i < keys.length; i++) {
    var r = dayRecord(keys[i]);
    if (r.weight != null) return r.weight;
  }
  return profile ? parseFloat(profile.startWeight) : null;
}

function getTargetsForDate(dateStr) {
  if(!profile) return { kcal: CAL_TARGET_REST, protein: PROT_TARGET_REST, carbs: 415, fat: 100 };
  var d = new Date(dateStr + 'T00:00:00');
  var tdays = profile.trainingDays || [1,3,5];
  var isTrain = tdays.includes(d.getDay());
  return {
    kcal: isTrain ? (profile.calTargetGym || (profile.goal === 'loss' ? 2700 : CAL_TARGET_GYM)) : (profile.calTargetRest || (profile.goal === 'loss' ? 2500 : CAL_TARGET_REST)),
    protein: isTrain ? (profile.protTargetGym || PROT_TARGET_GYM) : (profile.protTargetRest || PROT_TARGET_REST),
    carbs: isTrain ? 475 : 415,
    fat: isTrain ? 110 : 100
  };
}

function getWeeklyAvocadosCount() {
  if(!profile) return 0;
  var dayNum = currentDayNum();
  var weekNum = Math.ceil(dayNum/7);
  var startDayOfThisWeek = (weekNum - 1) * 7 + 1;
  var endDayOfThisWeek = weekNum * 7;
  var count = 0;
  var start = new Date(profile.startDate);
  for (var i = startDayOfThisWeek; i <= endDayOfThisWeek; i++) {
    var d = addDays(start, i - 1);
    var key = dateKey(d);
    var rec = dayRecord(key);
    count += (rec.avocados || 0);
  }
  return count;
}

function getDayTotals(key) {
  var rec = dayRecord(key);
  var plan = (profile && profile.mealPlan) || DEFAULT_MEAL_PLAN;
  var t = {kcal:0, protein:0, carbs:0, fat:0};
  Object.keys(plan).forEach(function(gKey){
    var group = plan[gKey];
    (group.items||[]).forEach(function(item){
      if(rec.meals[item.id]){
        t.kcal += item.kcal;
        t.protein += item.protein;
        t.carbs += item.carbs;
        t.fat += item.fat;
      }
    });
  });
  if(rec.avocados) {
    t.kcal += rec.avocados * 240;
    t.protein += rec.avocados * 3;
    t.carbs += rec.avocados * 13;
    t.fat += rec.avocados * 22;
  }
  (rec.extra||[]).forEach(function(e){
    t.kcal += e.kcal * (e.servings || 1);
    t.protein += e.protein * (e.servings || 1);
    t.carbs += e.carbs * (e.servings || 1);
    t.fat += e.fat * (e.servings || 1);
  });
  return {kcal:Math.round(t.kcal), protein:+t.protein.toFixed(1), carbs:+t.carbs.toFixed(1), fat:+t.fat.toFixed(1)};
}

function currentDayNum(){ return daysBetween(new Date(profile.startDate), new Date(todayKey())) + 1; }

function allDayKeys() {
  var start = new Date(profile.startDate); start.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  var n = daysBetween(start, today)+1; var out = [];
  for(var i=0;i<n;i++) out.push(dateKey(addDays(start,i)));
  return out;
}

function computeStreak() {
  if(!profile) return 0;
  var streak = 0;
  var d = addDays(new Date(),-1); d.setHours(0,0,0,0);
  var start = new Date(profile.startDate); start.setHours(0,0,0,0);
  while(d >= start) {
    var key = dateKey(d); var rec = dayRecord(key);
    var ct = getTargetsForDate(key).kcal;
    if(getDayTotals(key).kcal >= ct*0.9 || rec.shielded) { streak++; d = addDays(d,-1); }
    else break;
  }
  return streak;
}

function yesterdayMissed() {
  if(!profile) return false;
  var d = addDays(new Date(),-1); d.setHours(0,0,0,0);
  var start = new Date(profile.startDate); start.setHours(0,0,0,0);
  if(d < start) return false;
  var key = dateKey(d); var rec = dayRecord(key);
  var ct = getTargetsForDate(key).kcal;
  return getDayTotals(key).kcal < ct*0.9 && !rec.shielded;
}

// ── Workout session type (A/B alternation) ────────────────────────────────────
function getSessionType() {
  var tdays = profile ? (profile.trainingDays||[1,3,5]) : [1,3,5];
  var todayDay = new Date().getDay();
  var start = new Date(profile.startDate); start.setHours(0,0,0,0);
  var today = new Date(); today.setHours(0,0,0,0);
  var count = 0;
  var d = new Date(start);
  while(d <= today) {
    if(tdays.includes(d.getDay())) count++;
    d.setDate(d.getDate()+1);
  }
  var prog = getActiveProgram();
  return prog[(count - 1 + prog.length) % prog.length] || prog[0];
}

// ── e1RM (Epley formula) ──────────────────────────────────────────────────────
function calcE1RM(w, r) { return r===1 ? w : w*(1 + r/30); }

function getBestE1RM(exId) {
  var best = 0;
  allDayKeys().forEach(function(key){
    var rec = dayRecord(key);
    var sets = (rec.workout||{})[exId] || [];
    sets.forEach(function(s){ var e = calcE1RM(s.weight,s.reps); if(e>best) best=e; });
  });
  return best > 0 ? best : null;
}

// ── Linear regression + 95% CI ────────────────────────────────────────────────
function linReg(ys) {
  var n = ys.length;
  if(n < 3) return null;
  var xs = ys.map(function(_,i){return i;});
  var sx=0,sy=0,sxy=0,sx2=0;
  for(var i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxy+=xs[i]*ys[i];sx2+=xs[i]*xs[i];}
  var denom = n*sx2 - sx*sx;
  if(!denom) return null;
  var slope = (n*sxy - sx*sy)/denom;
  var inter = (sy - slope*sx)/n;
  var pred  = xs.map(function(x){return slope*x+inter;});
  var sse   = ys.reduce(function(a,y,i){return a+Math.pow(y-pred[i],2);},0);
  var ssx   = sx2 - sx*sx/n;
  var se    = ssx>0 ? Math.sqrt(sse/((n-2)*ssx)) : 0;
  var t     = n>=8 ? 2.0 : n>=6 ? 2.2 : 2.57;
  return {slope:slope, inter:inter, ci:t*se, n:n};
}

// ── Macro calculations from food + servings ───────────────────────────────────
function foodMacros(food, servings) {
  var f = (food.serving_g * servings) / 100;
  return {
    kcal:    Math.round(food.kcal    * f),
    protein: +((food.protein || 0) * f).toFixed(1),
    carbs:   +((food.carbs   || 0) * f).toFixed(1),
    fat:     +((food.fat     || 0) * f).toFixed(1),
  };
}

// ── Recent foods ──────────────────────────────────────────────────────────────
function addRecent(name, kcal, protein, carbs, fat) {
  var r = ls('rg_recent_foods', []);
  var ex = r.find(function(x){return x.name.toLowerCase()===name.toLowerCase();});
  if(ex){ ex.count++; ex.kcal=kcal; ex.protein=protein; ex.carbs=carbs; ex.fat=fat; }
  else r.push({name:name,kcal:kcal,protein:protein,carbs:carbs,fat:fat,count:1});
  r.sort(function(a,b){return b.count-a.count;});
  sv('rg_recent_foods', r.slice(0,10));
}

// ── Day status ────────────────────────────────────────────────────────────────
function dayStatus(kcal, target) {
  if(!kcal) return 'none';
  var r = kcal/target;
  if(r<0.9) return 'under';
  if(r>1.15) return 'aggressive';
  return 'target';
}

// ── SVG gauge (half-circle) ───────────────────────────────────────────────────
function buildGauge(logged, target) {
  var max = target*1.4;
  var fU = Math.min(0.9*target/max,1), fO = Math.min(1.15*target/max,1);
  var cx=150,cy=150,r=120;
  function angle(f){return Math.PI*(1-f);}
  function pt(f){var a=angle(f);return[cx+r*Math.cos(a),cy-r*Math.sin(a)];}
  function arc(f0,f1,col){
    var p0=pt(f0),p1=pt(f1);
    return '<path d="M '+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A '+r+' '+r+' 0 0 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="18" stroke-linecap="round"/>';
  }
  var segs = arc(0,fU,'#2D2918')+arc(fU,fO,'#486440')+arc(fO,1,'#6B2A1E');
  var nf=Math.min(logged/max,1);
  var rot = (nf * 180).toFixed(1);
  var gaugeColor = logged>=target*1.15?'#D17B68':logged>=target*0.9?'#A8C29C':'#D98B3F';
  return '<svg viewBox="0 0 300 162" style="width:100%;display:block" role="img" aria-label="Calorie gauge">'
    +segs
    +'<line id="gaugeNeedle" x1="'+cx+'" y1="'+cy+'" x2="'+(cx-r)+'" y2="'+cy+'" stroke="'+gaugeColor+'" stroke-width="4" stroke-linecap="round" data-rotate="'+rot+'" style="transform: rotate(0deg); transform-origin: 150px 150px; transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+gaugeColor+'"/>'
    +'</svg>';
}

// ── Status pill ───────────────────────────────────────────────────────────────
function statusPill(status, remaining) {
  var M = {
    under:      {ic:'bolt',  color:'var(--text-secondary)',bg:'rgba(255,255,255,0.04)',label:remaining>0?(remaining+' kcal to go'):'logging…'},
    target:     {ic:'check', color:'var(--sage-light)',    bg:'rgba(124,148,115,0.15)',label:remaining>0?('on target · '+remaining+' to go'):'on target ✓'},
    aggressive: {ic:'info',  color:'var(--rust-light)',    bg:'rgba(181,80,61,0.15)',  label:'aggressive surplus'},
    none:       {ic:'bolt',  color:'var(--text-muted)',    bg:'rgba(255,255,255,0.04)',label:'nothing logged yet'},
  };
  var s = M[status]; if(!s) s=M.none;
  return '<span class="pill" style="color:'+s.color+';background:'+s.bg+'">'+ic(s.ic)+' '+s.label+'</span>';
}

// ── Macro bar ─────────────────────────────────────────────────────────────────
function macroBar(label, val, target, color) {
  var pct = Math.min(100, target>0 ? (val/target*100) : 0);
  return '<div class="macro-card">'
    +'<div class="macro-label">'+label+'</div>'
    +'<div class="macro-val" style="color:'+color+'">'+val+'<span style="font-size:11px;color:var(--text-muted)">g</span></div>'
    +'<div class="macro-bar-track"><div class="macro-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
    +'</div>';
}

function buildWeeklyDigestHTML() {
  var keys = allDayKeys();
  var records = keys.map(function(k){
    var r = dayRecord(k); var t = getDayTotals(k);
    var hasWorkout = (r.workoutDone || (r.workout && Object.keys(r.workout).length > 0));
    return {key:k,weight:r.weight,kcal:t.kcal,workoutDone:hasWorkout};
  });
  
  // Get records from the past 7 days (the current week)
  var last7 = records.slice(-7);
  if (last7.length === 0) return '';
  
  var sumKcal = 0, countKcal = 0;
  var sumW = 0, countW = 0;
  var firstW = null, lastW = null;
  var gymDaysDone = 0, gymDaysScheduled = 0;
  
  last7.forEach(function(r){
    if (r.kcal > 0) {
      sumKcal += r.kcal;
      countKcal++;
    }
    if (r.weight != null) {
      if (firstW === null) firstW = r.weight;
      lastW = r.weight;
    }
    
    var d = new Date(r.key + 'T00:00:00');
    var isTrain = (profile.trainingDays || [1,3,5]).includes(d.getDay());
    if (isTrain) {
      gymDaysScheduled++;
      if (r.workoutDone) gymDaysDone++;
    }
  });
  
  var avgK = countKcal ? Math.round(sumKcal / countKcal) : 0;
  var deltaW = (firstW != null && lastW != null) ? (lastW - firstW) : null;
  
  var digestStr = '';
  digestStr += avgK ? 'avg ' + avgK + ' kcal' : 'no kcal';
  if (deltaW != null) {
    digestStr += ', ' + (deltaW >= 0 ? '+' : '') + deltaW.toFixed(2) + 'kg';
  } else {
    digestStr += ', -- kg';
  }
  digestStr += ', ' + gymDaysDone + '/' + gymDaysScheduled + ' gym';
  
  return '<div style="background:var(--surface-raised); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-top:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center">'
    +'<div><span class="eyebrow" style="margin:0">Weekly Digest</span><div style="font-weight:600;font-size:13.5px;color:var(--text-secondary);margin-top:2px">Closing the loop</div></div>'
    +'<div class="mono" style="font-size:12px;color:var(--sage-light);text-align:right">' + digestStr + '</div>'
    +'</div>';
}

function openCheckinSheet(dayKey) {
  var rec = dayRecord(dayKey);
  
  // Find last logged weight for pre-fill
  var preW = rec.weight;
  if (!preW) {
    var keys = allDayKeys().reverse();
    for (var i = 0; i < keys.length; i++) {
      var r = dayRecord(keys[i]);
      if (r.weight) {
        preW = r.weight;
        break;
      }
    }
  }
  if (!preW) preW = parseFloat(profile.startWeight) || 54.0;

  var sleepVal = rec.sleep != null ? rec.sleep : 8;
  var readinessVal = rec.readiness != null ? rec.readiness : 3;
  var noteVal = rec.note || '';

  var overlay = document.createElement('div'); overlay.className = 'overlay';
  overlay.innerHTML = '<div class="sheet">'
    +'<div class="sheet-handle"></div>'
    +'<div class="sheet-title">☀️ Morning Check-in</div>'
    
    +'<label class="eyebrow" style="margin-top:12px">Body Weight (kg)</label>'
    +'<input type="number" step="0.1" id="recWeight" value="'+preW+'" style="width:100%" inputmode="decimal">'
    
    +'<label class="eyebrow" style="margin-top:16px">Sleep Duration (hours)</label>'
    +'<input type="number" step="0.5" id="recSleep" value="'+sleepVal+'" style="width:100%" inputmode="decimal">'
    
    +'<label class="eyebrow" style="margin-top:16px">Readiness (1 = Poor, 5 = Great)</label>'
    +'<div style="display:flex;gap:6px;margin-top:4px">'
      +[1,2,3,4,5].map(function(num){
        return '<button class="btn btn-sm ready-btn'+(readinessVal===num?' active':'')+'" data-val="'+num+'" style="flex:1">'+num+'</button>';
      }).join('')
    +'</div>'
    
    +'<label class="eyebrow" style="margin-top:16px">Daily Note (optional)</label>'
    +'<input type="text" id="recNote" value="'+noteVal+'" placeholder="e.g. Felt strong, sore shoulders, exam stress..." style="width:100%">'
    
    +'<div class="modal-actions" style="margin-top:20px">'
      +'<button class="btn" id="closeCheckinBtn" style="flex:1">Cancel</button>'
      +'<button class="btn btn-primary" id="saveCheckinBtn" style="flex:1">Save</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(overlay);

  var selectedReadiness = readinessVal;

  overlay.querySelectorAll('.ready-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      overlay.querySelectorAll('.ready-btn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      selectedReadiness = parseInt(btn.dataset.val, 10);
    });
  });

  overlay.querySelector('#closeCheckinBtn').addEventListener('click',function(){overlay.remove();});
  overlay.querySelector('#saveCheckinBtn').addEventListener('click',function(){
    var w = parseFloat(document.getElementById('recWeight').value);
    if(w && (w<20 || w>300)) { showToast('Enter a valid weight', 'warn'); return; }
    var s = parseFloat(document.getElementById('recSleep').value) || 8;
    var n = document.getElementById('recNote').value.trim();
    
    rec = dayRecord(dayKey);
    rec.weight = w || null;
    rec.sleep = s;
    rec.readiness = selectedReadiness;
    rec.recovery = selectedReadiness >= 3 ? 'good' : 'bad';
    rec.note = n;
    saveDayRecord(dayKey, rec);
    overlay.remove();
    renderTodaySimple();
  });
}

function attachTodayEvents(key, rec) {
  // Plan item toggles
  document.querySelectorAll('.plan-chk').forEach(function(chk){
    chk.addEventListener('change', function(){
      triggerHaptic();
      var id = chk.dataset.itemid; rec = dayRecord(key);
      rec.meals[id] = chk.checked;
      profile.xp = Math.max(0, (profile.xp||0) + (chk.checked ? 10 : -10));
      saveDayRecord(key, rec); sv('rg_profile', profile);
      renderToday();
    });
  });
  // Plan item settings / edit
  document.querySelectorAll('.edit-item-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openEditItemSheet(btn.dataset.itemid, btn.dataset.group);
    });
  });
  // Appetite Toggle
  var appToggle = document.getElementById('appetiteToggle');
  if(appToggle) {
    appToggle.addEventListener('change', function(){
      triggerHaptic();
      rec = dayRecord(key);
      rec.badAppetite = appToggle.checked;
      saveDayRecord(key, rec);
      renderToday();
    });
  }
  // Avocado logging
  var addAvo = document.getElementById('addAvoBtn');
  if(addAvo) {
    addAvo.addEventListener('click', function(){
      triggerHaptic();
      rec = dayRecord(key); rec.avocados = (rec.avocados || 0) + 1;
      profile.xp = (profile.xp||0)+5; sv('rg_profile', profile);
      saveDayRecord(key, rec); renderToday();
    });
  }
  var remAvo = document.getElementById('remAvoBtn');
  if(remAvo) {
    remAvo.addEventListener('click', function(){
      triggerHaptic();
      rec = dayRecord(key);
      if((rec.avocados||0) > 0) {
        rec.avocados--;
        profile.xp = Math.max(0, (profile.xp||0)-5); sv('rg_profile', profile);
        saveDayRecord(key, rec); renderToday();
      }
    });
  }
  // Extra food remove
  document.querySelectorAll('.meal-toggle[data-extra]').forEach(function(btn){
    btn.addEventListener('click', function(){
      triggerHaptic();
      var i = parseInt(btn.dataset.extra,10); rec = dayRecord(key);
      rec.extra.splice(i,1); saveDayRecord(key,rec); renderToday();
    });
  });
  // Recent chips
  document.querySelectorAll('.chip[data-recent]').forEach(function(chip){
    chip.addEventListener('click', function(){
      var r = JSON.parse(decodeURIComponent(chip.dataset.recent));
      rec = dayRecord(key);
      rec.extra.push({name:r.name,kcal:r.kcal,protein:r.protein||0,carbs:r.carbs||0,fat:r.fat||0,servings:1});
      profile.xp = (profile.xp||0)+5; sv('rg_profile',profile);
      saveDayRecord(key,rec); renderToday();
    });
  });
  var rc = document.getElementById('checkinCard');
  if(rc) rc.addEventListener('click', function(){ openCheckinSheet(key); });
  
  var appTog = document.getElementById('appetiteToggle');
  if(appTog) {
    appTog.addEventListener('change', function(){
      rec = dayRecord(key);
      rec.badAppetite = appTog.checked;
      saveDayRecord(key, rec);
      renderToday();
    });
  }

  var expNudge = document.getElementById('exportNudgeBtn');
  if(expNudge) {
    expNudge.addEventListener('click', function(){
      exportData();
      renderToday();
    });
  }
  // Add food
  var af = document.getElementById('addFoodBtn');
  if(af) af.addEventListener('click', function(){ openFoodSearch(function(food,srvs){ addFoodToDay(key,food,srvs); }); });
  // Shield
  var sb = document.getElementById('useShieldBtn');
  if(sb) sb.addEventListener('click', function(){
    var yk = dateKey(addDays(new Date(),-1)); var yr = dayRecord(yk);
    yr.shielded=true; saveDayRecord(yk,yr);
    profile.shields=(profile.shields||0)-1; sv('rg_profile',profile);
    renderToday();
  });
  // Settings
  var sg = document.getElementById('settingsBtn');
  if(sg) sg.addEventListener('click', openSettings);
  // Edit meals (reset plan)
  var em = document.getElementById('editMealsBtn');
  if(em) em.addEventListener('click', openMealEditor);
}

function addFoodToDay(key, food, servings) {
  var m = foodMacros(food, servings);
  var rec = dayRecord(key);
  rec.extra.push({name:food.name+(servings!==1?' ×'+servings:''),kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,servings:1});
  saveDayRecord(key, rec);
  addRecent(food.name, m.kcal, m.protein, m.carbs, m.fat);
  profile.xp=(profile.xp||0)+5; sv('rg_profile',profile);
  renderTodaySimple();
}

function migrateFoodTotals() {
  if(!profile || !profile.startDate) return;
  if (ls('rg_food_totals_v2', false)) return;
  allDayKeys().forEach(function(key) {
    var rec=dayRecord(key), changed=false;
    (rec.extra||[]).forEach(function(item) {
      var servings=Number(item.servings)||1;
      if(servings>1) {
        item.kcal=+(Number(item.kcal||0)).toFixed(1);
        item.protein=+(Number(item.protein||0)).toFixed(1);
        item.carbs=+(Number(item.carbs||0)).toFixed(1);
        item.fat=+(Number(item.fat||0)).toFixed(1);
        item.servings=1;
        changed=true;
      }
    });
    if(changed) saveDayRecord(key,rec);
  });
  sv('rg_food_totals_v2', true);
}

function renderProgress() {
  var keys = allDayKeys();
  var records = keys.map(function(k){
    var r = dayRecord(k); var t = getDayTotals(k);
    return {key:k,weight:r.weight,readiness:r.readiness,kcal:t.kcal,protein:t.protein,carbs:t.carbs,fat:t.fat};
  });

  // Calculate weighted average targets for the past 7 days for the dashboard
  var last7 = records.slice(-7);
  var sumCt = 0, sumPt = 0;
  last7.forEach(function(r){
    var t = getTargetsForDate(r.key);
    sumCt += t.kcal; sumPt += t.protein;
  });
  var avgCt = last7.length ? Math.round(sumCt / last7.length) : CAL_TARGET_REST;
  var avgPt = last7.length ? Math.round(sumPt / last7.length) : PROT_TARGET_REST;
  var ct = avgCt; // for rendering
  var pt = avgPt; // for rendering

  // Weekly weight averages
  var weeklyWeights = [];
  for(var i=0;i<records.length;i+=7){
    var chunk=records.slice(i,i+7).filter(function(r){return r.weight!=null;});
    if(chunk.length) weeklyWeights.push(+(chunk.reduce(function(s,r){return s+r.weight;},0)/chunk.length).toFixed(2));
  }

  var withW = records.filter(function(r){return r.weight!=null;});
  var curW = withW.length?withW[withW.length-1].weight:null;
  var startW = parseFloat(ls('rg_profile',{}).startWeight||54);
  var delta = curW!=null ? curW-startW : null;

  // Regression on weekly weights
  var reg = weeklyWeights.length>=3 ? linReg(weeklyWeights) : null;
  var weeklyGainPct = reg ? reg.slope/weeklyWeights[0]*100 : null;
  var inRange = weeklyGainPct!=null && weeklyGainPct>=GAIN_LOW/startW*100*0.6 && weeklyGainPct<=GAIN_HIGH/startW*100*1.4;

  // Streak + avg kcal this week
  var streak = computeStreak();
  var last7 = records.slice(-7);
  var avgKcal7 = last7.length ? Math.round(last7.reduce(function(s,r){return s+r.kcal;},0)/last7.length) : 0;

  var measurements = profile.measurements || [];
  var photos = profile.photos || [];

  var measHTML = '<div class="section"><div class="section-head"><span class="eyebrow">body measurements (cm)</span><button class="btn-ghost" id="addMeasBtn">log new</button></div>';
  if(measurements.length) {
    measHTML += '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px">';
    measurements.slice(-5).forEach(function(m){
      measHTML += '<div style="background:var(--surface);padding:10px;border-radius:10px;min-width:120px;font-size:13px"><div class="eyebrow" style="margin-bottom:6px">'+new Date(m.date).toLocaleDateString([],{month:'short',day:'numeric'})+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span class="dim">Chest</span><span>'+(m.chest||'–')+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span class="dim">Arms</span><span>'+(m.arms||'–')+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span class="dim">Waist</span><span>'+(m.waist||'–')+'</span></div>'
        +'<div style="display:flex;justify-content:space-between"><span class="dim">Thighs</span><span>'+(m.thighs||'–')+'</span></div></div>';
    });
    measHTML += '</div>';
  } else {
    measHTML += '<div class="chart-empty">Log measurements every 2 weeks</div>';
  }
  measHTML += '</div>';

  var photoHTML = '<div class="section"><div class="section-head"><span class="eyebrow">progress photos</span><button class="btn-ghost" id="addPhotoBtn">upload</button></div>';
  if(photos.length) {
    photoHTML += '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px">';
    photos.slice(-5).forEach(function(p){
      photoHTML += '<div style="flex-shrink:0;width:100px"><img src="'+p.srcBase64+'" style="width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--border)"><div class="eyebrow" style="text-align:center;margin-top:4px">'+new Date(p.date).toLocaleDateString([],{month:'short',day:'numeric'})+'</div></div>';
    });
    photoHTML += '</div>';
  } else {
    photoHTML += '<div class="chart-empty">Take your first progress photo</div>';
  }
  photoHTML += '<input type="file" id="photoInput" accept="image/*" style="display:none"></div>';

  var notesHTML = '';
  var recentNotes = [];
  records.forEach(function(r){
    var dayRec = dayRecord(r.key);
    if(dayRec.note) {
      recentNotes.push({date: r.key, note: dayRec.note, weight: dayRec.weight});
    }
  });
  if (recentNotes.length > 0) {
    notesHTML += '<div class="section"><span class="eyebrow">daily notes log</span>'
      +'<div style="max-height:200px;overflow-y:auto;background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border)">';
    recentNotes.reverse().slice(0, 10).forEach(function(n){
      notesHTML += '<div style="font-size:12px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:6px">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px">'
          +'<span class="mono" style="color:var(--text-muted)">' + new Date(n.date + 'T00:00:00').toLocaleDateString([], {month:'short', day:'numeric'}) + '</span>'
          +(n.weight ? '<span class="mono" style="color:var(--sage-light)">' + n.weight + ' kg</span>' : '')
        +'</div>'
        +'<div style="color:var(--text-secondary);font-style:italic">"' + n.note + '"</div>'
        +'</div>';
    });
    notesHTML += '</div></div>';
  }

  var targetW = profile.targetWeight || 60.0;
  var goalText = 'Log weight regularly to estimate target date';
  if(weeklyWeights.length >= 2) {
    var slope = reg ? reg.slope : 0;
    if(slope === 0 && weeklyWeights.length >= 2) {
      slope = weeklyWeights[weeklyWeights.length-1] - weeklyWeights[0];
      var wWeeks = Math.max(1, weeklyWeights.length - 1);
      slope = slope / wWeeks;
    }
    
    if(slope > 0 && curW) {
      var weeksLeft = (targetW - curW) / slope;
      if (weeksLeft > 0) {
        var today = new Date();
        var hitDate = new Date(today.getTime() + weeksLeft * 7 * 24 * 60 * 60 * 1000);
        goalText = 'Est. ' + weeksLeft.toFixed(1) + ' wks left (around ' + hitDate.toLocaleDateString([], {month:'short', day:'numeric'}) + ')';
      } else {
        goalText = 'Goal reached! 🎉';
      }
    } else {
      goalText = goalDirection()<0 ? 'Trend is not moving toward your loss goal' : 'Trend is not moving toward your gain goal';
    }
  } else if (curW) {
    goalText = 'Goal: ' + targetW + 'kg (need 2+ weeks of weight logs for estimate)';
  }

  var bannerHTML = '<div style="background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center">'
    +'<div><span class="eyebrow" style="margin:0">'+esc(goalLabel())+' goal</span><div style="font-weight:600;font-size:15px;color:var(--text)">🎯 ' + targetW + ' kg</div></div>'
    +'<div class="mono" style="font-size:12px;color:var(--amber-light);text-align:right">' + goalText + '</div>'
    +'</div>';

  document.getElementById('content').innerHTML =
    '<div class="topbar"><div><span class="eyebrow">day '+currentDayNum()+' of program</span><div class="title">Progress</div></div></div>'
    +bannerHTML
    +'<div class="stat-grid">'
      +'<div class="stat-card"><span class="eyebrow">current weight</span><div class="stat-val">'+(curW!=null?curW.toFixed(1)+'kg':'–')+'</div><div class="stat-sub">'+(delta!=null?(delta>=0?'+':'')+delta.toFixed(1)+' kg since day 1':'log weight to track')+'</div></div>'
      +'<div class="stat-card"><span class="eyebrow">'+goalRateLabel()+'</span><div class="stat-val '+(weeklyGainPct!=null?(inRange?'sage':'rust'):'')+'">'+( weeklyGainPct!=null?weeklyGainPct.toFixed(2)+'%':'–')+'</div><div class="stat-sub">goal-aware trend</div></div>'
      +'<div class="stat-card"><span class="eyebrow">current streak</span><div class="stat-val amber">'+streak+'</div><div class="stat-sub">days</div></div>'
      +'<div class="stat-card"><span class="eyebrow">avg kcal (7d)</span><div class="stat-val">'+avgKcal7+'</div><div class="stat-sub">target '+ct+'</div></div>'
    +'</div>'
    +(reg ? renderRegression(reg, weeklyWeights[0]) : '')
    +'<div class="section"><span class="eyebrow">weekly weight trend</span><div class="chart-wrap"><canvas id="weightChart"></canvas></div><div id="weightEmpty" class="chart-empty hidden"></div></div>'
    +'<div class="section"><span class="eyebrow">daily calories (last 14 days)</span><div class="chart-wrap"><canvas id="kcalChart"></canvas></div><div id="kcalEmpty" class="chart-empty hidden"></div></div>'
    +'<div class="section"><span class="eyebrow">protein trend (7-day rolling avg)</span><div class="chart-wrap"><canvas id="protChart"></canvas></div><div id="protEmpty" class="chart-empty hidden"></div></div>'
    +measHTML
    +photoHTML
    +notesHTML
    +'<div class="section ex-select-wrap"><span class="eyebrow">strength / e1RM</span><select id="exSelect" style="margin-top:8px">'+buildExOptions()+'</select><div class="chart-wrap" style="margin-top:10px"><canvas id="e1rmChart"></canvas></div><div class="e1rm-note">Estimated 1RM via Epley formula. Trend based on best set per session.</div></div>'
    +'<div class="section"><span class="eyebrow">adherence ledger</span><div class="ledger-grid" id="ledger"></div><div class="legend"><span><span class="dot" style="background:#486440"></span>on target</span><span><span class="dot" style="background:#6B2A1E"></span>aggressive</span><span><span class="dot" style="background:#2D2918"></span>under/none</span></div></div>'
    +'<div id="advisoryZone"></div>';

  buildProgressCharts(records, weeklyWeights);
  buildLedger(records);
  runDiscovery(records, weeklyWeights, ct, reg);

  var exSel = document.getElementById('exSelect');
  if(exSel) exSel.addEventListener('change', function(){ buildE1RMChart(exSel.value, records); });
  if(exSel && exSel.value) buildE1RMChart(exSel.value, records);

  var addMeasBtn = document.getElementById('addMeasBtn');
  if(addMeasBtn) addMeasBtn.addEventListener('click', openMeasSheet);

  var photoInput = document.getElementById('photoInput');
  var addPhotoBtn = document.getElementById('addPhotoBtn');
  if(addPhotoBtn && photoInput) {
    addPhotoBtn.addEventListener('click', function(){ photoInput.click(); });
    photoInput.addEventListener('change', function(){ handlePhotoUpload(photoInput.files[0]); });
  }
}

function renderRegression(reg, baseW) {
  var slopeKg = reg.slope;
  var ciKg = reg.ci;
  var inR = slopeKg >= GAIN_LOW && slopeKg <= GAIN_HIGH;
  var color = inR ? 'var(--sage-light)' : slopeKg < GAIN_LOW ? 'var(--amber-light)' : 'var(--rust-light)';
  return '<div class="regression-card">'
    +'<span class="eyebrow">trend estimate ('+reg.n+' weeks of data)</span>'
    +'<div class="regression-val" style="color:'+color+'">'+(slopeKg>=0?'+':'')+slopeKg.toFixed(3)+' kg/week</div>'
    +'<div class="regression-ci">95% CI: '+(slopeKg-ciKg).toFixed(3)+' to '+(slopeKg+ciKg).toFixed(3)+' kg/week</div>'
    +(inR ? '<div style="font-size:11px;color:var(--sage-light);margin-top:3px">'+ic('check','14')+' Within target band ('+GAIN_LOW+'–'+GAIN_HIGH+' kg/wk)</div>'
           : '<div style="font-size:11px;color:'+color+';margin-top:3px">'+(slopeKg<GAIN_LOW?'Below target — check calorie logging accuracy first':'Above target — consider trimming 150–200 kcal/day')+'</div>')
    +'</div>';
}

function buildExOptions() {
  var prog = getActiveProgram();
  var all = [];
  prog.forEach(function(s){ all = all.concat(s.exercises); });
  var seen = {}; var out = [];
  all.forEach(function(e){ if(!seen[e.id]){ seen[e.id]=true; out.push(e); } });
  return out.map(function(e){ return '<option value="'+e.id+'">'+e.name+'</option>'; }).join('');
}

function buildE1RMChart(exId, records) {
  if(typeof Chart === 'undefined') return;

  var points = [];
  records.forEach(function(r){
    var sets = (dayRecord(r.key).workout||{})[exId]||[];
    var best = 0;
    sets.forEach(function(s){ var e=calcE1RM(s.weight,s.reps); if(e>best) best=e; });
    if(best>0) points.push({key:r.key,e1rm:+best.toFixed(1)});
  });
  var ec = document.getElementById('e1rmChart');
  if(!ec) return;

  opts.scales.y.title = {display:true,text:'e1RM (kg)',color:'#6E6657',font:{size:9}};
  charts.e1rm = new Chart(ec, {type:'line',data:{
    labels:points.map(function(p){return p.key.slice(5);}),
    datasets:[{data:points.map(function(p){return p.e1rm;}),borderColor:'#A8C29C',backgroundColor:'rgba(168,194,156,0.06)',fill:true,tension:0.2,pointRadius:3,pointBackgroundColor:'#A8C29C',borderWidth:2}]

}

// ── Discovery layer ────────────────────────────────────────────────────────────
function getSessionTypeForDate(dateStr) {
  var tdays = profile ? (profile.trainingDays||[1,3,5]) : [1,3,5];
  var start = new Date(profile.startDate); start.setHours(0,0,0,0);
  var target = new Date(dateStr + 'T00:00:00');
  var count = 0;
  var d = new Date(start);
  while(d <= target) {
    if(tdays.includes(d.getDay())) count++;
    d.setDate(d.getDate()+1);
  }
  var prog = getActiveProgram();
  return prog[(count - 1 + prog.length) % prog.length] || prog[0];
}

function runDiscovery(records, weeklyWeights, ct, reg) {
  var zone = document.getElementById('advisoryZone'); if(!zone) return;
  var advisories = [];

  // 1. Stall check — audit before suggesting "eat more"
  if(records.length >= 14 && weeklyWeights.length >= 2) {
    var last7 = records.slice(-7), prev7 = records.slice(-14,-7);
    var avgK7 = last7.reduce(function(s,r){return s+r.kcal;},0)/7;
    var w1 = prev7.filter(function(r){return r.weight!=null;}), w2 = last7.filter(function(r){return r.weight!=null;});
    if(w1.length && w2.length && avgK7 >= ct*0.9) {
      var wA1 = w1.reduce(function(s,r){return s+r.weight;},0)/w1.length;
      var wA2 = w2.reduce(function(s,r){return s+r.weight;},0)/w2.length;
      if(Math.abs(wA2-wA1)/wA1 < 0.0015) { // < ~0.15% change
        if(!confirmLoggingAccurate) {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Weight stall detected</strong><br>Weight has stalled for 2 weeks. Before adding calories, verify logging accuracy: did you log all cooking oils, sauces, snacks, and weekend meals?<div class="advisory-actions"><button class="btn btn-sm" id="confirmLoggingBtn">Yes, logging is accurate</button><button class="btn btn-sm btn-ghost" id="dismissStallBtn">Dismiss</button></div></div></div>');
        } else {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Try +250 kcal</strong><br>You confirmed accurate logging and weight is flat. Consider adding 250 kcal/day (e.g. extra peanut butter or bananas in your shake) and re-evaluate in 2 weeks.</div></div>');
        }
      }
    }
  }

  // 2. Early adjustment for fast metabolism (10–14 days)
  if(records.length >= 10 && records.length <= 16 && weeklyWeights.length >= 2) {
    var eA = weeklyWeights[weeklyWeights.length-1], eB = weeklyWeights[0];
    if(eA - eB < 0.05) {
      advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Early adjustment window</strong><br>You\'re in the first 2 weeks and weight hasn\'t moved. Double-check you\'re hitting '+ct+' kcal daily. If logging is accurate, consider bumping to '+(ct+200)+' kcal.</div></div>');
    }
  }

  // 3. e1RM decline/stall check
  var prog = getActiveProgram();
  var allEx = [];
  prog.forEach(function(s){ allEx = allEx.concat(s.exercises); });
  var seen={}; var uniqueEx=[];
  allEx.forEach(function(e){if(!seen[e.id]){seen[e.id]=true;uniqueEx.push(e);}});
  
  uniqueEx.forEach(function(ex){
    var exSessions = [];
    records.forEach(function(r){
      var sets = (dayRecord(r.key).workout||{})[ex.id]||[];
      var best=0; sets.forEach(function(s){var e=calcE1RM(s.weight,s.reps);if(e>best)best=e;});
      if(best>0) exSessions.push(best);
    });
    
    // e1RM decline (2+ consecutive sessions decline -> Deload suggestion)
    if(exSessions.length >= 3) {
      var lA=exSessions[exSessions.length-1], lB=exSessions[exSessions.length-2], lC=exSessions[exSessions.length-3];
      if(lA < lB && lB < lC) {
        advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--rust-light)">'+ex.name+' — Performance Dip (Deload)</strong><br>e1RM has dropped 2 sessions in a row. Consider a deload week: cut working weight by 30% and sets in half to recover fatigue.</div></div>');
      } else {
        // e1RM stall (4+ flat sessions -> Volume suggestion)
        if(exSessions.length >= 4) {
          var last4 = exSessions.slice(-4);
          var allFlat = last4.every(function(v){return Math.abs(v-last4[0])/last4[0]<0.02;});
          if(allFlat) {
            advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('trend_up')+'</div><div><strong style="color:var(--sage-light)">'+ex.name+' plateau</strong><br>e1RM has stalled for 4 sessions. If your recovery is good, suggest adding 1 extra set/week to push overload.</div></div>');
          }
        }
      }
    }
  });

  // 4. Adherence pattern — skipped weekday
  if(records.length >= 21) {
    var dayCount=[0,0,0,0,0,0,0], dayMiss=[0,0,0,0,0,0,0];
    records.slice(-21).forEach(function(r){
      var d = new Date(r.key).getDay();
      dayCount[d]++;
      var dailyCt = getTargetsForDate(r.key).kcal;
      if(r.kcal < dailyCt*0.9) dayMiss[d]++;
    });
    var names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for(var di=0;di<7;di++){
      if(dayCount[di]>=3 && dayMiss[di]/dayCount[di]>0.6){
        advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Pattern: '+names[di]+' gaps</strong><br>You missed calorie targets on '+(dayMiss[di])+' of the last '+(dayCount[di])+' '+names[di]+'s. Consider prepping an extra banana/shake for that day.</div></div>');
      }
    }
  }

  // 5. Sleep & Readiness Correlation
  var correlationEx = uniqueEx[0]; // analyze the primary compound exercise
  if(records.length >= 14 && correlationEx) {
    var upSleep = [], downSleep = [];
    var upReady = [], downReady = [];
    var e1rms = [];
    var keyToE1RM = {};
    records.forEach(function(r){
      var sets = (dayRecord(r.key).workout||{})[correlationEx.id]||[];
      var best = 0; sets.forEach(function(s){var e=calcE1RM(s.weight,s.reps);if(e>best)best=e;});
      if(best > 0) {
        e1rms.push(best);
        keyToE1RM[r.key] = best;
      }
    });
    
    if(e1rms.length >= 5) {
      var avgE1rm = e1rms.reduce(function(a,b){return a+b;},0)/e1rms.length;
      records.forEach(function(r){
        var e = keyToE1RM[r.key];
        if(e) {
          var rec = dayRecord(r.key);
          var sleep = rec.sleep != null ? rec.sleep : 8;
          var readiness = rec.readiness != null ? rec.readiness : 3;
          if(e >= avgE1rm) {
            upSleep.push(sleep);
            upReady.push(readiness);
          } else {
            downSleep.push(sleep);
            downReady.push(readiness);
          }
        }
      });
      
      if(upSleep.length >= 2 && downSleep.length >= 2) {
        var avgUpSleep = upSleep.reduce(function(a,b){return a+b;},0)/upSleep.length;
        var avgDownSleep = downSleep.reduce(function(a,b){return a+b;},0)/downSleep.length;
        var avgUpReady = upReady.reduce(function(a,b){return a+b;},0)/upReady.length;
        var avgDownReady = downReady.reduce(function(a,b){return a+b;},0)/downReady.length;
        
        if(avgUpSleep - avgDownSleep > 0.6) {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--sage-light)">Sleep & Performance Correlation</strong><br>Your best '+correlationEx.name+' sets averaged '+(avgUpSleep).toFixed(1)+'h sleep, compared to only '+(avgDownSleep).toFixed(1)+'h on lower performance days. Prioritize sleep length!</div></div>');
        }
        if(avgUpReady - avgDownReady > 0.6) {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--sage-light)">Readiness Correlation</strong><br>Your performance drops correlate with low morning readiness (avg '+(avgDownReady).toFixed(1)+'/5 vs '+(avgUpReady).toFixed(1)+'/5 on peak days). Check recovery before training.</div></div>');
        }
      }
    }
  }

  // 6. Adherence / Session Skipping Auto-Regulation
  if(records.length >= 14 && profile.trainingDays) {
    var skippedCounts = {};
    var scheduledCounts = {};
    
    records.slice(-28).forEach(function(r){
      var d = new Date(r.key + 'T00:00:00');
      var isTrain = profile.trainingDays.includes(d.getDay());
      if(isTrain) {
        var sType = getSessionTypeForDate(r.key);
        if (sType) {
          scheduledCounts[sType.label] = (scheduledCounts[sType.label] || 0) + 1;
          var rec = dayRecord(r.key);
          var loggedSets = Object.keys(rec.workout || {});
          if(!rec.workoutDone && loggedSets.length === 0) {
            skippedCounts[sType.label] = (skippedCounts[sType.label] || 0) + 1;
          }
        }
      }
    });
    
    Object.keys(scheduledCounts).forEach(function(label){
      var sched = scheduledCounts[label];
      var skip = skippedCounts[label] || 0;
      if(sched >= 3 && (skip / sched) >= 0.5) {
        advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Auto-Regulation: '+label+' Skips</strong><br>You have skipped '+label+' in ' + Math.round((skip/sched)*100) + '% of scheduled days. Try running a shortened 20-minute version with only Squats/Bench/Rows instead of skipping entirely.</div></div>');
      }
    });
  }

  zone.innerHTML = advisories.join('');

  var cb = document.getElementById('confirmLoggingBtn');
  if(cb) cb.addEventListener('click', function(){ confirmLoggingAccurate=true; renderProgress(); });
  var db = document.getElementById('dismissStallBtn');
  if(db) db.addEventListener('click', function(){ document.getElementById('advisoryZone').innerHTML=''; });
}

function getTopRepRange(rangeStr) {
  var parts = String(rangeStr).split('–');
  if (parts.length === 2) return parseInt(parts[1], 10);
  var parts2 = String(rangeStr).split('-');
  if (parts2.length === 2) return parseInt(parts2[1], 10);
  return parseInt(rangeStr, 10) || 12;
}

function openWarmUpSheet(exName, exId) {
  var inputEl = document.querySelector('.set-weight[data-ex="' + exId + '"]');
  var workingWeight = parseFloat(inputEl ? inputEl.value : '') || 40;
  var w50 = (Math.round((workingWeight * 0.5) / 2.5) * 2.5).toFixed(1);
  var w70 = (Math.round((workingWeight * 0.7) / 2.5) * 2.5).toFixed(1);
  var w85 = (Math.round((workingWeight * 0.85) / 2.5) * 2.5).toFixed(1);
  
  var overlay = document.createElement('div'); overlay.className = 'overlay';

    +'<div class="sheet-handle"></div>'

    +'<p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">Ramp up to your working weight of <strong>' + workingWeight + ' kg</strong> (rounded to nearest 2.5kg):</p>'
    +'<div style="background:var(--surface-raised);padding:12px;border-radius:10px;font-family:\'Space Mono\',monospace;font-size:13px;line-height:1.8">'
      +'<div style="display:flex;justify-content:space-between"><span>Set 1 (50%):</span><strong>' + w50 + ' kg × 5 reps</strong></div>'
      +'<div style="display:flex;justify-content:space-between"><span>Set 2 (70%):</span><strong>' + w70 + ' kg × 3 reps</strong></div>'
      +'<div style="display:flex;justify-content:space-between"><span>Set 3 (85%):</span><strong>' + w85 + ' kg × 1 rep</strong></div>'
    +'</div>'
    +'<p style="font-size:11px;color:var(--text-muted);margin-top:10px">Rest 60-90s between warmups, then 2-3 mins before your first working set.</p>'
    +'<button class="btn btn-primary" style="width:100%;margin-top:16px" id="closeWarmBtn">Got it</button>'
    +'</div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#closeWarmBtn').addEventListener('click', function(){ overlay.remove(); });
}

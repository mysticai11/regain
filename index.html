function renderProgress() {
  var keys = allDayKeys();
  var records = keys.map(function(k){
    var r = dayRecord(k); var t = getDayTotals(k);
    return {key:k,weight:r.weight,readiness:r.readiness,kcal:t.kcal,protein:t.protein,carbs:t.carbs,fat:t.fat};
  });

  // Calculate weighted average targets for the past 7 days for the dashboard
  var last7 = records.slice(-7);
  var sumCt = 0, sumPt = 0;
  last7.forEach(function(r){
    var t = getTargetsForDate(r.key);
    sumCt += t.kcal; sumPt += t.protein;
  });
  var avgCt = last7.length ? Math.round(sumCt / last7.length) : CAL_TARGET_REST;
  var avgPt = last7.length ? Math.round(sumPt / last7.length) : PROT_TARGET_REST;
  var ct = avgCt; // for rendering
  var pt = avgPt; // for rendering

  // Weekly weight averages
  var weeklyWeights = [];
  for(var i=0;i<records.length;i+=7){
    var chunk=records.slice(i,i+7).filter(function(r){return r.weight!=null;});
    if(chunk.length) weeklyWeights.push(+(chunk.reduce(function(s,r){return s+r.weight;},0)/chunk.length).toFixed(2));
  }

  var withW = records.filter(function(r){return r.weight!=null;});
  var curW = withW.length?withW[withW.length-1].weight:null;
  var startW = parseFloat(ls('rg_profile',{}).startWeight||54);
  var delta = curW!=null ? curW-startW : null;

  // Regression on weekly weights
  var reg = weeklyWeights.length>=3 ? linReg(weeklyWeights) : null;
  var weeklyGainPct = reg ? reg.slope/weeklyWeights[0]*100 : null;
  var inRange = weeklyGainPct!=null && weeklyGainPct>=GAIN_LOW/startW*100*0.6 && weeklyGainPct<=GAIN_HIGH/startW*100*1.4;

  // Streak + avg kcal this week
  var streak = computeStreak();
  var last7 = records.slice(-7);
  var avgKcal7 = last7.length ? Math.round(last7.reduce(function(s,r){return s+r.kcal;},0)/last7.length) : 0;

  var measurements = profile.measurements || [];
  var photos = profile.photos || [];

  var measHTML = '<div class="section"><div class="section-head"><span class="eyebrow">body measurements (cm)</span><button class="btn-ghost" id="addMeasBtn">log new</button></div>';
  if(measurements.length) {
    measHTML += '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px">';
    measurements.slice(-5).forEach(function(m){
      measHTML += '<div style="background:var(--surface);padding:10px;border-radius:10px;min-width:120px;font-size:13px"><div class="eyebrow" style="margin-bottom:6px">'+new Date(m.date).toLocaleDateString([],{month:'short',day:'numeric'})+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span class="dim">Chest</span><span>'+(m.chest||'–')+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span class="dim">Arms</span><span>'+(m.arms||'–')+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px"><span class="dim">Waist</span><span>'+(m.waist||'–')+'</span></div>'
        +'<div style="display:flex;justify-content:space-between"><span class="dim">Thighs</span><span>'+(m.thighs||'–')+'</span></div></div>';
    });
    measHTML += '</div>';
  } else {
    measHTML += '<div class="chart-empty">Log measurements every 2 weeks</div>';
  }
  measHTML += '</div>';

  var photoHTML = '<div class="section"><div class="section-head"><span class="eyebrow">progress photos</span><button class="btn-ghost" id="addPhotoBtn">upload</button></div>';
  if(photos.length) {
    photoHTML += '<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:8px">';
    photos.slice(-5).forEach(function(p){
      photoHTML += '<div style="flex-shrink:0;width:100px"><img src="'+p.srcBase64+'" style="width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--border)"><div class="eyebrow" style="text-align:center;margin-top:4px">'+new Date(p.date).toLocaleDateString([],{month:'short',day:'numeric'})+'</div></div>';
    });
    photoHTML += '</div>';
  } else {
    photoHTML += '<div class="chart-empty">Take your first progress photo</div>';
  }
  photoHTML += '<input type="file" id="photoInput" accept="image/*" style="display:none"></div>';

  var notesHTML = '';
  var recentNotes = [];
  records.forEach(function(r){
    var dayRec = dayRecord(r.key);
    if(dayRec.note) {
      recentNotes.push({date: r.key, note: dayRec.note, weight: dayRec.weight});
    }
  });
  if (recentNotes.length > 0) {
    notesHTML += '<div class="section"><span class="eyebrow">daily notes log</span>'
      +'<div style="max-height:200px;overflow-y:auto;background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--border)">';
    recentNotes.reverse().slice(0, 10).forEach(function(n){
      notesHTML += '<div style="font-size:12px;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:6px">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:2px">'
          +'<span class="mono" style="color:var(--text-muted)">' + new Date(n.date + 'T00:00:00').toLocaleDateString([], {month:'short', day:'numeric'}) + '</span>'
          +(n.weight ? '<span class="mono" style="color:var(--sage-light)">' + n.weight + ' kg</span>' : '')
        +'</div>'
        +'<div style="color:var(--text-secondary);font-style:italic">"' + n.note + '"</div>'
        +'</div>';
    });
    notesHTML += '</div></div>';
  }

  var targetW = profile.targetWeight || 60.0;
  var goalText = 'Log weight regularly to estimate target date';
  if(weeklyWeights.length >= 2) {
    var slope = reg ? reg.slope : 0;
    if(slope === 0 && weeklyWeights.length >= 2) {
      slope = weeklyWeights[weeklyWeights.length-1] - weeklyWeights[0];
      var wWeeks = Math.max(1, weeklyWeights.length - 1);
      slope = slope / wWeeks;
    }
    
    if(slope > 0 && curW) {
      var weeksLeft = (targetW - curW) / slope;
      if (weeksLeft > 0) {
        var today = new Date();
        var hitDate = new Date(today.getTime() + weeksLeft * 7 * 24 * 60 * 60 * 1000);
        goalText = 'Est. ' + weeksLeft.toFixed(1) + ' wks left (around ' + hitDate.toLocaleDateString([], {month:'short', day:'numeric'}) + ')';
      } else {
        goalText = 'Goal reached! 🎉';
      }
    } else {
      goalText = goalDirection()<0 ? 'Trend is not moving toward your loss goal' : 'Trend is not moving toward your gain goal';
    }
  } else if (curW) {
    goalText = 'Goal: ' + targetW + 'kg (need 2+ weeks of weight logs for estimate)';
  }

  var bannerHTML = '<div style="background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center">'
    +'<div><span class="eyebrow" style="margin:0">'+esc(goalLabel())+' goal</span><div style="font-weight:600;font-size:15px;color:var(--text)">🎯 ' + targetW + ' kg</div></div>'
    +'<div class="mono" style="font-size:12px;color:var(--amber-light);text-align:right">' + goalText + '</div>'
    +'</div>';

  document.getElementById('content').innerHTML =
    '<div class="topbar"><div><span class="eyebrow">day '+currentDayNum()+' of program</span><div class="title">Progress</div></div></div>'
    +bannerHTML
    +'<div class="stat-grid">'
      +'<div class="stat-card"><span class="eyebrow">current weight</span><div class="stat-val">'+(curW!=null?curW.toFixed(1)+'kg':'–')+'</div><div class="stat-sub">'+(delta!=null?(delta>=0?'+':'')+delta.toFixed(1)+' kg since day 1':'log weight to track')+'</div></div>'
      +'<div class="stat-card"><span class="eyebrow">'+goalRateLabel()+'</span><div class="stat-val '+(weeklyGainPct!=null?(inRange?'sage':'rust'):'')+'">'+( weeklyGainPct!=null?weeklyGainPct.toFixed(2)+'%':'–')+'</div><div class="stat-sub">goal-aware trend</div></div>'
      +'<div class="stat-card"><span class="eyebrow">current streak</span><div class="stat-val amber">'+streak+'</div><div class="stat-sub">days</div></div>'
      +'<div class="stat-card"><span class="eyebrow">avg kcal (7d)</span><div class="stat-val">'+avgKcal7+'</div><div class="stat-sub">target '+ct+'</div></div>'
    +'</div>'
    +(reg ? renderRegression(reg, weeklyWeights[0]) : '')
    +'<div class="section"><span class="eyebrow">weekly weight trend</span><div class="chart-wrap"><canvas id="weightChart"></canvas></div><div id="weightEmpty" class="chart-empty hidden"></div></div>'
    +'<div class="section"><span class="eyebrow">daily calories (last 14 days)</span><div class="chart-wrap"><canvas id="kcalChart"></canvas></div><div id="kcalEmpty" class="chart-empty hidden"></div></div>'
    +'<div class="section"><span class="eyebrow">protein trend (7-day rolling avg)</span><div class="chart-wrap"><canvas id="protChart"></canvas></div><div id="protEmpty" class="chart-empty hidden"></div></div>'
    +measHTML
    +photoHTML
    +notesHTML
    +'<div class="section ex-select-wrap"><span class="eyebrow">strength / e1RM</span><select id="exSelect" style="margin-top:8px">'+buildExOptions()+'</select><div class="chart-wrap" style="margin-top:10px"><canvas id="e1rmChart"></canvas></div><div class="e1rm-note">Estimated 1RM via Epley formula. Trend based on best set per session.</div></div>'
    +'<div class="section"><span class="eyebrow">adherence ledger</span><div class="ledger-grid" id="ledger"></div><div class="legend"><span><span class="dot" style="background:#486440"></span>on target</span><span><span class="dot" style="background:#6B2A1E"></span>aggressive</span><span><span class="dot" style="background:#2D2918"></span>under/none</span></div></div>'
    +'<div id="advisoryZone"></div>';

  buildProgressCharts(records, weeklyWeights);
  buildLedger(records);
  runDiscovery(records, weeklyWeights, ct, reg);

  var exSel = document.getElementById('exSelect');
  if(exSel) exSel.addEventListener('change', function(){ buildE1RMChart(exSel.value, records); });
  if(exSel && exSel.value) buildE1RMChart(exSel.value, records);

  var addMeasBtn = document.getElementById('addMeasBtn');
  if(addMeasBtn) addMeasBtn.addEventListener('click', openMeasSheet);

  var photoInput = document.getElementById('photoInput');
  var addPhotoBtn = document.getElementById('addPhotoBtn');
  if(addPhotoBtn && photoInput) {
    addPhotoBtn.addEventListener('click', function(){ photoInput.click(); });
    photoInput.addEventListener('change', function(){ handlePhotoUpload(photoInput.files[0]); });
  }
}

function renderRegression(reg, baseW) {
  var slopeKg = reg.slope;
  var ciKg = reg.ci;
  var inR = slopeKg >= GAIN_LOW && slopeKg <= GAIN_HIGH;
  var color = inR ? 'var(--sage-light)' : slopeKg < GAIN_LOW ? 'var(--amber-light)' : 'var(--rust-light)';
  return '<div class="regression-card">'
    +'<span class="eyebrow">trend estimate ('+reg.n+' weeks of data)</span>'
    +'<div class="regression-val" style="color:'+color+'">'+(slopeKg>=0?'+':'')+slopeKg.toFixed(3)+' kg/week</div>'
    +'<div class="regression-ci">95% CI: '+(slopeKg-ciKg).toFixed(3)+' to '+(slopeKg+ciKg).toFixed(3)+' kg/week</div>'
    +(inR ? '<div style="font-size:11px;color:var(--sage-light);margin-top:3px">'+ic('check','14')+' Within target band ('+GAIN_LOW+'–'+GAIN_HIGH+' kg/wk)</div>'
           : '<div style="font-size:11px;color:'+color+';margin-top:3px">'+(slopeKg<GAIN_LOW?'Below target — check calorie logging accuracy first':'Above target — consider trimming 150–200 kcal/day')+'</div>')
    +'</div>';
}

function buildExOptions() {
  var prog = getActiveProgram();
  var all = [];
  prog.forEach(function(s){ all = all.concat(s.exercises); });
  var seen = {}; var out = [];
  all.forEach(function(e){ if(!seen[e.id]){ seen[e.id]=true; out.push(e); } });
  return out.map(function(e){ return '<option value="'+e.id+'">'+e.name+'</option>'; }).join('');
}

function chartDefaults() {
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{
      x:{ticks:{color:'#968E7E',font:{family:'Space Mono',size:9}},grid:{display:false}},
      y:{ticks:{color:'#968E7E',font:{family:'Space Mono',size:9}},grid:{color:'rgba(255,255,255,0.03)'}}
    }
  };
}
function destroyCharts() { Object.values(charts).forEach(function(c){if(c)c.destroy();}); charts={}; }

function buildProgressCharts(records, weeklyWeights) {
  if(typeof Chart === 'undefined') return;
  destroyCharts();

  // Weight chart
  var wc = document.getElementById('weightChart');
  if(wc) {
    if(weeklyWeights.length >= 2) {
      charts.weight = new Chart(wc, {type:'line',data:{
        labels:weeklyWeights.map(function(_,i){return 'Wk '+(i+1);}),
        datasets:[
          {data:weeklyWeights,borderColor:'#D98B3F',backgroundColor:'rgba(217,139,63,0.08)',fill:true,tension:0.3,pointBackgroundColor:'#D98B3F',pointRadius:4,borderWidth:2},
          {data:weeklyWeights.map(function(){return null;}), borderColor:'transparent', fill:false, pointRadius:0}, // spacer
        ]
      },options:chartDefaults()});
    } else {
      wc.style.display='none';
      document.getElementById('weightEmpty').textContent='Log weight for 2+ weeks to see trend';
      document.getElementById('weightEmpty').classList.remove('hidden');
    }
  }

  // Kcal chart (last 14 days)
  var kc = document.getElementById('kcalChart');
  if(kc) {
    if(records.length >= 2) {
      var last14 = records.slice(-14);
      charts.kcal = new Chart(kc, {type:'bar',data:{

  // Protein chart (7-day rolling avg)

function buildE1RMChart(exId, records) {
  if(typeof Chart === 'undefined') return;
  if(charts.e1rm) { charts.e1rm.destroy(); charts.e1rm=null; }
  var points = [];
  var ids = (typeof getEquivalentExerciseIds === 'function') ? getEquivalentExerciseIds(exId) : [exId];
  var exObj = getExerciseData(exId) || {};
  var isBW = isBodyweightExercise(exId, exObj.name);

  records.forEach(function(r){
    var dayWo = dayRecord(r.key).workout || {};
    var best = 0;
    ids.forEach(function(id){
      (dayWo[id] || []).forEach(function(s){
        if (!s) return;
        if (isBW) {
          var reps = Number(s.reps) || 0;
          if (reps > best) best = reps;
        } else {
          var e = calcE1RM(s.weight, s.reps);
          if (e > best) best = e;
        }
      });
    });
    if(best > 0) points.push({key:r.key, val: isBW ? best : +best.toFixed(1)});
  });
  var ec = document.getElementById('e1rmChart');
  if(!ec) return;
  if(points.length < 2) { ec.parentElement.innerHTML='<div class="chart-empty">Log your first set today 💪</div>'; return; }
  var opts = chartDefaults();
  opts.scales.y.title = {display:true, text: isBW ? 'Reps (BW)' : 'e1RM (kg)', color:'#6E6657', font:{size:9}};
  charts.e1rm = new Chart(ec, {type:'line',data:{
    labels:points.map(function(p){return p.key.slice(5);}),
    datasets:[{data:points.map(function(p){return p.val;}),borderColor:'#A8C29C',backgroundColor:'rgba(168,194,156,0.06)',fill:true,tension:0.2,pointRadius:3,pointBackgroundColor:'#A8C29C',borderWidth:2}]
  },options:opts});
}

// ── Discovery layer ────────────────────────────────────────────────────────────
function getSessionTypeForDate(dateStr) {
  var tdays = profile ? (profile.trainingDays||[1,2,3,5,6]) : [1,3,5];
  var start = new Date(profile.startDate); start.setHours(0,0,0,0);
  var target = new Date(dateStr + 'T00:00:00');
  var count = 0;
  var d = new Date(start);
  while(d <= target) {
    if(tdays.includes(d.getDay())) count++;
    d.setDate(d.getDate()+1);
  }
  var prog = getActiveProgram();
  return prog[(count - 1 + prog.length) % prog.length] || prog[0];
}

function runDiscovery(records, weeklyWeights, ct, reg) {
  var zone = document.getElementById('advisoryZone'); if(!zone) return;
  var advisories = [];

  // 1. Stall check — audit before suggesting "eat more"
  if(records.length >= 14 && weeklyWeights.length >= 2) {
    var last7 = records.slice(-7), prev7 = records.slice(-14,-7);
    var avgK7 = last7.reduce(function(s,r){return s+r.kcal;},0)/7;
    var w1 = prev7.filter(function(r){return r.weight!=null;}), w2 = last7.filter(function(r){return r.weight!=null;});
    if(w1.length && w2.length && avgK7 >= ct*0.9) {
      var wA1 = w1.reduce(function(s,r){return s+r.weight;},0)/w1.length;
      var wA2 = w2.reduce(function(s,r){return s+r.weight;},0)/w2.length;
      if(Math.abs(wA2-wA1)/wA1 < 0.0015) { // < ~0.15% change
        if(!confirmLoggingAccurate) {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Weight stall detected</strong><br>Weight has stalled for 2 weeks. Before adding calories, verify logging accuracy: did you log all cooking oils, sauces, snacks, and weekend meals?<div class="advisory-actions"><button class="btn btn-sm" id="confirmLoggingBtn">Yes, logging is accurate</button><button class="btn btn-sm btn-ghost" id="dismissStallBtn">Dismiss</button></div></div></div>');
        } else {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Try +250 kcal</strong><br>You confirmed accurate logging and weight is flat. Consider adding 250 kcal/day (e.g. extra peanut butter or bananas in your shake) and re-evaluate in 2 weeks.</div></div>');
        }
      }
    }
  }

  // 2. Early adjustment for fast metabolism (10–14 days)
  if(records.length >= 10 && records.length <= 16 && weeklyWeights.length >= 2) {
    var eA = weeklyWeights[weeklyWeights.length-1], eB = weeklyWeights[0];
    if(eA - eB < 0.05) {
      advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Early adjustment window</strong><br>You\'re in the first 2 weeks and weight hasn\'t moved. Double-check you\'re hitting '+ct+' kcal daily. If logging is accurate, consider bumping to '+(ct+200)+' kcal.</div></div>');
    }
  }

  // 3. e1RM decline/stall check
  var prog = getActiveProgram();
  var allEx = [];
  prog.forEach(function(s){ allEx = allEx.concat(s.exercises); });
  var seen={}; var uniqueEx=[];
  allEx.forEach(function(e){if(!seen[e.id]){seen[e.id]=true;uniqueEx.push(e);}});
  
  uniqueEx.forEach(function(ex){
    var exSessions = [];
    records.forEach(function(r){
      var sets = (dayRecord(r.key).workout||{})[ex.id]||[];
      var best=0; sets.forEach(function(s){var e=calcE1RM(s.weight,s.reps);if(e>best)best=e;});
      if(best>0) exSessions.push(best);
    });
    
    // e1RM decline (2+ consecutive sessions decline -> Deload suggestion)
    if(exSessions.length >= 3) {
      var lA=exSessions[exSessions.length-1], lB=exSessions[exSessions.length-2], lC=exSessions[exSessions.length-3];
      if(lA < lB && lB < lC) {
        advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--rust-light)">'+ex.name+' — Performance Dip (Deload)</strong><br>e1RM has dropped 2 sessions in a row. Consider a deload week: cut working weight by 30% and sets in half to recover fatigue.</div></div>');
      } else {
        // e1RM stall (4+ flat sessions -> Volume suggestion)
        if(exSessions.length >= 4) {
          var last4 = exSessions.slice(-4);
          var allFlat = last4.every(function(v){return Math.abs(v-last4[0])/last4[0]<0.02;});
          if(allFlat) {
            advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('trend_up')+'</div><div><strong style="color:var(--sage-light)">'+ex.name+' plateau</strong><br>e1RM has stalled for 4 sessions. If your recovery is good, suggest adding 1 extra set/week to push overload.</div></div>');
          }
        }
      }
    }
  });

  // 4. Adherence pattern — skipped weekday
  if(records.length >= 21) {
    var dayCount=[0,0,0,0,0,0,0], dayMiss=[0,0,0,0,0,0,0];
    records.slice(-21).forEach(function(r){
      var d = new Date(r.key).getDay();
      dayCount[d]++;
      var dailyCt = getTargetsForDate(r.key).kcal;
      if(r.kcal < dailyCt*0.9) dayMiss[d]++;
    });
    var names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for(var di=0;di<7;di++){
      if(dayCount[di]>=3 && dayMiss[di]/dayCount[di]>0.6){
        advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Pattern: '+names[di]+' gaps</strong><br>You missed calorie targets on '+(dayMiss[di])+' of the last '+(dayCount[di])+' '+names[di]+'s. Consider prepping an extra banana/shake for that day.</div></div>');
      }
    }
  }

  // 5. Sleep & Readiness Correlation
  var correlationEx = uniqueEx[0]; // analyze the primary compound exercise
  if(records.length >= 14 && correlationEx) {
    var upSleep = [], downSleep = [];
    var upReady = [], downReady = [];
    var e1rms = [];
    var keyToE1RM = {};
    records.forEach(function(r){
      var sets = (dayRecord(r.key).workout||{})[correlationEx.id]||[];
      var best = 0; sets.forEach(function(s){var e=calcE1RM(s.weight,s.reps);if(e>best)best=e;});
      if(best > 0) {
        e1rms.push(best);
        keyToE1RM[r.key] = best;
      }
    });
    
    if(e1rms.length >= 5) {
      var avgE1rm = e1rms.reduce(function(a,b){return a+b;},0)/e1rms.length;
      records.forEach(function(r){
        var e = keyToE1RM[r.key];
        if(e) {
          var rec = dayRecord(r.key);
          var sleep = rec.sleep != null ? rec.sleep : 8;
          var readiness = rec.readiness != null ? rec.readiness : 3;
          if(e >= avgE1rm) {
            upSleep.push(sleep);
            upReady.push(readiness);
          } else {
            downSleep.push(sleep);
            downReady.push(readiness);
          }
        }
      });
      
      if(upSleep.length >= 2 && downSleep.length >= 2) {
        var avgUpSleep = upSleep.reduce(function(a,b){return a+b;},0)/upSleep.length;
        var avgDownSleep = downSleep.reduce(function(a,b){return a+b;},0)/downSleep.length;
        var avgUpReady = upReady.reduce(function(a,b){return a+b;},0)/upReady.length;
        var avgDownReady = downReady.reduce(function(a,b){return a+b;},0)/downReady.length;
        
        if(avgUpSleep - avgDownSleep > 0.6) {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--sage-light)">Sleep & Performance Correlation</strong><br>Your best '+correlationEx.name+' sets averaged '+(avgUpSleep).toFixed(1)+'h sleep, compared to only '+(avgDownSleep).toFixed(1)+'h on lower performance days. Prioritize sleep length!</div></div>');
        }
        if(avgUpReady - avgDownReady > 0.6) {
          advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--sage-light)">Readiness Correlation</strong><br>Your performance drops correlate with low morning readiness (avg '+(avgDownReady).toFixed(1)+'/5 vs '+(avgUpReady).toFixed(1)+'/5 on peak days). Check recovery before training.</div></div>');
        }
      }
    }
  }

  // 6. Adherence / Session Skipping Auto-Regulation
  if(records.length >= 14 && profile.trainingDays) {
    var skippedCounts = {};
    var scheduledCounts = {};
    
    records.slice(-28).forEach(function(r){
      var d = new Date(r.key + 'T00:00:00');
      var isTrain = profile.trainingDays.includes(d.getDay());
      if(isTrain) {
        var sType = getSessionTypeForDate(r.key);
        if (sType) {
          scheduledCounts[sType.label] = (scheduledCounts[sType.label] || 0) + 1;
          var rec = dayRecord(r.key);
          var loggedSets = Object.keys(rec.workout || {});
          if(!rec.workoutDone && loggedSets.length === 0) {
            skippedCounts[sType.label] = (skippedCounts[sType.label] || 0) + 1;
          }
        }
      }
    });
    
    Object.keys(scheduledCounts).forEach(function(label){
      var sched = scheduledCounts[label];
      var skip = skippedCounts[label] || 0;
      if(sched >= 3 && (skip / sched) >= 0.5) {
        advisories.push('<div class="advisory"><div class="advisory-icon">'+ic('info')+'</div><div><strong style="color:var(--amber)">Auto-Regulation: '+label+' Skips</strong><br>You have skipped '+label+' in ' + Math.round((skip/sched)*100) + '% of scheduled days. Try running a shortened 20-minute version with only Squats/Bench/Rows instead of skipping entirely.</div></div>');
      }
    });
  }

  zone.innerHTML = advisories.join('');

  var cb = document.getElementById('confirmLoggingBtn');
  if(cb) cb.addEventListener('click', function(){ confirmLoggingAccurate=true; renderProgress(); });
  var db = document.getElementById('dismissStallBtn');
  if(db) db.addEventListener('click', function(){ document.getElementById('advisoryZone').innerHTML=''; });
}

function getTopRepRange(rangeStr) {
  var parts = String(rangeStr).split('–');
  if (parts.length === 2) return parseInt(parts[1], 10);
  var parts2 = String(rangeStr).split('-');
  if (parts2.length === 2) return parseInt(parts2[1], 10);
  return parseInt(rangeStr, 10) || 12;
}

function getBottomRepRange(rangeStr) {
  var match=String(rangeStr).match(/\d+/);
  return match ? parseInt(match[0],10) : 1;
}

function progressionGuide(lastSets, repRange) {
  if(!lastSets.length) return 'Start with a comfortable load in the '+repRange+' rep range.';
  var low=getBottomRepRange(repRange), high=getTopRepRange(repRange);
  var allTop=lastSets.every(function(set){return Number(set.reps)>=high;});
  var guide=lastSets.map(function(set){
    var weight=Number(set.weight), reps=Number(set.reps);
    if(allTop) {
      var next=Math.max(weight+2.5,Math.round((weight*1.025)*4)/4);
      return weight+' kg × '+reps+' → try '+next+' kg × '+low+'–'+high;
    }
    return weight+' kg × '+reps+' → aim '+weight+' kg × '+Math.min(high,reps+1)+'–'+high;
  });
  return (allTop?'Beat last week by adding a little load: ':'Beat last week by adding a rep: ')+guide.join(' · ');
}


// ─── Barbell Plate Breakdown Calculator ───
function getPlateBreakdown(targetWeightKg, barWeightKg) {
  barWeightKg = barWeightKg || 20;
  if (!targetWeightKg || targetWeightKg <= barWeightKg) {
    return { perSide: [], barWeight: barWeightKg, totalWeight: targetWeightKg, sideWeight: 0 };
  }
  var sideWeight = (targetWeightKg - barWeightKg) / 2;
  var availablePlates = [25, 20, 15, 10, 5, 2.5, 1.25];
  var sidePlates = [];
  var rem = sideWeight;
  availablePlates.forEach(function(plate) {
    while (rem >= plate - 0.01) {
      sidePlates.push(plate);
      rem = +(rem - plate).toFixed(2);
    }
  });
  return {
    perSide: sidePlates,
    barWeight: barWeightKg,
    sideWeight: +sideWeight.toFixed(2),
    totalWeight: targetWeightKg,
    remainder: rem
  };
}

function openPlateCalculator(weight) {
  var target = parseFloat(weight) || 60;
  var breakdown = getPlateBreakdown(target, 20);
  var overlay = document.createElement('div');
  overlay.className = 'overlay';

  function renderPlateUI() {
    breakdown = getPlateBreakdown(target, 20);
    var platesHTML = breakdown.perSide.length ? breakdown.perSide.map(function(p) {
      var colorClass = p >= 20 ? '#3b82f6' : p >= 15 ? '#eab308' : p >= 10 ? '#22c55e' : p >= 5 ? '#f97316' : '#94a3b8';
      return '<div style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:' + colorClass + ';color:#000;font-weight:700;font-size:11px;border-radius:4px;padding:8px 6px;min-width:32px;box-shadow:0 2px 5px rgba(0,0,0,0.4)">'
        + p + '<span style="font-size:8px">kg</span></div>';
    }).join('') : '<div style="color:var(--text-muted);font-size:12px">No plates needed (empty bar).</div>';

    overlay.innerHTML = '<div class="sheet">'
      + '<div class="sheet-handle"></div>'
      + '<div class="sheet-title">⚖️ Barbell Plate Calculator</div>'
      + '<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Standard 20 kg Olympic Barbell breakdown per side.</div>'
      + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'
        + '<label style="font-size:13px;font-weight:600">Total Weight:</label>'
        + '<input type="number" step="0.5" id="plateTargetInput" value="' + target + '" style="width:90px;font-size:16px;font-weight:700;padding:6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)">'
        + '<span style="font-size:13px;font-weight:600">kg</span>'
      + '</div>'
      + '<div style="background:rgba(15,23,42,.6);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px">'
        + '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Plates on EACH SIDE (' + breakdown.sideWeight + ' kg):</div>'

        + '<div style="font-size:11px;color:var(--text-muted);margin-top:10px">Bar: 20 kg + (' + breakdown.sideWeight + ' kg × 2 sides) = ' + target + ' kg</div>'
      + '</div>'
      + '<button class="btn btn-primary" id="closePlateCalcBtn" style="width:100%">Got It</button>'
      + '</div>';

    overlay.querySelector('#closePlateCalcBtn').onclick = function() { overlay.remove(); };
    var input = overlay.querySelector('#plateTargetInput');
    input.oninput = function() {
      var val = parseFloat(input.value);
      if (val && val >= 20) {
        target = val;
        renderPlateUI();
        var refreshedInput = overlay.querySelector('#plateTargetInput');
        refreshedInput.focus();
        refreshedInput.setSelectionRange(refreshedInput.value.length, refreshedInput.value.length);
      }
    };
  }

  document.body.appendChild(overlay);
  renderPlateUI();
}

function isBodyweightExercise(id, name) {
  var ex = (typeof getExerciseData === 'function' ? getExerciseData(id) : null) || {};
  if (ex.bodyweight === true || ex.isBW === true || ex.type === 'bodyweight') return true;
  var n = ((name || ex.name || id) + '').toLowerCase();
  if (id === 'pull_ups' || id === 'chin_ups' || id === 'pullup' || id === 'chinup' || id === 'dips') return true;
  if (/pull[\s-]?ups?/i.test(n) || /chin[\s-]?ups?/i.test(n) || /\bdips?\b/i.test(n) || /push[\s-]?ups?/i.test(n) || /bodyweight/i.test(n)) {
    if (!/assisted/i.test(n) && !/pulldown/i.test(n) && !/machine/i.test(n) && !/cable/i.test(n)) {
      return true;
    }
  }
  return false;
}

function getExercisePR(exId) {
  var ids = (typeof getEquivalentExerciseIds === 'function') ? getEquivalentExerciseIds(exId) : [exId];
  var prVal = null;
  var isBW = isBodyweightExercise(exId);
  allDayKeys().forEach(function(key){
    var r = dayRecord(key);
    var wo = r.workout || {};
    ids.forEach(function(id){
      var sets = wo[id] || [];
      sets.forEach(function(s){
        if (s && s.reps != null && s.reps !== '') {
          var w = Number(s.weight) || 0;
          var reps = Number(s.reps) || 0;
          if (reps > 0) {
            if (!prVal) {
              prVal = { weight: w, reps: reps };
            } else if (isBW && (!w || w === 0) && (!prVal.weight || prVal.weight === 0)) {
              if (reps > prVal.reps) prVal = { weight: 0, reps: reps };
            } else if (w > prVal.weight || (w === prVal.weight && reps > prVal.reps)) {
              prVal = { weight: w, reps: reps };
            }
          }
        }
      });
    });
  });
  return prVal;
}

function getLastSessionWeightReps(exId, rec) {
  var todaySets = (rec.workout || {})[exId] || [];
  if (todaySets.length > 0) {
    var lastSet = todaySets[todaySets.length - 1];
    return { weight: lastSet.weight, reps: lastSet.reps };
  }

  var keys = allDayKeys().reverse();
  var todayK = todayKey();
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === todayK) continue;
    var r = dayRecord(keys[i]);
    var prevSets = (r.workout || {})[exId] || [];
    if (prevSets.length > 0) {
      return { weight: prevSets[0].weight, reps: prevSets[0].reps };
    }
  }
  return null;
}


function getEquivalentExerciseIds(exId) {
  var ids = [exId];
  // Strip _b, _a, _1, _2, _machine suffixes
  var baseId = exId.replace(/_[ab\d]+$/i, '');
  if (baseId !== exId && !ids.includes(baseId)) ids.push(baseId);
  if (!ids.includes(baseId + '_b')) ids.push(baseId + '_b');
  if (!ids.includes(baseId + '_a')) ids.push(baseId + '_a');
  if (!ids.includes(baseId + '_machine')) ids.push(baseId + '_machine');

  // Explicit pairs from the 5-day and 6-day split
  var pairs = {
    'machine_row_b': 'machine_row',
    'machine_row': 'machine_row_b',
    'lat_pulldown_b': 'lat_pulldown',
    'lat_pulldown': 'lat_pulldown_b',
    'pec_deck_b': 'pec_deck',
    'pec_deck': 'pec_deck_b',
    'hamstring_curl_b': 'hamstring_curl',
    'hamstring_curl': 'hamstring_curl_b',
    'leg_extension_b': 'leg_extension',
    'leg_extension': 'leg_extension_b',
    'shoulder_press_b': 'shoulder_press_machine',
    'shoulder_press_machine': 'shoulder_press_b',
    'lateral_raise_b': 'lateral_raise_machine',
    'lateral_raise_machine': 'lateral_raise_b',
    'pull_ups': 'chin_ups',
    'chin_ups': 'pull_ups'
  };
  if (pairs[exId] && !ids.includes(pairs[exId])) {
    ids.push(pairs[exId]);
  }

  // Also match by exercise name
  var currentName = ((getExerciseData(exId) || {}).name || '').toLowerCase().trim();
  if (currentName) {
    var lib = typeof EXERCISE_LIBRARY !== 'undefined' ? EXERCISE_LIBRARY : {};
    var allEx = Object.keys(lib);
    allEx.forEach(function(k) {
      var item = lib[k];
      if (item && item.name && item.name.toLowerCase().trim() === currentName) {
        if (!ids.includes(k)) ids.push(k);
      }
    });
  }
  return ids;
}

function getScienceBasedWorkingWeight(exId, exName, exConfig) {
  var id = (exId || '').toLowerCase();
  var name = (exName || '').toLowerCase();
  var isBW = isBodyweightExercise(exId, exName);
  if (isBW) return null;

  var userWeight = (profile && profile.weight) || 75;
  var keys = allDayKeys().reverse();

  function findLoggedWeight(matchIds) {
    for (var i = 0; i < keys.length; i++) {
      var r = dayRecord(keys[i]);
      if (!r || !r.workout) continue;
      for (var j = 0; j < matchIds.length; j++) {
        var sets = (r.workout[matchIds[j]] || []).filter(function(s){ return s && Number(s.weight) > 0; });
        if (sets.length > 0) {
          var maxW = Math.max.apply(null, sets.map(function(s){ return Number(s.weight); }));
          return { weight: maxW, id: matchIds[j] };
        }
      }
    }
    return null;
  }

  var inc = (exConfig && exConfig.weightIncrement) || 2.5;
  function roundToInc(w) {
    return Math.max(inc, +(Math.round(w / inc) * inc).toFixed(1));
  }

  // 1. CHEST & PRESSING CORRELATIONS
  if (/bench|chest_press|incline/i.test(id) || /bench|chest press|incline/i.test(name)) {
    var foundBench = findLoggedWeight(['bench', 'incline_bench', 'chest_press_machine', 'incline_db_press']);
    if (foundBench) {
      var baseWeight = foundBench.weight;
      var isDb = /db|dumbbell/i.test(id) || /db|dumbbell/i.test(name);
      var factor = 1.0;
      if (/incline_db/i.test(id) || /incline dumbbell/i.test(name)) factor = 0.38;
      else if (/incline/i.test(id) || /incline/i.test(name)) factor = 0.82;
      else if (/close_grip/i.test(id) || /close-grip/i.test(name)) factor = 0.88;
      else if (/chest_press/i.test(id) || /machine/i.test(name)) factor = 0.95;
      else if (isDb) factor = 0.40;

      if (/db|dumbbell/i.test(foundBench.id)) baseWeight = (baseWeight * 2) / 0.8;

      var recW = roundToInc(baseWeight * factor);
      return { weight: recW, source: 'correlated_lift', refLiftName: (getExerciseData(foundBench.id)||{}).name || 'Bench Press', refWeight: foundBench.weight, userWeight: userWeight };
    }
    var isDumbbell = /db|dumbbell/i.test(id) || /db|dumbbell/i.test(name);
    var defW = isDumbbell ? roundToInc(userWeight * 0.20) : roundToInc(userWeight * 0.60);
    return { weight: defW, source: 'bodyweight_ratio', userWeight: userWeight };
  }

  // 2. BACK & PULLING CORRELATIONS
  if (/row|lat_pull|pulldown/i.test(id) || /row|pulldown|pull-down/i.test(name)) {
    var foundPull = findLoggedWeight(['lat_pulldown', 'lat_pulldown_b', 'machine_row', 'machine_row_b', 'barbell_row']);
    if (foundPull) {
      var baseW = foundPull.weight;
      var f = 1.0;
      if (/single_arm/i.test(id)) f = 0.45;
      else if (/machine_row/i.test(id) && /lat_pulldown/i.test(foundPull.id)) f = 0.95;
      else if (/lat_pulldown/i.test(id) && /machine_row/i.test(foundPull.id)) f = 1.05;
      var rW = roundToInc(baseW * f);
      return { weight: rW, source: 'correlated_lift', refLiftName: (getExerciseData(foundPull.id)||{}).name || 'Pulling Lift', refWeight: foundPull.weight, userWeight: userWeight };
    }
    var defPull = roundToInc(userWeight * 0.55);
    return { weight: defPull, source: 'bodyweight_ratio', userWeight: userWeight };
  }

  // 3. LEGS CORRELATIONS
  if (/leg_press|romanian|rdl|leg_ext|hamstring|squat/i.test(id) || /leg press|deadlift|rdl|extension|curl/i.test(name)) {
    var foundLeg = findLoggedWeight(['leg_press', 'romanian_deadlift', 'rdl', 'leg_extension', 'hamstring_curl']);
    if (foundLeg) {
      var baseL = foundLeg.weight;
      var factorL = 1.0;
      if (/leg_press/i.test(id) && !/leg_press/i.test(foundLeg.id)) factorL = 2.0;
      else if ((/leg_ext|extension/i.test(id)) && /leg_press/i.test(foundLeg.id)) factorL = 0.32;
      else if ((/hamstring|curl/i.test(id)) && /leg_press/i.test(foundLeg.id)) factorL = 0.28;
      else if (/romanian|rdl/i.test(id) && /leg_press/i.test(foundLeg.id)) factorL = 0.55;
      var recL = roundToInc(baseL * factorL);
      return { weight: recL, source: 'correlated_lift', refLiftName: (getExerciseData(foundLeg.id)||{}).name || 'Leg Lift', refWeight: foundLeg.weight, userWeight: userWeight };
    }
    var defLeg = /leg_press/i.test(id) ? roundToInc(userWeight * 1.3) : roundToInc(userWeight * 0.45);
    return { weight: defLeg, source: 'bodyweight_ratio', userWeight: userWeight };
  }

  // 4. SHOULDERS
  if (/shoulder|overhead|lateral/i.test(id) || /shoulder|overhead|lateral/i.test(name)) {
    if (/lateral/i.test(id) || /lateral/i.test(name)) {
      return { weight: roundToInc(Math.max(5, userWeight * 0.09)), source: 'bodyweight_ratio', userWeight: userWeight };
    }
    return { weight: roundToInc(userWeight * 0.40), source: 'bodyweight_ratio', userWeight: userWeight };
  }

  // 5. ARMS (BICEPS / TRICEPS)
  if (/curl|tricep|bicep/i.test(id) || /curl|tricep|bicep/i.test(name)) {
    return { weight: roundToInc(userWeight * 0.25), source: 'bodyweight_ratio', userWeight: userWeight };
  }

  return { weight: roundToInc(userWeight * 0.40), source: 'bodyweight_ratio', userWeight: userWeight };
}

function getLastSessionSets(exId, rec) {
  var equivalentIds = (typeof getEquivalentExerciseIds === 'function') ? getEquivalentExerciseIds(exId) : [exId];
  var keys = allDayKeys().reverse();
  var todayK = todayKey();

  // 1. Check if logged earlier today under an equivalent exercise ID
  if (rec && rec.workout) {
    for (var e = 0; e < equivalentIds.length; e++) {
      var eqId = equivalentIds[e];
      if (eqId !== exId && rec.workout[eqId] && rec.workout[eqId].length > 0) {
        var validEq = rec.workout[eqId].filter(function(s){ return s && (Number(s.reps) > 0 || Number(s.weight) > 0); });
        if (validEq.length > 0) return rec.workout[eqId];
      }
    }
  }

  // 2. Search previous days in history
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var r = (k === todayK && rec) ? rec : dayRecord(k);
    if (!r || !r.workout) continue;

    // Check direct ID first
    if (k !== todayK && r.workout[exId] && r.workout[exId].length > 0) {
      var directValid = r.workout[exId].filter(function(s){ return s && (Number(s.reps) > 0 || Number(s.weight) > 0); });
      if (directValid.length > 0) return r.workout[exId];
    }

    // Check equivalent IDs (e.g. machine_row on Day 1 for machine_row_b on Day 5)
    for (var j = 0; j < equivalentIds.length; j++) {
      var id = equivalentIds[j];
      if (r.workout[id] && r.workout[id].length > 0) {
        if (k !== todayK || id !== exId) {
          var eqValid = r.workout[id].filter(function(s){ return s && (Number(s.reps) > 0 || Number(s.weight) > 0); });
          if (eqValid.length > 0) return r.workout[id];
        }
      }
    }
  }
  return [];
}


function getPreviousSessionFull(exId) {
  var equivalentIds = (typeof getEquivalentExerciseIds === 'function') ? getEquivalentExerciseIds(exId) : [exId];
  var keys = allDayKeys().reverse();
  var todayK = todayKey();
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === todayK) continue;
    var r = dayRecord(keys[i]);
    if (!r || !r.workout) continue;
    for (var j = 0; j < equivalentIds.length; j++) {
      var id = equivalentIds[j];
      var prevSets = r.workout[id] || [];
      var valid = prevSets.filter(function(s){ return s && (Number(s.reps) > 0 || Number(s.weight) > 0); });
      if (valid.length > 0) {
        var d = new Date(keys[i] + 'T00:00:00');
        var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var formatted = dayNames[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
        return { sets: prevSets, dayKey: keys[i], dateFormatted: formatted };
      }
    }
  }
  return null;
}

function getHistorySessionsFull(exId, limit) {
  var equivalentIds = (typeof getEquivalentExerciseIds === 'function') ? getEquivalentExerciseIds(exId) : [exId];
  var keys = allDayKeys().reverse();
  var todayK = todayKey();
  var found = [];
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] === todayK) continue;
    var r = dayRecord(keys[i]);
    if (!r || !r.workout) continue;
    for (var j = 0; j < equivalentIds.length; j++) {
      var id = equivalentIds[j];
      var prevSets = r.workout[id] || [];
      var valid = prevSets.filter(function(s){ return s && (Number(s.reps) > 0 || Number(s.weight) > 0); });
      if (valid.length > 0) {
        var d = new Date(keys[i] + 'T00:00:00');
        var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        var formatted = dayNames[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
        found.push({ sets: prevSets, dayKey: keys[i], dateFormatted: formatted });
        break;
      }
    }
    if (found.length >= (limit || 3)) break;
  }
  return found;
}

function compareExerciseSessions(previousSession, currentSets, plannedCount) {
  var prevSets = (previousSession && previousSession.sets)
    ? previousSession.sets.filter(function(s){ return s && !s.isWarmup && (Number(s.reps) > 0 || Number(s.weight) > 0); })
    : [];
  var currValid = (currentSets || []).map(function(s, idx){
    if (!s || s.isWarmup || (!Number(s.reps) && !Number(s.weight))) return null;
    return {
      index: idx,
      weight: Number(s.weight) || 0,
      reps: Number(s.reps) || 0,
      rir: (s.rir !== '' && s.rir != null) ? Number(s.rir) : null,
      isWarmup: !!s.isWarmup
    };
  });

  if (!previousSession || !prevSets.length) {
    var totalBaselineRows = Math.max(plannedCount || 2, currValid.length);
    var baselineRows = [];
    for (var bi = 0; bi < totalBaselineRows; bi++) {
      var bc = currValid[bi] || null;
      var bcValid = bc && (Number(bc.weight) > 0 || Number(bc.reps) > 0);
      var bct = bcValid ? (bc.weight + ' kg × ' + bc.reps + (bc.rir === 0 ? ' (F)' : (bc.rir != null ? ' (' + bc.rir + ' RIR)' : ''))) : '<span class="curr-pending">pending…</span>';
      baselineRows.push({
        setNum: bi + 1,
        prevText: '—',
        currText: bct,
        changeText: '—',
        changeClass: 'change-neutral',
        isCompleted: !!(bc && Number(bc.weight) > 0 && Number(bc.reps) > 0)
      });
    }
    return {
      hasPrevious: false,
      dateLabel: null,
      status: 'baseline',
      statusLabel: 'Baseline Session',
      statusClass: 'badge-baseline',
      rows: baselineRows,
      summaryText: 'First recorded session for this exercise. Future workouts will compare against today\'s numbers.'
    };
  }

  var totalRows = Math.max(plannedCount || 2, prevSets.length, currValid.length);
  var rows = [];
  var improvedCount = 0;
  var declinedCount = 0;
  var maintainedCount = 0;
  var completedComparisons = 0;

  for (var i = 0; i < totalRows; i++) {
    var p = prevSets[i] || null;
    var c = currValid[i] || null;

    var prevText = p ? (p.weight + ' kg × ' + p.reps + (p.rir === 0 ? ' (F)' : (p.rir != null ? ' (' + p.rir + ' RIR)' : ''))) : '—';
    var currText = c ? (c.weight + ' kg × ' + c.reps + (c.rir === 0 ? ' (F)' : (c.rir != null ? ' (' + c.rir + ' RIR)' : ''))) : '<span class="curr-pending">pending…</span>';
    var changeText = '—';
    var changeClass = 'change-neutral';

    if (p && c) {
      completedComparisons++;
      var loadDiff = +(c.weight - p.weight).toFixed(2);
      var repDiff = c.reps - p.reps;
      var rirDiff = (c.rir != null && p.rir != null) ? (c.rir - p.rir) : null;

      var parts = [];
      if (loadDiff !== 0) parts.push((loadDiff > 0 ? '+' : '') + loadDiff + ' kg');
      if (repDiff !== 0) parts.push((repDiff > 0 ? '+' : '') + repDiff + ' rep' + (Math.abs(repDiff) === 1 ? '' : 's'));

      if (parts.length > 0) {
        changeText = parts.join(', ');
        if (rirDiff != null && rirDiff !== 0 && loadDiff === 0) {
          changeText += ' (' + (rirDiff > 0 ? '+' : '') + rirDiff + ' RIR)';
        }
      } else {
        if (rirDiff != null && rirDiff !== 0) {
          changeText = 'Same (' + (rirDiff > 0 ? '+' : '') + rirDiff + ' RIR)';
        } else {
          changeText = 'No change';
        }
      }

      var isSetImproved = (loadDiff > 0 && repDiff >= 0) || (loadDiff >= 0 && repDiff > 0) || (loadDiff === 0 && repDiff === 0 && rirDiff != null && rirDiff > 0);
      var isSetDeclined = (loadDiff < 0 && repDiff <= 0) || (loadDiff <= 0 && repDiff < 0) || (loadDiff === 0 && repDiff === 0 && rirDiff != null && rirDiff < 0 && c.rir === 0);

      if (isSetImproved) {
        improvedCount++;
        changeClass = 'change-positive';
      } else if (isSetDeclined) {
        declinedCount++;
        changeClass = 'change-negative';
      } else {
        maintainedCount++;
        changeClass = 'change-neutral';
      }
    } else if (c && !p) {
      changeText = '+1 extra set';
      changeClass = 'change-positive';
      improvedCount++;
      completedComparisons++;
    }

    rows.push({
      setNum: i + 1,
      prevText: prevText,
      currText: currText,
      changeText: changeText,
      changeClass: changeClass,
      isCompleted: !!c
    });
  }

  var status = 'neutral';
  var statusLabel = 'In Progress';
  var statusClass = 'badge-maintained';

  if (completedComparisons === 0) {
    status = 'pending';
    statusLabel = 'Awaiting sets';
    statusClass = 'badge-maintained';
  } else if (improvedCount > 0 && declinedCount === 0) {
    status = 'improved';
    statusLabel = '↑ Improved' + (completedComparisons < prevSets.length ? ' (' + completedComparisons + '/' + prevSets.length + ')' : '');
    statusClass = 'badge-improved';
  } else if (declinedCount > 0 && improvedCount === 0) {
    status = 'declined';
    statusLabel = '↓ Declined' + (completedComparisons < prevSets.length ? ' (' + completedComparisons + '/' + prevSets.length + ')' : '');
    statusClass = 'badge-declined';
  } else if (maintainedCount > 0 && improvedCount === 0 && declinedCount === 0) {
    status = 'maintained';
    statusLabel = '→ Maintained' + (completedComparisons < prevSets.length ? ' (' + completedComparisons + '/' + prevSets.length + ')' : '');
    statusClass = 'badge-maintained';
  } else {
    status = 'inconclusive';
    statusLabel = 'Mixed (' + improvedCount + ' up, ' + declinedCount + ' down)';
    statusClass = 'badge-inconclusive';
  }

  return {
    hasPrevious: true,
    dayKey: previousSession.dayKey,
    dateLabel: previousSession.dateFormatted,
    status: status,
    statusLabel: statusLabel,
    statusClass: statusClass,
    completedComparisons: completedComparisons,
    totalExpected: prevSets.length,
    rows: rows
  };
}


function getOverloadSuggestion(exId, exConfig, lastSets, exName) {
  var repMax = exConfig.repMax || 10;
  var repMin = exConfig.repMin || 6;
  var targetSets = exConfig.sets || 2;
  var increment = exConfig.weightIncrement || 2.5;
  var isBW = typeof isBodyweightExercise === 'function' ? isBodyweightExercise(exId, exName) : false;

  // Case 1: We have previous working sets (from this or equivalent exercise earlier in week)
  if (lastSets && lastSets.length) {
    var validSets = lastSets.filter(function(s){
      return s && (isBW ? Number(s.reps) > 0 : (Number(s.weight) > 0 && Number(s.reps) > 0));
    });

    if (validSets.length) {
      if (isBW) {
        var lastRepsBW = validSets.map(function(s){ return Number(s.reps); });
        var maxRepsBW = Math.max.apply(null, lastRepsBW);
        var addedWeight = Math.max.apply(null, validSets.map(function(s){ return Number(s.weight) || 0; }));
        if (addedWeight > 0) {
          return {
            type: 'add_reps',
            bannerHTML: '<div class="overload-banner overload-reps"><span class="overload-icon">⚡</span><div class="overload-text"><strong>Repeating Lift (Earlier in Week):</strong> Last logged at <strong>BW+' + addedWeight + ' kg × ' + maxRepsBW + ' reps</strong>. Aim for ' + (maxRepsBW + 1) + '–' + (maxRepsBW + 2) + ' reps!</div></div>'
          };
        }
        var nextRepTarget = Math.max(repMin, maxRepsBW + 1);
        return {
          type: 'add_reps',
          bannerHTML: '<div class="overload-banner overload-reps"><span class="overload-icon">⚡</span><div class="overload-text"><strong>Repeating Lift (Earlier in Week):</strong> Last logged <strong>' + lastRepsBW.join(', ') + ' reps (BW)</strong>. Aim for <strong>' + nextRepTarget + ' reps</strong> at Bodyweight!</div></div>'
        };
      }

      var lastWeight = Math.max.apply(null, validSets.map(function(s){ return Number(s.weight); }));
      var lastReps = validSets.map(function(s){ return Number(s.reps); });
      var allAtTop = validSets.length >= targetSets && validSets.slice(0, targetSets).every(function(s){ return Number(s.reps) >= repMax; });

      if (allAtTop) {
        var nextWeight = +(lastWeight + increment).toFixed(2);
        return {
          type: 'increase_weight',
          bannerHTML: '<div class="overload-banner overload-up"><span class="overload-icon">🎉</span><div class="overload-text"><strong>Top range reached (' + lastWeight + ' kg × ' + repMax + ')!</strong> Increase to <strong>' + nextWeight + ' kg</strong> (+' + increment + ' kg) for ' + repMin + '–' + (repMin + 2) + ' reps.</div></div>'
        };
      }

      var maxReps = Math.max.apply(null, lastReps);
      var targetReps = Math.min(repMax, maxReps + 1);
      return {
        type: 'add_reps',
        bannerHTML: '<div class="overload-banner overload-reps"><span class="overload-icon">⚡</span><div class="overload-text"><strong>Repeating Lift (Earlier in Week):</strong> Target <strong>' + targetReps + '–' + repMax + ' reps</strong> at <strong>' + lastWeight + ' kg</strong> (Last: ' + lastReps.join(', ') + ' reps).</div></div>'
      };
    }
  }

  // Case 2: No prior sets logged yet — generate science-based working weight recommendation
  if (typeof getScienceBasedWorkingWeight === 'function') {
    var scienceRec = getScienceBasedWorkingWeight(exId, exName, exConfig);
    if (scienceRec && scienceRec.weight) {
      if (scienceRec.source === 'correlated_lift') {
        return {
          type: 'science_rec',
          suggestedWeight: scienceRec.weight,
          bannerHTML: '<div class="overload-banner overload-reps"><span class="overload-icon">🔬</span><div class="overload-text"><strong>Science-Based Target:</strong> Based on your ' + esc(scienceRec.refLiftName) + ' (' + scienceRec.refWeight + ' kg), recommended starting weight is <strong>' + scienceRec.weight + ' kg</strong> for ' + esc(exConfig.reps) + ' reps.</div></div>'
        };
      } else {
        return {
          type: 'science_rec',
          suggestedWeight: scienceRec.weight,
          bannerHTML: '<div class="overload-banner overload-baseline"><span class="overload-icon">📊</span><div class="overload-text"><strong>Recommended Working Weight:</strong> Start at <strong>~' + scienceRec.weight + ' kg</strong> (based on ' + scienceRec.userWeight + ' kg bodyweight) for ' + esc(exConfig.reps) + ' reps (1–2 RIR).</div></div>'
        };
      }
    }
  }

  return {
    type: 'baseline',
    bannerHTML: '<div class="overload-banner overload-baseline"><span class="overload-icon">🎯</span><div class="overload-text">Baseline Session: Establish working weight for ' + esc(exConfig.reps) + ' reps with 1–2 RIR in reserve.</div></div>'
  };
}

function generateProgressionRecommendation(previousSession, currentCompletedSets, config, historySessions) {
  var isCurrentComplete = currentCompletedSets && currentCompletedSets.length >= (config.sets || 2);
  var setsToEvaluate = isCurrentComplete ? currentCompletedSets : (previousSession ? previousSession.sets : []);

  var repMin = config.repMin || 6;
  var repMax = config.repMax || 10;
  var inc = config.weightIncrement || 2.5;

  if (!setsToEvaluate || !setsToEvaluate.length) {
    return {
      category: 'baseline',
      badge: 'Baseline Session',
      badgeClass: 'rec-badge-baseline',
      headline: 'Start with a comfortable working weight',
      targets: 'Aim for ' + repMin + '–' + repMax + ' reps with 1–3 reps in reserve.',
      reason: 'No previous working sets recorded yet for this exercise.',
      actionType: 'baseline',
      suggestedWeight: null
    };
  }

  var validSets = setsToEvaluate.filter(function(s){ return s && !s.isWarmup && Number(s.reps) > 0 && Number(s.weight) > 0; });
  if (!validSets.length) {
    return {
      category: 'review_adjust',
      badge: 'Review Sets',
      badgeClass: 'rec-badge-review',
      headline: 'Log working sets to generate targets',
      targets: 'Enter valid weight and reps for all prescribed sets.',
      reason: 'Incomplete or missing set data in the recorded session.',
      actionType: 'review',
      suggestedWeight: null
    };
  }

  var maxWeight = validSets.reduce(function(m, s){ return Math.max(m, Number(s.weight)); }, 0);
  var allSetsHitMaxReps = validSets.every(function(s){ return Number(s.reps) >= repMax; });
  var anyFailedSet = validSets.some(function(s){ return s.rir === 0; });
  var hasRirLogged = validSets.some(function(s){ return s.rir != null; });
  var subMinSets = validSets.filter(function(s){ return Number(s.reps) < repMin; });

  // Check 1: Review or Adjust for repeated drops (2+ sessions with sub-minimum reps)
  var consecutiveDrops = 0;
  if (subMinSets.length > 0) {
    consecutiveDrops = 1;
    if (historySessions && historySessions.length > 0) {
      var prev2 = historySessions[0];
      if (prev2 && prev2.sets && prev2.sets.some(function(s){ return Number(s.reps) < repMin; })) {
        consecutiveDrops = 2;
      }
    }
  }

  if (consecutiveDrops >= 2) {
    var deloadWeight = Math.max(inc, Math.round(((maxWeight * 0.9) / inc)) * inc);
    return {
      category: 'review_adjust',
      badge: '⚠️ Deload & Reset',
      badgeClass: 'rec-badge-review',
      headline: 'Consider reducing weight to ' + deloadWeight + ' kg (-10%)',
      targets: 'Use ' + deloadWeight + ' kg to recover and rebuild back into ' + repMin + '–' + repMax + ' reps with pristine form.',
      reason: 'Reps fell below ' + repMin + ' for 2 consecutive sessions. A slight reset prevents fatigue accumulation and stalls.',
      actionType: 'deload',
      suggestedWeight: deloadWeight
    };
  }

  // Check 2: Double Progression - INCREASE WEIGHT
  if (allSetsHitMaxReps) {
    if (anyFailedSet && (config.targetRirMin || 1) >= 1) {
      return {
        category: 'maintain_weight',
        badge: 'Consolidate Effort',
        badgeClass: 'rec-badge-maintain',
        headline: 'Repeat ' + maxWeight + ' kg (Form Consolidation)',
        targets: 'Hit ' + repMax + ' reps on all sets with 1–2 reps in reserve without hitting failure.',
        reason: 'Reached ' + repMax + ' reps ceiling, but one or more sets hit true failure (0 RIR). Consolidate clean execution before adding load.',
        actionType: 'consolidate',
        suggestedWeight: maxWeight
      };
    }

    var nextWeight = +(maxWeight + inc).toFixed(2);
    var rirExplanation = hasRirLogged ? 'with target effort (1–3 RIR)' : '(evaluated by reps; RIR not recorded)';
    return {
      category: 'increase_weight',
      badge: '↑ Increase Weight',
      badgeClass: 'rec-badge-increase',
      headline: 'Advance to ' + nextWeight + ' kg next session (+' + inc + ' kg)',
      targets: 'Try ' + nextWeight + ' kg. Reset target to ' + repMin + '–' + repMax + ' reps with 1–3 RIR.',
      reason: 'All working sets reached ' + repMax + ' reps ' + rirExplanation + '. Double progression threshold achieved!',
      actionType: 'increase',
      suggestedWeight: nextWeight
    };
  }

  // Check 3: Add Reps (Within prescribed range, working toward repMax)
  if (validSets.every(function(s){ return Number(s.reps) >= repMin; })) {
    var targetsList = validSets.slice(0, config.sets || 2).map(function(s, idx){
      var currentR = Number(s.reps);
      var targetR = currentR < repMax ? (currentR + 1) : repMax;
      return 'Set ' + (idx + 1) + ': ' + targetR + ' reps @ ' + s.weight + ' kg';
    });

    var rirNote = hasRirLogged ? ' maintaining 1–3 RIR' : ' with controlled tempo';
    return {
      category: 'add_reps',
      badge: '+ Add Reps',
      badgeClass: 'rec-badge-add',
      headline: 'Keep ' + maxWeight + ' kg — aim for +1 rep per set',
      targets: targetsList.join(' · ') + rirNote + '.',
      reason: 'Working sets are within the ' + repMin + '–' + repMax + ' range but have not yet all reached ' + repMax + ' reps.',
      actionType: 'add_reps',
      suggestedWeight: maxWeight
    };
  }

  // Check 4: Maintain weight
  return {
    category: 'maintain_weight',
    badge: '→ Maintain',
    badgeClass: 'rec-badge-maintain',
    headline: 'Maintain ' + maxWeight + ' kg this session',
    targets: 'Target ' + repMin + '–' + repMax + ' reps on all sets at ' + maxWeight + ' kg.',
    reason: 'Working to achieve clean ' + repMin + '-rep baseline across all working sets before progressing.',
    actionType: 'maintain',
    suggestedWeight: maxWeight
  };
}

function buildCompareHTML(exId, currentSets, plannedCount, repsStr) {
  var prevFull = getPreviousSessionFull(exId);
  var cmp = compareExerciseSessions(prevFull, currentSets, plannedCount);

  if (!prevFull && !cmp.rows.some(function(r){ return r.isCompleted; })) {
    return '';
  }

  if (!cmp.hasPrevious) {
    if (!currentSets || !currentSets.filter(Boolean).length) return '';
    return '<div class="prev-compare-block">'
      + '<div class="prev-compare-header">'
      + '<span class="prev-compare-date">Previous Session</span>'
      + '<span class="prev-compare-badge ' + cmp.statusClass + '">' + esc(cmp.statusLabel) + '</span>'
      + '</div>'
      + '<div class="baseline-note">' + esc(cmp.summaryText) + '</div>'
      + '</div>';
  }

  var rowsHTML = cmp.rows.map(function(r) {
    return '<tr>'
      + '<td class="set-col">' + r.setNum + '</td>'
      + '<td class="prev-col">' + r.prevText + '</td>'
      + '<td class="curr-col">' + r.currText + '</td>'
      + '<td class="change-col ' + r.changeClass + '">' + r.changeText + '</td>'
      + '</tr>';
  }).join('');

  return '<div class="prev-compare-block">'
    + '<div class="prev-compare-header">'
    + '<span class="prev-compare-date">' + esc(cmp.dateLabel || 'Previous Session') + '</span>'
    + '<span class="prev-compare-badge ' + cmp.statusClass + '">' + esc(cmp.statusLabel) + '</span>'
    + '</div>'
    + '<table class="prev-compare-table">'
    + '<thead><tr><th>#</th><th>Previous</th><th>Current</th><th>Δ</th></tr></thead>'
    + '<tbody>' + rowsHTML + '</tbody>'
    + '</table>'
    + '</div>';
}

function buildRecommendationHTML(exId, exConfig, currentCompletedSets) {
  var prevFull = getPreviousSessionFull(exId);
  var history = getHistorySessionsFull(exId, 3);
  var rec = generateProgressionRecommendation(prevFull, currentCompletedSets, exConfig, history);
  if (!rec) return '';

  return '<div class="rec-block">'
    + '<div class="rec-header">'
    + '<span class="rec-label">Next session progression</span>'
    + '<span class="rec-badge ' + rec.badgeClass + '">' + esc(rec.badge) + '</span>'
    + '</div>'
    + '<div class="rec-body">'
    + '<div class="rec-headline">' + esc(rec.headline) + '</div>'
    + '<div class="rec-targets">' + esc(rec.targets) + '</div>'
    + '<div class="rec-reason">' + esc(rec.reason) + '</div>'
    + '</div>'
    + '</div>';
}



function getWorkoutForDate(dayKey, rec) {
  var prog = getActiveProgram();
  var d = new Date(dayKey + 'T00:00:00').getDay();
  var dayNum = d === 0 ? 7 : d;
  var weeklySched = getWeeklySchedule();
  var matched = weeklySched.find(function(s){ return s.dayNum === dayNum; });
  var defaultIndex = (matched && !matched.isRest) ? matched.workoutIndex : null;

  var index = rec && rec.selectedWorkout !== undefined ? rec.selectedWorkout : defaultIndex;
  if (index === null) {
    return { index: null, isRest: true, session: null };
  }
  var safeIndex = index == null ? 0 : Math.min(Math.max(0, index), prog.length - 1);
  return { index: safeIndex, isRest: false, session: prog[safeIndex] || prog[0] };
}

function getWorkoutWeek(dayKey) {
  var prog = getActiveProgram();
  var length = Math.max(1, prog.length);
  var completed = getCompletedWorkoutCount();
  return Math.floor(completed / length) + 1;
}

function getCompletedWorkoutCount() {
  var sessions=getWorkoutSessions(), seen={};
  var sessionDays={};
  sessions.forEach(function(s){sessionDays[s.dayKey]=true;if(s.completed) seen[s.id]=true;});
  allDayKeys().forEach(function(key){var r=dayRecord(key);if(r.workoutDone&&!sessionDays[key]) seen['legacy_'+key]=true;});
  return Object.keys(seen).length;
}

function getNextProgramWorkout() {
  var prog = getActiveProgram();
  var count = getCompletedWorkoutCount(), len = Math.max(1, prog.length);
  var index = count % len;
  return { index: index, week: Math.floor(count / len) + 1, day: index + 1, session: prog[index] || prog[0] };
}

function getActiveWorkoutSession(dayKey, programDayIndex) {
  var prog = getActiveProgram();
  var session = getWorkoutSession(dayKey, programDayIndex);
  if (session) return session;
  return {
    id: workoutSessionId(dayKey, programDayIndex),
    dayKey: dayKey,
    programDay: programDayIndex,
    programLabel: (prog[programDayIndex] || {}).label || 'Workout',
    exercises: [],
    status: 'not_started'
  };
}

function getSessionMeta(rec, programDayIndex) {
  rec.workoutMetaBySession=rec.workoutMetaBySession||{};
  return rec.workoutMetaBySession[String(programDayIndex)]||(rec.workoutMetaBySession[String(programDayIndex)]={});
}

function chooseWorkoutForDate(dayKey) {
  var prog = getActiveProgram();
  var rec=dayRecord(dayKey), overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Choose workout</div>'
    +prog.map(function(s,i){return '<button class="btn workout-choice" data-workout="'+i+'" style="text-align:left;margin-top:8px">'+esc(s.label)+'</button>';}).join('')
    +'<button class="btn" id="cancelWorkoutChoice" style="margin-top:12px">Cancel</button></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelWorkoutChoice').onclick=function(){overlay.remove();};
  overlay.querySelectorAll('.workout-choice').forEach(function(btn){btn.onclick=function(){rec.selectedWorkout=parseInt(btn.dataset.workout,10);saveDayRecord(dayKey,rec);overlay.remove();renderGym();};});
}

function renderGym() {
  var key = window.activeGymDateKey || todayKey();
  var rec = dayRecord(key);
  var prog = getActiveProgram();
  var activeDate = new Date(key + 'T00:00:00');
  var currentD = activeDate.getDay();
  var isActualToday = key === todayKey();
  var formattedSessionDate = activeDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); // 0=Sun, 1=Mon, ..., 6=Sat
  var completedCount = getCompletedWorkoutCount();
  var cycleWorkouts = prog.length || 5;
  var workoutWeek = Math.floor(completedCount / cycleWorkouts) + 1;
  var completedInCycle = completedCount % cycleWorkouts;

  // Determine active schedule day (1..7)
  var defaultScheduleDay = currentD === 0 ? 7 : currentD;
  var scheduleDayNum = rec.selectedDayNumber != null ? rec.selectedDayNumber : defaultScheduleDay;
  var weeklySched = getWeeklySchedule();
  var activeSched = weeklySched.find(function(s){ return s.dayNum === scheduleDayNum; }) || weeklySched[0];

  // Stepper HTML: marks completed days in this cycle
  var stepperHTML = weeklySched.map(function(s) {
    var isSelected = s.dayNum === scheduleDayNum;
    var isToday = defaultScheduleDay === s.dayNum;
    var isDone = false;
    if (!s.isRest && s.workoutIndex != null) {
      if (isToday && rec.workoutDone) isDone = true;
      else if (s.workoutIndex < completedInCycle) isDone = true;
    }
    var statusIcon = isDone ? '✓' : s.isRest ? '💤' : (isToday ? '⚡' : '•');
    // Short clean tag label: e.g. W1, W2, Rest, W3, W4, W5
    var tagLabel = s.isRest ? 'Rest' : (s.workoutIndex != null ? ('W' + (s.workoutIndex + 1)) : 'Day');

function renderWorkoutTimer(dayKey, rec, session, programDayIndex) {
  var wrap=document.getElementById('sessionTimer'); if(!wrap) return;
  var meta=getSessionMeta(rec, programDayIndex);
  if(!meta.startedAt && !meta.durationMinutes) {
    wrap.innerHTML='<span class="small dim">No session time yet</span><span class="timer-actions"><button class="btn btn-primary btn-sm" id="startWorkoutBtn">Start</button><button class="btn btn-sm" id="manualDurationBtn">Enter time</button></span>';
    document.getElementById('startWorkoutBtn').onclick=function(){startWorkoutSession(dayKey,session,programDayIndex);};
    document.getElementById('manualDurationBtn').onclick=function(){setManualSessionDuration(dayKey,session,programDayIndex);};
    return;
  }
  if(meta.completedAt || meta.durationMinutes) {
    wrap.innerHTML='<span><strong>'+formatDuration(meta.durationMinutes)+'</strong><span class="small dim"> total</span></span><span class="timer-actions"><span class="small dim">Saved</span><button class="btn btn-sm" id="editDurationBtn">Edit</button></span>';
    document.getElementById('editDurationBtn').onclick=function(){setManualSessionDuration(dayKey,session,programDayIndex);};
    return;
  }
  var doneCount = session.exercises.reduce(function(total, ex){
    var actualId=(rec.swaps&&rec.swaps[ex.id])||ex.id;
    return total+((rec.workout||{})[actualId]||[]).filter(Boolean).length;
  },0);
  var plannedCount = session.exercises.reduce(function(total, ex){return total+(ex.sets||0);},0);
  var canFinish = doneCount >= plannedCount;
  wrap.innerHTML='<span><strong id="workoutElapsed">'+formatDuration(Math.floor(workoutElapsed(meta)/60))+'</strong><span class="small dim"> session</span></span><span class="timer-actions">'+(canFinish?'<button class="btn btn-primary btn-sm" id="endWorkoutBtn">Finish</button>':'<span class="small dim">Keep logging</span>')+'</span>';
  var endButton=document.getElementById('endWorkoutBtn');
  if(endButton) endButton.onclick=function(){
    var hasSets=Object.keys(rec.workout||{}).some(function(id){return (rec.workout[id]||[]).some(Boolean);});
    if(!hasSets&&!confirm('No sets are logged. End this session anyway?')) return;
    endWorkoutSession(dayKey, programDayIndex, session);
      showWorkoutCelebrationModal(session, rec);
  };
  if(!meta.completedAt) {
    if(workoutTimer.interval) clearInterval(workoutTimer.interval);
    workoutTimer.interval=setInterval(function(){var el=document.getElementById('workoutElapsed');if(el){var seconds=workoutElapsed(meta);el.textContent=Math.floor(seconds/60)+':'+pad(seconds%60);}},1000);
  }


function renderRestTimer() {
  var wrap = document.getElementById('restTimerWrap');
  if (!wrap) return;
  if (restTimer.endAt) restTimer.remaining = Math.max(0, Math.ceil((restTimer.endAt - Date.now()) / 1000));
  if (!restTimer.remaining) {
    wrap.innerHTML = '';
    releaseWakeLock();
    return;
  }
  requestWakeLock();
  var mins = Math.floor(restTimer.remaining / 60);
  var secs = restTimer.remaining % 60;
  var timeStr = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;

  wrap.innerHTML = '<div class="rest-dock-overlay">'
    + '<div style="display:flex;justify-content:space-between;align-items:center">'
      + '<span class="t-label">Rest Timer</span>'
      + '<span class="t-micro">Set done. Rest.</span>'
    + '</div>'
    + '<div class="rest-dock-countdown">' + timeStr + '</div>'
    + '<div style="display:flex;gap:12px">'
      + '<button class="btn btn-sm" id="addRestBtn" style="flex:1">+15s</button>'
      + '<button class="btn btn-primary btn-sm" id="skipRestBtn" style="flex:1">Skip</button>'
    + '</div>'
    + '</div>';

  document.getElementById('addRestBtn').onclick = function() {
    restTimer.endAt += 15000;
    renderRestTimer();
  };
  document.getElementById('skipRestBtn').onclick = function() {
    clearInterval(restTimer.interval);
    restTimer.endAt = 0;
    restTimer.remaining = 0;
    wrap.innerHTML = '';
    releaseWakeLock();
  };
}
function startRestTimer(seconds) {
    clearInterval(restTimer.interval);
    restTimer.endAt = Date.now() + (seconds || 90) * 1000;
    restTimer.remaining = seconds || 90;
    renderRestTimer();
    restTimer.interval = setInterval(function() {
      restTimer.remaining = Math.max(0, Math.ceil((restTimer.endAt - Date.now()) / 1000));
      if (restTimer.remaining <= 0) {
        clearInterval(restTimer.interval);
        restTimer.endAt = 0;
        playSound('timer_done');
        triggerHaptic();
        showToast('⏰ Rest period complete! Ready for your next set.', 'ok');
      }
      renderRestTimer();
    }, 1000);
  }
}

    });

  document.querySelectorAll('.plate-calc-btn').forEach(function(btn){

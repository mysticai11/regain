          + '<option value="1" ' + (s.rir === 1 ? 'selected' : '') + '>1 RIR</option>'
          + '<option value="0" ' + (s.rir === 0 ? 'selected' : '') + '>Failure</option>'
          + '</select>'
          + '<button type="button" class="btn-ghost" style="color:var(--rust-light);padding:4px;font-size:16px;line-height:1;text-align:center" data-del-ex-idx="' + exIdx + '" data-del-set-idx="' + sIdx + '" title="Remove set">×</button>'
          + '</div>';
      }).join('');

          + '<button type="button" class="btn-ghost" style="font-size:11px;color:var(--rust-light);cursor:pointer" data-remove-ex-idx="' + exIdx + '">🗑️ Remove</button>'

        + '</div>'
        + '<div>'
          + '<label class="eyebrow" style="margin-bottom:4px">Day / Routine</label>'
          + '<select id="editSessionDay" style="min-height:38px;height:38px;padding:4px 8px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%">'
            + getActiveProgram().map(function(p, pIdx) {
                var isSel = (session.programDay === pIdx) || (session.programLabel === p.label);
                return '<option value="' + pIdx + '" ' + (isSel ? 'selected' : '') + '>' + esc(p.label) + '</option>';
              }).join('')
          + '</select>'
        + '</div>'
        + '<div>'
          + '<label class="eyebrow" style="margin-bottom:4px">Cycle Week</label>'
          + '<input type="number" min="1" max="100" id="editSessionWeek" value="' + (session.week || 1) + '" style="min-height:38px;height:38px;padding:4px 8px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%">'
        + '</div>'
        + '<div>'
          + '<label class="eyebrow" style="margin-bottom:4px">Duration (min)</label>'
          + '<input type="number" min="1" max="300" id="editSessionDuration" value="' + durationMinutes + '" style="min-height:38px;height:38px;padding:4px 8px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%">'
        + '</div>'
      + '</div>'
      + '</div>'

      + exHTML

      + '<div style="margin-bottom:14px;text-align:center">'
        + '<button type="button" class="btn" id="addExToWorkoutBtn" style="font-size:12px;padding:6px 14px">+ Add Exercise to Workout</button>'
      + '</div>'

      + '<div style="display:flex;gap:10px;margin-top:14px">'
        + '<button type="button" class="btn" id="cancelEditWorkoutBtn" style="flex:1">Cancel</button>'
        + '<button type="button" class="btn btn-primary" id="saveEditWorkoutBtn" style="flex:1">Save Changes</button>'
      + '</div>'
      + '</div>';

    // Event attachments
    overlay.querySelector('#cancelEditWorkoutBtn').onclick = function() { overlay.remove(); };

    overlay.querySelector('#saveEditWorkoutBtn').onclick = function() {
      var progList = getActiveProgram();
      var selDayIdx = parseInt(overlay.querySelector('#editSessionDay').value, 10);
      if (!isNaN(selDayIdx) && progList[selDayIdx]) {
        session.programDay = selDayIdx;
        session.programLabel = progList[selDayIdx].label;
        session.day = selDayIdx + 1;
      }
      var selWeek = parseInt(overlay.querySelector('#editSessionWeek').value, 10);
      if (!isNaN(selWeek) && selWeek > 0) {
        session.week = selWeek;
      }
      captureCurrentInputs();
      var durInput = parseInt(overlay.querySelector('#editSessionDuration').value, 10);
      if (durInput && durInput > 0) {
        session.durationMinutes = durInput;
        session.duration_sec = durInput * 60;
      }
      var newDate = overlay.querySelector('#editSessionDate').value;
      var oldDate = session.dayKey;

      rec.workout = rec.workout || {};
      session.exercises = currentExercises.map(function(ex) {
        rec.workout[ex.id] = ex.sets;
        return { id: ex.id, name: ex.name, sets: ex.sets };
      });

      if (newDate && newDate !== oldDate) {
        session.dayKey = newDate;

        var newRec = dayRecord(newDate);
        newRec.workout = rec.workout;
        newRec.workoutDone = true;
        saveDayRecord(newDate, newRec);
        // Clear from old day record if no workouts left
        if (oldDate) {
          var oldRec = dayRecord(oldDate);
          oldRec.workout = {};
          oldRec.workoutDone = false;

    overlay.querySelectorAll('[data-remove-ex-idx]').forEach(function(btn) {

        }

    });

    overlay.querySelectorAll('[data-add-set-ex-idx]').forEach(function(btn) {
      btn.onclick = function() {

        renderModalBody();
      };
    });

    var addExBtn = overlay.querySelector('#addExToWorkoutBtn');

      addExBtn.onclick = function() {

        chosenName = chosenName.trim();
        var found = allEx.find(function(e){ return e.name.toLowerCase() === chosenName.toLowerCase(); });
        var newId = found ? found.id : ('custom_' + chosenName.toLowerCase().replace(/\s+/g, '_'));
        currentExercises.push({
          id: newId,
          name: found ? found.name : chosenName,
          sets: [{ weight: 20, reps: 10, rir: 2 }]
        });
        renderModalBody();
      };
    }
  }

  document.body.appendChild(overlay);
  renderModalBody();
}


function buildDotConsistencyCalendarHTML() {
  var now = new Date();
  var months = [];
  for (var m = 2; m >= 0; m--) {
    var d = new Date(now.getFullYear(), now.getMonth() - m, 1);
    months.push({ year: d.getFullYear(), month: d.getMonth() });
  }
  var monthNames = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  var todayStr = todayKey();
  var trainedCount = 0;

  var monthsHTML = months.map(function(item) {
    var firstDay = new Date(item.year, item.month, 1);
    var lastDay = new Date(item.year, item.month + 1, 0);
    var daysInMonth = lastDay.getDate();
    var startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
    
    var cells = [];
    for (var o = 0; o < startOffset; o++) {
      cells.push('<div class="cal-dot empty"></div>');
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var mm = (item.month + 1 < 10 ? '0' : '') + (item.month + 1);
      var dd = (day < 10 ? '0' : '') + day;
      var key = item.year + '-' + mm + '-' + dd;
      var rec = dayRecord(key);
      var trained = rec && (rec.workoutDone || (rec.workout && Object.keys(rec.workout).some(function(k){return (rec.workout[k]||[]).some(Boolean);})));
      var isToday = (key === todayStr);
      var isFuture = new Date(item.year, item.month, day) > now;

      if (trained) trainedCount++;

      var cls = 'cal-dot';
      if (isFuture) cls += ' empty';
      else if (trained && isToday) cls += ' today lit';
      else if (isToday) cls += ' today';
      else if (trained) cls += ' lit';

      cells.push('<div class="' + cls + '"></div>');
    }

    return '<div class="cal-grid-month">'
      + '<div class="cal-grid-month-title">' + monthNames[item.month] + ' ' + item.year + '</div>'
      + '<div class="cal-grid-dots">' + cells.join('') + '</div>'
      + '</div>';
  }).join('');

  return '<div style="margin-bottom:28px">'
    + '<div class="t-label" style="margin-bottom:12px">' + trainedCount + (trainedCount === 1 ? ' workout' : ' workouts') + '</div>'
    + monthsHTML
    + '</div>';
}

function renderProgressSimple(mode) {
  mode=mode||'body';
  var entries=getWeightHistory(), records=allDayKeys().map(function(k){var r=dayRecord(k),t=getDayTotals(k);return {key:k,weight:r.weight,kcal:t.kcal,protein:t.protein};});
  var workoutSessions=getWorkoutSessions().filter(function(session){return (session.exercises||[]).some(function(exercise){return (exercise.sets||[]).some(Boolean);});});
  var current=entries.length?entries[entries.length-1].weight:null, range='1w';
  var exOptions=[]; getActiveProgram().forEach(function(s){s.exercises.forEach(function(e){if(!exOptions.some(function(x){return x.id===e.id;}))exOptions.push(e);});});
  allDayKeys().forEach(function(key){Object.keys(dayRecord(key).workout||{}).forEach(function(id){var e=getExerciseData(id);if(e&&!exOptions.some(function(x){return x.id===id;}))exOptions.push(e);});});
  var render=function(){
    var rangeEntries=getProgressRows(range,entries), weightValues=getRollingWeightValues(rangeEntries,entries);
    var cutoff = range === 'all' ? 0 : Date.now() - ({'1w':7,'1m':30,'3m':90}[range]||30)*86400000;
    var rangeRecords=records.filter(function(r){return new Date(r.key+'T23:59:59').getTime()>=cutoff;});
    var liftControl=document.getElementById('liftSelect');
    var selected=liftControl?liftControl.value:null, liftValues=[];
    var selectedExData = selected ? getExerciseData(selected) : null;
    var isBW = selected ? isBodyweightExercise(selected, selectedExData ? selectedExData.name : '') : false;
    var eqIds = (typeof getEquivalentExerciseIds === 'function' && selected) ? getEquivalentExerciseIds(selected) : (selected ? [selected] : []);

    rangeRecords.forEach(function(r){
      var best = 0;
      var dayWo = dayRecord(r.key).workout || {};
      eqIds.forEach(function(id){
        (dayWo[id] || []).forEach(function(s){
          if (!s) return;
          if (isBW) {
            var reps = Number(s.reps) || 0;
            if (reps > best) best = reps;
          } else {
            var e1 = calcE1RM(s.weight, s.reps);
            if (e1 > best) best = e1;
          }
        });
      });
      if (best > 0) {
        liftValues.push({
          value: best,
          label: r.key + ' · ' + (isBW ? (best + ' reps (BW)') : (best.toFixed(1) + ' kg'))
        });
      }
    });

    var allLiftValues=[];
    rangeRecords.forEach(function(r){
      var total=0,count=0;
      Object.keys(dayRecord(r.key).workout||{}).forEach(function(id){
        var best=0;
        var exIsBW = isBodyweightExercise(id);
        (dayRecord(r.key).workout[id]||[]).forEach(function(s){
          if(s){
            if (exIsBW) {
              var rVal = Number(s.reps) || 0;
              if (rVal > best) best = rVal;
            } else {

              if (e1 > best) best = e1;

    var weightPlot=document.getElementById('weightPlot'); if(weightPlot) weightPlot.innerHTML=progressPlot(weightValues, (profile && profile.targetWeight) || null);
    var liftPlot=document.getElementById('liftPlot'); if(liftPlot) liftPlot.innerHTML=progressPlot(liftValues, null, isBW ? 'reps' : 'kg');

    var liftMeta=document.getElementById('liftMeta');

        if (isBW) {
          liftMeta.textContent = latestLift + ' reps (BW) peak' + (firstLift!=null&&liftValues.length>1 ? ' · ' + (latestLift-firstLift>=0?'+':'') + (latestLift-firstLift) + ' reps since start' : '');
        } else {
          liftMeta.textContent = latestLift.toFixed(1) + ' kg e1RM' + (firstLift!=null&&liftValues.length>1 ? ' · ' + (latestLift-firstLift>=0?'+':'') + (latestLift-firstLift).toFixed(1) + ' since start' : '');
        }
      } else {
        liftMeta.textContent = 'No lift entries yet';
      }
    }
  };
  var bodySection = '<div style="margin-bottom:28px">'

    + '</div>'

    + '<div class="range-row" style="margin-bottom:16px">'

    + '<div style="display:flex;gap:8px;margin-top:16px">'
      + '<input id="progressWeight" type="number" step="0.1" min="20" max="300" placeholder="Log weight (kg)" inputmode="decimal" style="flex:1">'
      + '<button class="btn btn-primary" id="saveProgressWeight">Save</button>'
    + '</div>'
    + '</div>'
    + '<div style="margin-top:28px">'

      + workoutHistoryHTML()

function buildWeekDotRowHTML(dayKey) {
  var letters = ['M','T','W','T','F','S','S'];
  var now = new Date(dayKey + 'T00:00:00');
  var dow = now.getDay(); // 0=Sun, 1=Mon...
  var monday = addDays(now, -(dow === 0 ? 6 : dow - 1));
  var cols = [];

  for (var d = 0; d < 7; d++) {
    var day = addDays(monday, d);
    var k = dateKey(day);
    var isToday = (k === dayKey);
    var rec = dayRecord(k);
    var isTrained = rec && (rec.workoutDone || (rec.workout && Object.keys(rec.workout).some(function(id){return (rec.workout[id]||[]).some(Boolean);})));

    var dotCls = 'week-strip-dot';
    if (isTrained) dotCls += ' is-trained';
    if (isToday) dotCls += ' is-today';

    cols.push('<div class="week-strip-cell' + (isToday ? ' is-today' : '') + '">'
      + '<span class="week-strip-day">' + letters[d] + '</span>'
      + '<span class="' + dotCls + '"></span>'
      + '</div>');
  }

  return '<div class="week-strip-row">' + cols.join('') + '</div>';
}

function buildCalRingHTML(kcalLogged, kcalTarget, protLogged, protTarget, carbsLogged, fatLogged) {
  var remaining = Math.max(0, kcalTarget - kcalLogged);
  var isOver = kcalLogged > kcalTarget;
  var calPct = Math.min(100, Math.round(kcalLogged / Math.max(1, kcalTarget) * 100));
  var protPct = Math.min(100, Math.round(protLogged / Math.max(1, protTarget) * 100));

  return '<div style="margin-bottom:20px">'
    + '<div class="t-hero tabnum">' + (isOver ? ('+' + (kcalLogged - kcalTarget).toLocaleString()) : remaining.toLocaleString()) + '</div>'
    + '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">' + (isOver ? 'kcal over target' : ('of ' + kcalTarget.toLocaleString() + ' kcal')) + '</div>'
    + '<div class="prog-line" style="margin-top:10px;margin-bottom:20px"><div class="prog-line-fill" style="width:' + calPct + '%"></div></div>'
    + '<div style="display:flex;align-items:baseline;gap:6px">'
      + '<span class="t-display tabnum">' + Math.round(protLogged) + '</span>'
      + '<span style="font-size:15px;color:var(--text-secondary)">/ ' + protTarget + ' g</span>'
    + '</div>'
    + '<div class="prog-line" style="margin-top:8px"><div class="prog-line-fill" style="width:' + protPct + '%"></div></div>'
    + '</div>';
}

function buildWeightTrendChip(currentWeight) {
  if (currentWeight == null) return '';
  var entries = ((profile && profile.weightEntries) || []).slice().sort(function(a,b){ return String(a.createdAt||a.dayKey).localeCompare(String(b.createdAt||b.dayKey)); });
  var sevenDaysAgo = dateKey(addDays(new Date(), -7));
  var old = null;
  for (var i = entries.length - 1; i >= 0; i--) {
    if (entries[i].dayKey <= sevenDaysAgo && entries[i].weight != null) { old = entries[i].weight; break; }
  }
  if (old == null || entries.length < 2) return '';
  var delta = currentWeight - old;
  var sign = delta > 0 ? '+' : '';
  var cls = delta > 0.2 ? 'up' : (delta < -0.2 ? 'down' : 'flat');
  var arrow = delta > 0.2 ? '↑' : (delta < -0.2 ? '↓' : '→');
  return '<span class="weight-trend-chip ' + cls + '">' + arrow + ' ' + sign + delta.toFixed(1) + ' kg vs 7d ago</span>';
}

function buildNextSessionPreviewHTML() {

    return '<span class="next-session-ex">' + esc(ex.name) + '</span>';

  var moreCount = Math.max(0, (session.exercises || []).length - 6);

  return '<div class="next-session-card">'
    + '<div class="next-session-eyebrow">Next up • Week ' + next.week + '</div>'
    + '<div class="next-session-label">' + esc(session.label) + '</div>'
    + '<div class="next-session-exercises">' + exPills + '</div>'
    + '</div>';
}

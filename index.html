    };
  });
  document.querySelectorAll('.warm-up-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openWarmUpSheet(btn.dataset.exname, btn.dataset.exid);
    });
  });

  document.querySelectorAll('.ex-note-input').forEach(function(input){
    input.addEventListener('change', function(){
      profile.exerciseNotes = profile.exerciseNotes || {};
      profile.exerciseNotes[input.dataset.ex] = input.value.trim();
      sv('rg_profile', profile);
      showToast('Cue saved', 'ok');
    });
  });
  document.querySelectorAll('.cue-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      var row=btn.closest('.ex-note-row'), open=row.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });
    document.querySelectorAll('.planned-set input.prefill').forEach(function(input){
      input.addEventListener('focus',function(){
        if(input.value==='' && input.dataset.prefill) {
          input.value=input.dataset.prefill;
          input.classList.remove('prefill');
          input.dispatchEvent(new Event('input',{bubbles:true}));
        }
      });
    });
  });

  document.querySelectorAll('[data-logset]').forEach(function(btn){
    btn.addEventListener('click', function(){
      triggerHaptic();
      var id = btn.dataset.logset;
      var isBW = isBodyweightExercise(id);
      var setIndex = parseInt(btn.dataset.setIndex,10);
      var wEl = document.querySelector('.set-weight[data-ex="'+id+'"][data-set-index="'+setIndex+'"]');
      var rEl = document.querySelector('.set-reps[data-ex="'+id+'"][data-set-index="'+setIndex+'"]');
      var rawW = (wEl ? wEl.value : '').trim();
      var w = 0;
      if (rawW !== '' && rawW.toUpperCase() !== 'BW') {
        w = parseFloat(rawW) || 0;
      }
      var r = parseInt(rEl.value, 10);
      if (!r || r <= 0) { showToast('Please enter reps', 'warn'); return; }
      if (!isBW && (!w || w <= 0)) { showToast('Please enter weight and reps', 'warn'); return; }
      var rirEl = document.querySelector('.set-rir[data-ex="'+id+'"][data-set-index="'+setIndex+'"]');
      var rirValue = rirEl && rirEl.value !== '' ? parseInt(rirEl.value,10) : null;
      rec = dayRecord(key);
      rec.workout = rec.workout||{};
      rec.workout[id] = rec.workout[id]||[];
      rec.workoutDraft = rec.workoutDraft||{};
      var sessionMeta=getSessionMeta(rec, programDayIndex);
      var hadLoggedSets = Object.keys(rec.workout).some(function(workoutId){
        return (rec.workout[workoutId]||[]).some(Boolean);
      });
      if(!sessionMeta.startedAt) sessionMeta.startedAt=new Date().toISOString();
      if(!hadLoggedSets) sessionMeta.firstSetAt=new Date().toISOString();
      sessionMeta.lastSetAt=new Date().toISOString();
      sessionMeta.sessionLabel=session.label;
      rec.workout[id][setIndex] = {weight:w,reps:r,rir:rirValue};
      if (rec.workoutDraft[id]) delete rec.workoutDraft[id][setIndex];
      // Auto-fill next set with current set numbers so user does not re-type
      if (!rec.workout[id][setIndex + 1]) {
        rec.workoutDraft[id] = rec.workoutDraft[id] || [];
        rec.workoutDraft[id][setIndex + 1] = { weight: w, reps: r, rir: rirValue };
      }
      // Real-time PR detection
      var exObj = getExerciseData(id) || {};
      var isBW = isBodyweightExercise(id, exObj.name);
      if (isBW && (!w || w === 0)) {
        var prevBestReps = getBestRepCount(id) || 0;
        if (r > prevBestReps) {
          playSound('workout_complete');
          triggerHaptic();
          showToast('🏆 NEW REPS PR! ' + (exObj.name || 'Lift') + ': ' + r + ' reps (BW)', 'ok');
        } else {
          playSound('set_logged');
        }
      } else {
        var prevBestE1RM = getBestE1RM(id) || 0;
        var currentE1RM = w * (1 + r / 30);
        if (currentE1RM > prevBestE1RM + 0.25) {
          playSound('workout_complete');
          triggerHaptic();
          showToast('🏆 NEW PR! ' + (exObj.name || 'Lift') + ': ' + (w > 0 ? (w + 'kg × ' + r) : (r + ' reps')) + ' (' + currentE1RM.toFixed(1) + 'kg e1RM)', 'ok');
        } else {
          playSound('set_logged');
        }
      }
      sessionMeta.updatedAt=new Date().toISOString();
      // Check if all exercises done (2+ sets each)
      var allDone = session.exercises.every(function(ex){var actualId=(rec.swaps&&rec.swaps[ex.id])||ex.id;return (rec.workout[actualId]||[]).filter(Boolean).length>=(ex.sets||2);});
      if(allDone && !rec.workoutDone){
        rec.workoutDone=true; profile.xp=(profile.xp||0)+30; sv('rg_profile',profile);
        showToast('Session complete! +30 XP 🎉','ok');
      } else {
        profile.xp=(profile.xp||0)+3; sv('rg_profile',profile);
      }
      saveDayRecord(key,rec);
      renderGym();
      if(navigator.vibrate) navigator.vibrate(35);
      var loggedExercise=getExerciseData(id)||{};
      startRestTimer(loggedExercise.rest||90);
    });
  });

  document.querySelectorAll('.effort-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      openEffortSheet(btn.dataset.effortEx, parseInt(btn.dataset.setIndex,10));
    });
  });

  
  // Tap-to-cycle RIR handler (3+ -> 2 -> 1 -> F)
  document.querySelectorAll('[data-cycle-rir]').forEach(function(btn) {
    btn.onclick = function() {
      var exId = btn.dataset.cycleRir, sIdx = parseInt(btn.dataset.setIndex, 10);
      var select = document.querySelector('.set-rir[data-ex="' + exId + '"][data-set-index="' + sIdx + '"]');
      if (!select) return;
      var cur = select.value === '' ? null : parseInt(select.value, 10);
      var nextVal, nextTxt;
      if (cur === null || cur === 3) { nextVal = '2'; nextTxt = 'RIR 2'; }
      else if (cur === 2) { nextVal = '1'; nextTxt = 'RIR 1'; }
      else if (cur === 1) { nextVal = '0'; nextTxt = 'F'; }
      else { nextVal = '3'; nextTxt = '3+ RIR'; }

      select.value = nextVal;
      btn.textContent = nextTxt;

      var draftRec = dayRecord(key);
      draftRec.workoutDraft = draftRec.workoutDraft || {};
      draftRec.workoutDraft[exId] = draftRec.workoutDraft[exId] || [];
      draftRec.workoutDraft[exId][sIdx] = draftRec.workoutDraft[exId][sIdx] || {};
      draftRec.workoutDraft[exId][sIdx].rir = parseInt(nextVal, 10);
      saveDayRecord(key, draftRec);
    };
  });

  document.querySelectorAll('.set-weight,.set-reps,.set-rir').forEach(function(input){
    input.addEventListener('input', function(){
      var draftRec=dayRecord(key), id=input.dataset.ex, index=parseInt(input.dataset.setIndex,10);
      var isBW = isBodyweightExercise(id);
      draftRec.workoutDraft=draftRec.workoutDraft||{};
      draftRec.workoutDraft[id]=draftRec.workoutDraft[id]||[];
      var wInput = document.querySelector('.set-weight[data-ex="'+id+'"][data-set-index="'+index+'"]');
      var rInput = document.querySelector('.set-reps[data-ex="'+id+'"][data-set-index="'+index+'"]');
      var rawW = (wInput ? wInput.value : '').trim();
      var parsedW = (rawW === '' || rawW.toUpperCase() === 'BW') ? 0 : (parseFloat(rawW) || 0);
      var parsedR = parseInt((rInput ? rInput.value : ''), 10) || '';
      var row={
        weight: parsedW,
        reps: parsedR,
        rir: (document.querySelector('.set-rir[data-ex="'+id+'"][data-set-index="'+index+'"]').value || null)
      };
      draftRec.workoutDraft[id][index]=row;
      saveDayRecord(key,draftRec);
      var logButton=document.querySelector('[data-logset="'+id+'"][data-set-index="'+index+'"]');
      if(logButton) {
        logButton.disabled = isBW ? !(parseInt(rInput.value, 10) > 0) : !(parseFloat(wInput.value) > 0 && parseInt(rInput.value, 10) > 0);
      }
    });
  });

  document.querySelectorAll('[data-add-set]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var draftRec=dayRecord(key), id=btn.dataset.addSet;
      draftRec.workoutDraft=draftRec.workoutDraft||{};
      draftRec.workoutDraft[id]=draftRec.workoutDraft[id]||[];
      var count=Math.max((draftRec.workout&&draftRec.workout[id]||[]).length,draftRec.workoutDraft[id].length);
      draftRec.workoutDraft[id][count]={weight:'',reps:'',rir:null};
      saveDayRecord(key,draftRec);
      renderGym();
    });
  });

  document.querySelectorAll('[data-remove-draft]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var draftRec=dayRecord(key), id=btn.dataset.removeDraft, index=parseInt(btn.dataset.setIndex,10);
      if(draftRec.workoutDraft&&draftRec.workoutDraft[id]){
        draftRec.workoutDraft[id].splice(index,1);
        saveDayRecord(key,draftRec);
        renderGym();
      }
    });
  });

  document.querySelectorAll('.swap-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openSwapSheet(btn.dataset.swapOrig, btn.dataset.swapCurr, btn.dataset.muscle, key);
    });
  });

  document.querySelectorAll('[data-quick-edit-logged]').forEach(function(btn){
    btn.addEventListener('click', function(){
      openQuickEditSetModal({
        context: 'gym',
        dayKey: key,
        exId: btn.dataset.quickEditLogged,
        exName: btn.dataset.exName,
        setIndex: parseInt(btn.dataset.setIndex, 10),
        weight: parseFloat(btn.dataset.weight) || 0,
        reps: parseInt(btn.dataset.reps, 10) || 0,
        rir: btn.dataset.rir === '' ? null : parseInt(btn.dataset.rir, 10)
      });
    });
  });

  document.querySelectorAll('[data-delete-set]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var current=dayRecord(key), id=btn.dataset.deleteSet, index=parseInt(btn.dataset.setIndex,10);
      if(current.workout && current.workout[id]) { current.workout[id].splice(index,1); current.workoutDone=false; saveDayRecord(key,current); renderGym(); }
    });
  });
  document.querySelectorAll('[data-edit-set]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var current=dayRecord(key), id=btn.dataset.editSet, index=parseInt(btn.dataset.setIndex,10), set=current.workout&&current.workout[id]&&current.workout[id][index];
      if(!set) return;
      var weight=prompt('Weight (kg)',set.weight), reps=prompt('Reps',set.reps), effort=prompt('RIR (0 = failure, blank = not logged)',set.rir===0?'0':(set.rir==null?'':set.rir));
      if(weight===null||reps===null||effort===null) return;
      var w=parseFloat(weight), r=parseInt(reps,10);
      if(!w||!r||w<=0||r<=0){showToast('Enter valid weight and reps','warn');return;}
      var rir=effort.trim()===''?null:parseInt(effort,10);
      if(rir!==null&&(isNaN(rir)||rir<0||rir>3)){showToast('RIR must be blank or 0 to 3','warn');return;}
      current.workout[id][index]={weight:w,reps:r,rir:rir}; saveDayRecord(key,current); renderGym();
    });
  });
}

    +'<label class="eyebrow">Notes / cue</label><input id="customExCue" type="text" placeholder="optional technique cue">'
    +'<div class="modal-actions" style="margin-top:10px"><button class="btn" id="cancelRoutineBtn">Cancel</button><button class="btn btn-primary" id="saveRoutineBtn">Add exercise</button></div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelRoutineBtn').addEventListener('click', function(){ overlay.remove(); });

    var exercise = {

      name:name,
      muscle:overlay.querySelector('#customExMuscle').value.trim() || 'other',
      sets:parseInt(overlay.querySelector('#customExSets').value,10)||3,
      reps:overlay.querySelector('#customExReps').value.trim() || 'manual',

      type:overlay.querySelector('#customExType').value
    };
    profile.customRoutines = profile.customRoutines || {};

    profile.customRoutines[day].push(exercise);

      + '</div>'

      // Section 3: Workout Days
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
        + '<span class="eyebrow">Workout Sessions (' + prog.length + ' days in split)</span>'
      + '</div>'
      + '<div class="split-manager-list">' + (daysHTML || '<div style="text-align:center;color:var(--text-muted);padding:20px 0">No workout days in this plan yet.</div>') + '</div>'

      // Bottom buttons
      + '<div style="display:flex;gap:10px;margin-top:16px">'
        + '<button class="btn" id="addNewSplitDayBtn" style="flex:1">+ Add Workout Day</button>'
        + '<button class="btn btn-primary" id="saveCloseSplitBtn" style="flex:1">Save & Apply Plan</button>'
      + '</div>'
    + '</div>';

    // Day toggles events
    overlay.querySelectorAll('[data-split-day]').forEach(function(btn) {
      btn.onclick = function() {
        var dayVal = parseInt(btn.dataset.splitDay, 10);
        if (tdays.includes(dayVal)) {
          if (tdays.length <= 1) {
            showToast('You need at least 1 training day', 'warn');
            return;
          }
          tdays = tdays.filter(function(x){ return x !== dayVal; });
        } else {
          tdays.push(dayVal);
          tdays.sort(function(a,b){ return (a === 0 ? 7 : a) - (b === 0 ? 7 : b); });
        }
        renderSplitUI();
      };
    });

    // Preset templates events
    overlay.querySelectorAll('[data-apply-template]').forEach(function(btn) {
      btn.onclick = function() {
        var key = btn.dataset.applyTemplate;
        if (key === '5day') {
          if (!confirm('Load the 5-Day Muscle Split (Chest & Back A, Legs & Shoulders A, Arms, Chest & Back B, Legs & Shoulders B)?')) return;
          prog = JSON.parse(JSON.stringify(DEFAULT_5DAY_ROUTINE));
          tdays = [1, 2, 4, 5, 6]; // Mon, Tue, Thu, Fri, Sat
        } else if (key === '4day') {
          if (!confirm('Load 4-Day Upper / Lower Split?')) return;
          prog = JSON.parse(JSON.stringify(PROGRAM_4DAY));
          tdays = [1, 2, 4, 5]; // Mon, Tue, Thu, Fri
        } else if (key === '3day') {
          if (!confirm('Load 3-Day Full Body / PPL Split?')) return;
          prog = JSON.parse(JSON.stringify(PROGRAM_3DAY));
          tdays = [1, 3, 5]; // Mon, Wed, Fri
        } else if (key === '2day') {
          if (!confirm('Load 2-Day Full Body Split?')) return;
          prog = JSON.parse(JSON.stringify(PROGRAM_2DAY));
          tdays = [2, 5]; // Tue, Fri
        } else if (key === '6day') {
          if (!confirm('Load 6-Day Push/Pull/Legs Split?')) return;
          prog = JSON.parse(JSON.stringify(PROGRAM_6DAY));
          tdays = [1, 2, 3, 4, 5, 6]; // Mon-Sat
        } else if (key === 'blank') {
          if (!confirm('Start a fresh blank workout plan?')) return;
          prog = [
            { label: 'Day 1 — Custom Workout', dayIndex: 0, exercises: [] }
          ];
          tdays = [1, 3, 5];
        }
        renderSplitUI();
        showToast('Template loaded', 'ok');
      };
    });

    // Reorder day up
    overlay.querySelectorAll('[data-move-day-up]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.moveDayUp, 10);
        if (dI > 0) {
          var temp = prog[dI];
          prog[dI] = prog[dI - 1];
          prog[dI - 1] = temp;
          renderSplitUI();
        }
      };
    });

    // Reorder day down
    overlay.querySelectorAll('[data-move-day-dn]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.moveDayDn, 10);
        if (dI < prog.length - 1) {
          var temp = prog[dI];
          prog[dI] = prog[dI + 1];
          prog[dI + 1] = temp;
          renderSplitUI();
        }
      };
    });

    // Rename day
    overlay.querySelectorAll('[data-rename-day]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.renameDay, 10);
        var currentLabel = prog[dI].label || '';
        var newName = prompt('Enter name for this workout day:', currentLabel);
        if (newName && newName.trim()) {
          prog[dI].label = newName.trim();
          renderSplitUI();
        }
      };
    });

    // Reorder exercise up
    overlay.querySelectorAll('[data-move-ex-up]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.moveExUp, 10);
        var eI = parseInt(btn.dataset.exIdx, 10);
        if (eI > 0) {
          var temp = prog[dI].exercises[eI];
          prog[dI].exercises[eI] = prog[dI].exercises[eI - 1];
          prog[dI].exercises[eI - 1] = temp;
          renderSplitUI();
        }
      };
    });

    // Reorder exercise down
    overlay.querySelectorAll('[data-move-ex-dn]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.moveExDn, 10);
        var eI = parseInt(btn.dataset.exIdx, 10);
        if (eI < prog[dI].exercises.length - 1) {
          var temp = prog[dI].exercises[eI];
          prog[dI].exercises[eI] = prog[dI].exercises[eI + 1];
          prog[dI].exercises[eI + 1] = temp;
          renderSplitUI();
        }
      };
    });

    // Delete day
    overlay.querySelectorAll('[data-del-day]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.delDay, 10);
        if (prog.length <= 1) {
          showToast('Workout plan must have at least 1 day', 'warn');
          return;
        }
        if (!confirm('Delete ' + (prog[dI].label || 'this day') + '?')) return;
        prog.splice(dI, 1);
        renderSplitUI();
      };
    });

    // Delete exercise
    overlay.querySelectorAll('[data-del-ex-day]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.delExDay, 10);
        var eI = parseInt(btn.dataset.delExIdx, 10);
        prog[dI].exercises.splice(eI, 1);
        renderSplitUI();
      };
    });

    // Add exercise to day
    overlay.querySelectorAll('[data-add-ex-day]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.addExDay, 10);
        openAddExerciseModal(function(newEx) {
          prog[dI].exercises.push(newEx);
          renderSplitUI();
        });
      };
    });

    // Edit exercise
    overlay.querySelectorAll('[data-edit-ex-day]').forEach(function(btn) {
      btn.onclick = function() {
        var dI = parseInt(btn.dataset.editExDay, 10);
        var eI = parseInt(btn.dataset.editExIdx, 10);
        var ex = prog[dI].exercises[eI];
        openEditExerciseModal(ex, function(updatedEx) {
          prog[dI].exercises[eI] = updatedEx;
          renderSplitUI();
        });
      };
    });

    // Add new day
    overlay.querySelector('#addNewSplitDayBtn').onclick = function() {
      var dayName = prompt('Enter Day Name (e.g. Day ' + (prog.length + 1) + ' — Push):', 'Day ' + (prog.length + 1) + ' — Custom');
      if (!dayName || !dayName.trim()) return;
      prog.push({
        label: dayName.trim(),
        dayIndex: prog.length,
        exercises: []
      });
      renderSplitUI();
    };

    // Reset default
    overlay.querySelector('#resetDefaultSplitBtn').onclick = function() {
      if (!confirm('Reset back to the default 5-Day Muscle-Building Split (Day 4 Arms, Day 5 Chest & Back B)?')) return;
      prog = JSON.parse(JSON.stringify(DEFAULT_5DAY_ROUTINE));
      tdays = [1, 2, 4, 5, 6];
      profile.activeSplitData = prog;
      profile.trainingDays = tdays;
      sv('rg_profile', profile);
      renderSplitUI();
      showToast('Reset to 5-Day Muscle Split', 'ok');
    };

    // Save & Close
    overlay.querySelector('#saveCloseSplitBtn').onclick = function() {
      if (!tdays || tdays.length === 0) {
        showToast('Please select at least 1 training day', 'warn');
        return;
      }
      if (!prog || prog.length === 0) {
        showToast('Please add at least 1 workout day', 'warn');
        return;
      }
      profile.activeSplitData = prog;
      profile.trainingDays = tdays;
      profile.programSplit = 'custom';
      sv('rg_profile', profile);
      overlay.remove();
      showToast('Workout plan & schedule saved ✓', 'ok');
      renderTab();
    };
  }

  document.body.appendChild(overlay);
  renderSplitUI();
}

function openCustomRoutineManager() {
  var days = profile.trainingDays || [];
  var names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var routines = profile.customRoutines || {};
  var overlay = document.createElement('div'); overlay.className='overlay';
  var rows = days.map(function(day){
    var routine = routines[day] || [];
    var count = routine.length;
    var exerciseList = routine.map(function(ex){
      return '<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--text-secondary)"><span style="flex:1">'+ex.name+'</span><button class="btn-ghost" data-routine-remove="'+day+'" data-exid="'+ex.id+'" style="color:var(--rust-light);font-size:11px">Remove</button></div>';
    }).join('');
    return '<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)">' 
      +'<div style="flex:1"><div style="font-size:14px;font-weight:600">'+names[day]+'</div><div style="font-size:11px;color:var(--text-muted)">'+count+' exercise'+(count===1?'':'s')+' saved</div>'+exerciseList+'</div>'
      +'<button class="btn btn-sm" data-routine-day="'+day+'">Add</button></div>';
  }).join('');
  overlay.innerHTML = '<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Custom routines</div>'
    +'<div style="font-size:12px;color:var(--text-muted);line-height:1.45">Build each training day separately. Your sets, reps, and weight stay in the daily log.</div>'
    +rows
    +'<button class="btn" id="closeRoutineManagerBtn" style="margin-top:10px">Close</button></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#closeRoutineManagerBtn').addEventListener('click', function(){ overlay.remove(); });
  overlay.querySelectorAll('[data-routine-remove]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var day = btn.dataset.routineRemove;
      profile.customRoutines[day] = (profile.customRoutines[day] || []).filter(function(ex){ return ex.id !== btn.dataset.exid; });
      sv('rg_profile', profile);
      overlay.remove();
      openCustomRoutineManager();
    });
  });
  overlay.querySelectorAll('[data-routine-day]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var day = parseInt(btn.dataset.routineDay,10);
      var now = new Date();
      var offset = (day - now.getDay() + 7) % 7;
      var target = addDays(now, offset);
      overlay.remove();
      openCustomRoutineSheet(dateKey(target));
    });
  });
}

      +'</div>';
  }).join('');
  overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Swap Exercise</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">Swaps apply to this session only.</div>'+rows+'<button class="btn" style="margin-top:14px;width:100%" id="closeSwapBtn">Cancel</button></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#closeSwapBtn').addEventListener('click', function(){overlay.remove();});
  overlay.querySelectorAll('[data-selectswap]').forEach(function(b){
    b.addEventListener('click', function(){
      var sid = b.dataset.selectswap;
      var rec = dayRecord(dayKey);
      rec.swaps = rec.swaps || {};
      if(sid === origId) delete rec.swaps[origId];
      else rec.swaps[origId] = sid;
      saveDayRecord(dayKey, rec);
      overlay.remove(); renderGym();
    });
  });
}

function workoutElapsed(meta) {
  if(!meta || !meta.startedAt) return 0;
  var start = meta.startedAt;
  var end = meta.completedAt || new Date().toISOString();
  return Math.max(0, Math.floor((new Date(end).getTime()-new Date(start).getTime())/1000));
}

function formatDuration(minutes) {
  var total=Math.max(0,Number(minutes)||0);
  return Math.floor(total/60)+':'+pad(total%60);
}

function startWorkoutSession(dayKey, session, programDayIndex) {
  var rec=dayRecord(dayKey);
  var meta=getSessionMeta(rec, programDayIndex);
  if(!meta.startedAt) {
    meta.startedAt=new Date().toISOString();
    meta.sessionLabel=session.label;
    saveDayRecord(dayKey,rec);
  }
  renderGym();
}

function endWorkoutSession(dayKey, programDayIndex, session) {
  var rec=dayRecord(dayKey);
  var meta=getSessionMeta(rec, programDayIndex);
  if(!meta.startedAt || meta.completedAt) return;
  meta.completedAt=new Date().toISOString();
  rec.workoutDone=true;
  meta.durationMinutes=Math.max(1,Math.round((new Date(meta.completedAt).getTime()-new Date(meta.startedAt).getTime())/60000));
  meta.duration_sec=meta.durationMinutes*60;
  saveDayRecord(dayKey,rec);
  if(workoutTimer.interval) clearInterval(workoutTimer.interval);
  renderGym();
  showWorkoutSummary(rec, programDayIndex, session);
}

function showWorkoutSummary(rec, programDayIndex, session) {
  var sets=0, volume=0;
  (session.exercises||[]).forEach(function(ex){
    var id=(rec.swaps&&rec.swaps[ex.id])||ex.id;
    ((rec.workout||{})[id]||[]).filter(Boolean).forEach(function(s){sets++;volume+=(Number(s.weight)||0)*(Number(s.reps)||0);});
  });
  var meta=getSessionMeta(rec, programDayIndex), minutes=meta.durationMinutes||0;
  var overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet completion-sheet"><div class="sheet-handle"></div><div class="completion-mark">✓</div><div class="sheet-title">Workout complete</div><div class="small dim">'+esc(meta.sessionLabel||'Session')+'</div><div class="completion-stats"><div><strong>'+formatDuration(minutes)+'</strong><span>duration</span></div><div><strong>'+sets+'</strong><span>sets</span></div><div><strong>'+Math.round(volume).toLocaleString()+'</strong><span>kg volume</span></div></div><button class="btn btn-primary" id="closeWorkoutSummary" style="width:100%;margin-top:16px">Done</button></div>';
  document.body.appendChild(overlay);
  if(navigator.vibrate) navigator.vibrate([30,50,30]);
  overlay.querySelector('#closeWorkoutSummary').onclick=function(){overlay.remove();};
}

function setManualSessionDuration(dayKey, session, programDayIndex) {
  var rec=dayRecord(dayKey);
  var meta=getSessionMeta(rec, programDayIndex);
  meta.sessionLabel=meta.sessionLabel||session.label;
  var current=meta.durationMinutes||Math.round(workoutElapsed(meta)/60)||'';
  var value=prompt('Total session time in minutes', String(current));
  if(value===null) return;
  var minutes=Number(value);
  if(!Number.isFinite(minutes)||minutes<1||minutes>1440) {
    showToast('Enter a duration from 1 to 1440 minutes','warn');
    return;
  }
  meta.durationMinutes=Math.round(minutes);
  meta.duration_sec=meta.durationMinutes*60;
  meta.sessionLabel=session.label;
  if(!meta.startedAt) meta.completedAt=meta.completedAt||new Date().toISOString();
  meta.updatedAt=new Date().toISOString();
  saveDayRecord(dayKey,rec);
  showToast('Session time saved','ok');
  renderGym();
}

// FOOD SEARCH SHEET
// ═════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════════ function openFoodSearch(callback) {
  var overlay = document.createElement('div'); overlay.className='overlay'; overlay.id='foodOverlay';
  overlay.innerHTML = '<div class="sheet">'
    +'<div class="sheet-handle"></div>'
    +'<div class="sheet-title">Add food</div>'
    +'<input type="text" id="foodSearchInput" placeholder="Search foods (e.g. chicken, oats…)" autocomplete="off">'
    +'<div id="searchResults"></div>'
    +'<button class="btn" id="createCustomBtn" style="margin-top:12px">'+ic('plus')+' Create custom food</button>'
    +'<button class="btn" id="createRecipeBtn" style="margin-top:6px">'+ic('cook')+' Build recipe</button>'
    +'<button class="btn-ghost" id="closeFoodSearch" style="margin-top:8px;text-align:center;width:100%">Cancel</button>'
    +'</div>';
  document.body.appendChild(overlay);

  function closeSearch(){overlay.remove();}
  document.getElementById('closeFoodSearch').addEventListener('click',closeSearch);
  overlay.addEventListener('click',function(e){if(e.target===overlay)closeSearch();});

  var timer2;
  document.getElementById('foodSearchInput').addEventListener('input',function(){
    var q=this.value;
    clearTimeout(timer2);
    if(!q){document.getElementById('searchResults').innerHTML='';return;}
    timer2=setTimeout(function(){
      FoodDB.search(q).then(function(results){renderSearchResults(results,callback,closeSearch);});
    },200);
  });
  document.getElementById('foodSearchInput').focus();

  document.getElementById('createCustomBtn').addEventListener('click',function(){
    overlay.remove(); openCustomFoodBuilder(callback);
  });
  document.getElementById('createRecipeBtn').addEventListener('click',function(){
    overlay.remove(); openRecipeBuilder(callback);
  });
}

function renderSearchResults(results, callback, closeSearch) {
  var zone = document.getElementById('searchResults'); if(!zone) return;
  if(!results.length){zone.innerHTML='<div style="padding:20px 0;text-align:center;color:var(--text-muted);font-size:13px">No results. Try a different term or create a custom food.</div>';return;}
  zone.innerHTML = results.map(function(f,i){
    var perServing = foodMacros(f,1);
    return '<div class="search-result" data-idx="'+i+'">'
      +'<div><div class="search-result-name">'+f.name+'</div><div class="search-result-meta">'+f.unit+' · '+perServing.kcal+' kcal · '+perServing.protein+'P '+perServing.carbs+'C '+perServing.fat+'F'+(f._type==='custom'?' <span class="search-result-tag">custom</span>':'')+'</div></div>'
      +'</div>';
  }).join('');
  results.forEach(function(food,i){
    var el=zone.querySelectorAll('.search-result')[i];
    if(el) el.addEventListener('click',function(){ openServingSelector(food,callback,closeSearch); });
  });
}

function openServingSelector(food, callback, closeSearch) {
  var overlay = document.createElement('div'); overlay.className='overlay'; overlay.id='servingOverlay';
  var ps = foodMacros(food,1);
  overlay.innerHTML = '<div class="sheet">'
    +'<div class="sheet-handle"></div>'
    +'<div class="sheet-title">'+food.name+'</div>'
    +'<div style="color:var(--text-muted);font-size:12px;margin-bottom:8px">'+food.unit+' = '+food.serving_g+'g</div>'
    +'<div class="food-detail-macros">'
      +'<div class="food-detail-macro"><div class="val">'+ps.kcal+'</div><div class="lbl">kcal</div></div>'
      +'<div class="food-detail-macro"><div class="val amber">'+ps.protein+'g</div><div class="lbl">protein</div></div>'
      +'<div class="food-detail-macro"><div class="val sage">'+ps.carbs+'g</div><div class="lbl">carbs</div></div>'
      +'<div class="food-detail-macro"><div class="val" style="color:var(--rust-light)">'+ps.fat+'g</div><div class="lbl">fat</div></div>'
    +'</div>'
    +'<label class="eyebrow" style="margin-bottom:6px">Servings</label>'
    +'<input type="number" id="servingsInput" value="1" step="0.25" min="0.25" max="20" inputmode="decimal">'
    +'<div id="servingPreview" style="font-size:13px;color:var(--text-muted);margin-top:8px">= '+ps.kcal+' kcal · '+ps.protein+'P · '+ps.carbs+'C · '+ps.fat+'F</div>'
    +'<div class="modal-actions" style="margin-top:14px">'
      +'<button class="btn" id="cancelServingBtn">Back</button>'
      +'<button class="btn btn-primary" id="confirmServingBtn">Add to log</button>'
    +'</div>'
    +'</div>';
  document.body.appendChild(overlay);

  document.getElementById('servingsInput').addEventListener('input',function(){
    var s=parseFloat(this.value)||1; var m=foodMacros(food,s);
    document.getElementById('servingPreview').textContent='= '+m.kcal+' kcal · '+m.protein+'P · '+m.carbs+'C · '+m.fat+'F';
  });
  document.getElementById('cancelServingBtn').addEventListener('click',function(){overlay.remove();});
  document.getElementById('confirmServingBtn').addEventListener('click',function(){
    var s=parseFloat(document.getElementById('servingsInput').value)||1;
    overlay.remove(); if(closeSearch) closeSearch();
    callback(food,s);
  });
}

// ── Custom food builder ────────────────────────────────────────────────────────
function openCustomFoodBuilder(callback) {
  var overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet">'
    +'<div class="sheet-handle"></div>'
    +'<div class="sheet-title">Custom food</div>'
    +'<label class="eyebrow" style="margin-top:8px">Name</label><input type="text" id="cfName" placeholder="e.g. Home protein shake">'
    +'<label class="eyebrow" style="margin-top:8px">Serving size label</label><input type="text" id="cfUnit" placeholder="e.g. 1 shake, 100g">'
    +'<label class="eyebrow" style="margin-top:8px">Grams per serving</label><input type="number" id="cfGrams" placeholder="e.g. 350" inputmode="numeric">'
    +'<label class="eyebrow" style="margin-top:8px">Calories per serving</label><input type="number" id="cfKcal" placeholder="e.g. 480" inputmode="numeric">'
    +'<label class="eyebrow" style="margin-top:8px">Protein (g) per serving</label><input type="number" step="0.1" id="cfProt" placeholder="e.g. 30" inputmode="decimal">'
    +'<label class="eyebrow" style="margin-top:8px">Carbs (g) per serving</label><input type="number" step="0.1" id="cfCarb" placeholder="e.g. 55" inputmode="decimal">'
    +'<label class="eyebrow" style="margin-top:8px">Fat (g) per serving</label><input type="number" step="0.1" id="cfFat" placeholder="e.g. 12" inputmode="decimal">'
    +'<div class="modal-actions" style="margin-top:14px">'
      +'<button class="btn" id="cancelCFBtn">Cancel</button>'
      +'<button class="btn btn-primary" id="saveCFBtn">Save & add</button>'
    +'</div></div>';
  document.body.appendChild(overlay);
  document.getElementById('cancelCFBtn').addEventListener('click',function(){overlay.remove();});
  document.getElementById('saveCFBtn').addEventListener('click',function(){
    var name=document.getElementById('cfName').value.trim();
    var unit=document.getElementById('cfUnit').value.trim()||'1 serving';
    var g=parseFloat(document.getElementById('cfGrams').value)||100;
    var kcal=parseFloat(document.getElementById('cfKcal').value)||0;
    var prot=parseFloat(document.getElementById('cfProt').value)||0;
    var carb=parseFloat(document.getElementById('cfCarb').value)||0;
    var fat=parseFloat(document.getElementById('cfFat').value)||0;
    if(!name||!kcal){showToast('Name and calories required','warn');return;}
    // Store per 100g so it's consistent with FOODS array
    var factor = 100/g;
    FoodDB.addCustom({name:name,unit:unit,serving_g:g,kcal:+(kcal*factor).toFixed(1),protein:+(prot*factor).toFixed(2),carbs:+(carb*factor).toFixed(2),fat:+(fat*factor).toFixed(2)}).then(function(id){
      overlay.remove();
      var pseudo = {name:name,unit:unit,serving_g:g,kcal:+(kcal*factor).toFixed(1),protein:+(prot*factor).toFixed(2),carbs:+(carb*factor).toFixed(2),fat:+(fat*factor).toFixed(2),id:id,_type:'custom'};
      if(callback) openServingSelector(pseudo,callback,null);
    });
  });
}

// ── Recipe builder ─────────────────────────────────────────────────────────────
function openRecipeBuilder(callback) {
  var overlay=document.createElement('div'); overlay.className='overlay';
  var ingredients=[];
  function renderIngredients(){
    return ingredients.map(function(ing,i){
      var m=foodMacros(ing.food,ing.servings);
      return '<div class="ingredient-row"><div class="ingredient-name">'+ing.food.name+' ×'+ing.servings+'</div><div style="font-size:11px;color:var(--text-muted)">'+m.kcal+'kcal</div><button class="btn-ghost" data-ing="'+i+'">'+ic('trash')+'</button></div>';
    }).join('');
  }
  function totals(){
    var t={kcal:0,protein:0,carbs:0,fat:0};
    ingredients.forEach(function(ing){var m=foodMacros(ing.food,ing.servings);t.kcal+=m.kcal;t.protein+=m.protein;t.carbs+=m.carbs;t.fat+=m.fat;});
    return t;
  }
  function refresh(){
    var t=totals();
    var ir=overlay.querySelector('#ingList'); if(ir) ir.innerHTML=renderIngredients();
    var tr=overlay.querySelector('#recipeTotals'); if(tr) tr.textContent='Total: '+Math.round(t.kcal)+' kcal · '+t.protein.toFixed(1)+'P · '+t.carbs.toFixed(1)+'C · '+t.fat.toFixed(1)+'F';
    overlay.querySelectorAll('[data-ing]').forEach(function(b){
      b.addEventListener('click',function(){ingredients.splice(parseInt(b.dataset.ing,10),1);refresh();});
    });
  }
  overlay.innerHTML='<div class="sheet">'
    +'<div class="sheet-handle"></div>'
    +'<div class="sheet-title">Build recipe</div>'
    +'<label class="eyebrow" style="margin-top:8px">Recipe name</label><input type="text" id="recName" placeholder="e.g. Morning oats bowl">'
    +'<button class="btn btn-sm" id="addIngBtn" style="margin-top:10px">'+ic('plus')+' Add ingredient</button>'
    +'<div id="ingList" style="margin-top:8px"></div>'
    +'<div id="recipeTotals" style="font-size:13px;color:var(--text-muted);margin-top:8px">Total: 0 kcal</div>'
    +'<div class="modal-actions" style="margin-top:14px">'
      +'<button class="btn" id="cancelRcpBtn">Cancel</button>'
      +'<button class="btn btn-primary" id="saveRcpBtn">Save & add</button>'
    +'</div></div>';
  document.body.appendChild(overlay);
  refresh();
  document.getElementById('cancelRcpBtn').addEventListener('click',function(){overlay.remove();});
  document.getElementById('addIngBtn').addEventListener('click',function(){
    openFoodSearch(function(food,servings){ingredients.push({food:food,servings:servings});refresh();});
  });
  document.getElementById('saveRcpBtn').addEventListener('click',function(){
    var name=document.getElementById('recName').value.trim();
    if(!name){showToast('Enter a recipe name','warn');return;}
    var t=totals();
    var g=ingredients.reduce(function(s,ing){return s+ing.food.serving_g*ing.servings;},0)||100;
    var factor=100/g;
    var recipe={name:name,unit:'1 serving',serving_g:g,kcal:+(t.kcal*factor).toFixed(1),protein:+(t.protein*factor).toFixed(2),carbs:+(t.carbs*factor).toFixed(2),fat:+(t.fat*factor).toFixed(2),ingredients:ingredients.map(function(i){return {name:i.food.name,servings:i.servings};})};
    FoodDB.addRecipe(recipe).then(function(id){
      overlay.remove();
      var pseudo=Object.assign({},recipe,{id:id,_type:'recipe'});
      if(callback) openServingSelector(pseudo,callback,null);
    });
  });
}

function seedMockData() {
  if(!profile) return;
  
  // Clear existing day logs to avoid overlaps
  allDayKeys().forEach(function(k){
    localStorage.removeItem('rg_day_' + k);
  });
  
  var today = new Date();
  var startD = addDays(today, -21);
  profile.startDate = startD.toISOString().split('T')[0];
  profile.startWeight = 54.0;
  profile.targetWeight = 60.0;
  sv('rg_profile', profile);

  var plan = profile.mealPlan || DEFAULT_MEAL_PLAN;
  var tdays = profile.trainingDays || [1,3,5];
  
  var prog = getActiveProgram();
  var sessionRotation = 0;
  
  for(var i=0; i<=21; i++) {
    var d = addDays(startD, i);
    var key = dateKey(d);
    var isTrain = tdays.includes(d.getDay());
    
    // Weight curve: linear increase from 54.0 to 54.8 with fluctuation
    var weight = 54.0 + (i * 0.04) + (Math.sin(i * 1.5) * 0.08);
    weight = +weight.toFixed(1);
    
    var sleep = +(7.0 + (Math.cos(i) * 0.8) + (Math.sin(i / 2) * 0.5)).toFixed(1);
    var readiness = Math.round(3.5 + (Math.sin(i) * 1.2));
    if (readiness < 1) readiness = 1;
    if (readiness > 5) readiness = 5;
    
    var note = '';
    if (i === 1) note = 'Bulk started. Appetite high.';
    else if (i === 4) note = 'Felt strong on compound lifts.';
    else if (i === 7) note = 'First week complete. Gained slightly.';
    else if (i === 11) note = 'Rough sleep last night, but recovery is fine.';
    else if (i === 14) note = 'PR on squats! Feeling great.';
    else if (i === 18) note = 'Energy levels are solid, weight is trending up.';
    else if (i === 21) note = 'Bulk moving fast, ready to calibrate calorie targets.';

    var rec = {
      weight: weight,
      sleep: sleep,
      readiness: readiness,
      recovery: readiness >= 3 ? 'good' : 'bad',
      note: note,
      meals: {},
      workout: {},
      workoutDone: isTrain,
      badAppetite: false,
      avocados: (i % 5 === 0) ? 1 : 0,
      extra: []
    };
    
    // Populate meals
    Object.keys(plan).forEach(function(gKey){
      var group = plan[gKey];
      if(group.gymOnly && !isTrain) return;
      group.items.forEach(function(item){
        rec.meals[item.id] = true;
      });
    });
    
    // Random extra snacks
    if (i % 3 === 0) {
      rec.extra.push({ name: 'Rice & Ghee Extra', kcal: 250, protein: 4, carbs: 50, fat: 5, servings: 1 });
    } else if (i % 4 === 0) {
      rec.extra.push({ name: 'Protein Bar', kcal: 220, protein: 20, carbs: 15, fat: 6, servings: 1 });
    }
    
    // Populate workout sets if training day
    if (isTrain) {
      var sess = prog[sessionRotation % prog.length];
      sessionRotation++;
      
      sess.exercises.forEach(function(ex){
        var weekNum = Math.floor(i / 7) + 1;
        var baseWeight = 0;
        
        if (ex.id === 'squat') baseWeight = 50 + (weekNum * 2.5);
        else if (ex.id === 'bench') baseWeight = 40 + (weekNum * 2.5);
        else if (ex.id === 'rdl') baseWeight = 45 + (weekNum * 2.5);
        else if (ex.id === 'ohp') baseWeight = 30 + (weekNum * 2.5);
        else if (ex.id === 'barbell_row') baseWeight = 35 + (weekNum * 2.5);
        else if (ex.id === 'leg_press') baseWeight = 100 + (weekNum * 5);
        else if (ex.id === 'lat_pulldown') baseWeight = 40 + (weekNum * 2.5);
        else if (ex.id === 'cable_row') baseWeight = 35 + (weekNum * 2.5);
        else if (ex.id === 'incline_bench') baseWeight = 18 + (weekNum * 2);
        else baseWeight = 15 + (weekNum * 1.25);
        
        var targetSets = ex.sets || 3;
        rec.workout[ex.id] = [];
        for(var s=0; s<targetSets; s++) {
          var reps = 8 + (weekNum - 1) + (s % 2 === 0 ? 0 : 1);
          rec.workout[ex.id].push({ weight: baseWeight, reps: reps });
        }
      });
    }
    
    saveDayRecord(key, rec);
  }
}

// ── Custom foods manager ───────────────────────────────────────────────────────
function openCustomFoodsManager() {
  FoodDB.getAllCustom().then(function(foods){
    var overlay=document.createElement('div'); overlay.className='overlay';
    var rows = foods.length
      ? foods.map(function(f){
          var serving_kcal=Math.round(f.kcal*f.serving_g/100);
          return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">'
            +'<div style="flex:1"><div style="font-size:14px">'+f.name+'</div><div style="font-size:11px;color:var(--text-muted)">'+f.unit+' · '+serving_kcal+' kcal · '+f.protein+'P/100g</div></div>'
            +'<button class="btn-ghost" data-delcustom="'+f.id+'">'+ic('trash')+'</button>'
            +'</div>';
        }).join('')
      : '<div style="padding:20px 0;text-align:center;color:var(--text-muted)">No custom foods yet.</div>';
    overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Custom foods</div>'+rows
      +'<button class="btn" style="margin-top:14px" id="doneCustomBtn">Done</button></div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#doneCustomBtn').addEventListener('click',function(){overlay.remove();openSettings();});
    overlay.querySelectorAll('[data-delcustom]').forEach(function(btn){
      btn.addEventListener('click',function(){
        FoodDB.deleteCustom(parseInt(btn.dataset.delcustom,10)).then(function(){overlay.remove();openCustomFoodsManager();});
      });
    });
  });
}

function openMealEditor() {
  var tmpl = ls('rg_meals', DEFAULT_MEALS);

  var fields = tmpl.map(function(m,i){
    return '<div style="background:var(--surface);border-radius:10px;padding:12px;margin-bottom:10px">'
      +'<input type="text" value="'+m.name+'" data-mname="'+i+'" style="margin-bottom:6px">'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">'
        +'<input type="number" value="'+m.kcal+'" data-mkcal="'+i+'" placeholder="kcal" inputmode="numeric">'
        +'<input type="number" value="'+m.protein+'" data-mprot="'+i+'" placeholder="P(g)" inputmode="decimal">'
        +'<input type="number" value="'+m.carbs+'" data-mcarb="'+i+'" placeholder="C(g)" inputmode="decimal">'
        +'<input type="number" value="'+m.fat+'" data-mfat="'+i+'" placeholder="F(g)" inputmode="decimal">'
      +'</div>'
    +'</div>';
  }).join('');
  overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Edit meal templates</div>'
    +'<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Edit name and macros per meal slot. Changes apply immediately.</div>'
    +fields
    +'<div class="modal-actions" style="margin-top:8px">'
      +'<button class="btn" id="cancelMealEdit">Cancel</button>'
      +'<button class="btn btn-primary" id="saveMealEdit">Save</button>'
    +'</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelMealEdit').addEventListener('click',function(){overlay.remove();});
  overlay.querySelector('#saveMealEdit').addEventListener('click',function(){
    tmpl.forEach(function(m,i){
      var n=overlay.querySelector('[data-mname="'+i+'"]'); if(n) m.name=n.value.trim()||m.name;
      var k=overlay.querySelector('[data-mkcal="'+i+'"]'); if(k) m.kcal=parseFloat(k.value)||m.kcal;
      var p=overlay.querySelector('[data-mprot="'+i+'"]'); if(p) m.protein=parseFloat(p.value)||m.protein;
      var c=overlay.querySelector('[data-mcarb="'+i+'"]'); if(c) m.carbs=parseFloat(c.value)||m.carbs;
      var f=overlay.querySelector('[data-mfat="'+i+'"]');  if(f) m.fat=parseFloat(f.value)||m.fat;
    });
    sv('rg_meals', tmpl); mealTemplates=tmpl;
    overlay.remove(); renderToday();
  });
}

function openEffortSheet(exId, setIndex) {
  var select=document.querySelector('.set-rir[data-ex="'+exId+'"][data-set-index="'+setIndex+'"]');
  if(!select) return;
  var current=select.value===''?null:parseInt(select.value,10);
  var options=[
    {value:'',title:'Not set',copy:'Skip effort tracking'},
    {value:'3',title:'3+ RIR',copy:'Could do 3 or more'},
    {value:'2',title:'2 RIR',copy:'Could do 2 more'},
    {value:'1',title:'1 RIR',copy:'Could do 1 more'},
    {value:'0',title:'Failure',copy:'No more clean reps',failure:true}
  ];
  var overlay=document.createElement('div'); overlay.className='overlay';
  overlay.innerHTML='<div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Set effort</div><div class="effort-sheet-copy">RIR means reps in reserve. Choose the option that best describes how hard this set felt.</div><div class="effort-choice-grid">'+options.map(function(option){
    var active=(option.value===''?current===null:current===parseInt(option.value,10));
    return '<button type="button" class="btn effort-choice '+(option.failure?'failure':'')+'" data-effort-value="'+option.value+'" '+(active?'aria-pressed="true"':'')+'><strong>'+option.title+(active?' ✓':'')+'</strong><small>'+option.copy+'</small></button>';
  }).join('')+'</div><button type="button" class="btn" id="cancelEffortBtn" style="width:100%;margin-top:10px">Cancel</button></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#cancelEffortBtn').onclick=function(){overlay.remove();};
  overlay.addEventListener('click',function(event){if(event.target===overlay) overlay.remove();});
  overlay.querySelectorAll('[data-effort-value]').forEach(function(option){
    option.onclick=function(){
      select.value=option.dataset.effortValue;
      select.dispatchEvent(new Event('input',{bubbles:true}));
      var trigger=document.querySelector('.effort-btn[data-effort-ex="'+exId+'"][data-set-index="'+setIndex+'"]');

        var value=option.dataset.effortValue;
        trigger.textContent=value===''?'Effort':(value==='0'?'Failure':value+' RIR');
        trigger.classList.toggle('has-value',value!=='');
      }
      overlay.remove();
    };
  });
}

function showToast(msg, type) {
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);background:'+(type==='ok'?'var(--sage-dark)':type==='warn'?'var(--amber-dark)':'var(--surface-raised)')+';color:var(--text);padding:9px 18px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4)';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove();},300);},2000);
}

function showUndoToast(msg, undo) {
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);background:var(--surface-hi);color:var(--text);padding:9px 12px 9px 16px;border-radius:20px;font-size:13px;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:flex;align-items:center;gap:12px';
  t.innerHTML='<span>'+esc(msg)+'</span><button class="btn-ghost" style="color:var(--amber-light);font-weight:700">Undo</button>';
  document.body.appendChild(t);
  var closed=false;
  t.querySelector('button').onclick=function(){if(closed)return;closed=true;undo();t.remove();};
  setTimeout(function(){if(closed)return;closed=true;t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove();},300);},3500);
}

function handlePhotoUpload(file) {
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var MAX_WIDTH = 400; var MAX_HEIGHT = 400;
      var width = img.width; var height = img.height;
      if (width > height) {
        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
      } else {
        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
      }
      canvas.width = width; canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      if(!profile.photos) profile.photos=[];
      profile.photos.push({date: new Date().toISOString(), srcBase64: dataUrl});
      sv('rg_profile', profile);
      renderProgress();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function exportData() {
  FoodDB.exportAll().then(function(dbData){
    var keys = allDayKeys();
    var keySet = {};
    keys.forEach(function(k){ keySet[k] = true; });
    Object.keys(localStorage).forEach(function(k){ if(k.indexOf('rg_day_') === 0) keySet[k.slice(7)] = true; });
    Object.keys(SQLiteStorage.cache || {}).forEach(function(k){ if(k.indexOf('rg_day_') === 0) keySet[k.slice(7)] = true; });
    keys = Object.keys(keySet).sort();
    var data = {
      app:'Regain',
      version:3,
      exported: new Date().toISOString(),
      profile:ls('rg_profile',null),
      meals:ls('rg_meals',DEFAULT_MEALS),
      recentFoods:ls('rg_recent_foods',[]),
      lastBackup:ls('rg_last_backup',null),
      workoutSessions:ls(WORKOUT_SESSIONS_KEY,{version:WORKOUT_SESSIONS_VERSION,sessions:{},migrated:false}),
      dayKeys:keys,
      days:{},
      idb:dbData
    };
    keys.forEach(function(k){ data.days[k]=dayRecord(k); });
    var jsonStr = JSON.stringify(data, null, 2);
    var fileName = 'regain-backup-' + todayKey() + '.json';

    if (navigator.share && navigator.canShare) {
      try {
        var file = new File([jsonStr], fileName, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({
            title: 'Regain Backup ' + todayKey(),
            text: 'Regain workout and nutrition backup',
            files: [file]
          }).then(function(){
            sv('rg_last_backup', Date.now());
            showToast('Backup shared successfully', 'ok');
          }).catch(function(e){
            if (e.name !== 'AbortError') fallbackDownload(jsonStr, fileName);
          });
          return;
        }
      } catch(e) {}
    }
    fallbackDownload(jsonStr, fileName);
  }).catch(function(err) {
    console.error('Export failed:', err);
    showToast('Export failed. Try again after freeing device storage.','warn');
  });

  function fallbackDownload(jsonStr, fileName) {
    var blob = new Blob([jsonStr], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    sv('rg_last_backup', Date.now());
    showToast('Profile, progress, meals, and workouts exported','ok');
  }
}

function importData() {
  var input=document.createElement('input'); input.type='file'; input.accept='.json';
  input.addEventListener('change',function(){
    var file=input.files[0]; if(!file) return;
    var reader=new FileReader();
    reader.onload=function(e){
      try {
        var data=JSON.parse(e.target.result);
        if(!data.profile || !data.days || typeof data.days !== 'object') throw new Error('Invalid backup file');
        if(!confirm('This will overwrite all current data. Continue?')) return;
        var importedKeys=Object.keys(data.days), existingKeys=[];
        Object.keys(localStorage).forEach(function(k){if(k.indexOf('rg_day_')===0) existingKeys.push(k.slice(7));});
        Object.keys(SQLiteStorage.cache||{}).forEach(function(k){if(k.indexOf('rg_day_')===0&&existingKeys.indexOf(k.slice(7))<0) existingKeys.push(k.slice(7));});
        existingKeys.forEach(function(k){if(importedKeys.indexOf(k)<0) SQLiteStorage.delete('rg_day_'+k);});
        sv('rg_profile',data.profile);
        sv('rg_meals',data.meals||DEFAULT_MEALS);
        sv('rg_recent_foods',data.recentFoods||[]);
        Object.keys(data.days||{}).forEach(function(k){sv('rg_day_'+k,data.days[k]);});
        if(data.workoutSessions) sv(WORKOUT_SESSIONS_KEY,data.workoutSessions);
        FoodDB.importAll(data.idb||{}).then(function(){ profile=data.profile; sv('rg_last_backup', Date.now()); showToast('Profile, progress, meals, and workouts restored','ok'); setTimeout(function(){location.reload();},800); }).catch(function(){ showToast('Food database restore failed','warn'); });
      } catch(err) { console.error('Import failed:', err); showToast('Invalid or corrupted backup file','warn'); }
    };
    reader.readAsText(file);
  });
  input.click();
}

function requestPersistentStorage() {
  if (!navigator.storage || !navigator.storage.persist) return;
  navigator.storage.persist().then(function(granted) {
    if (!granted) console.info('Persistent storage was not granted by the browser');
  }).catch(function(err) {
    console.warn('Persistent storage request failed:', err);
  });
}

function renderOnboarding() {
  document.getElementById('app').innerHTML =
    '<div class="onboard">'
    +'<div class="onboard-title">Iron Log</div>'
    +'<div class="onboard-sub">One-time configuration. All data remains locally on this device.</div>'
    
    +'<label style="margin-top:16px">Your Name (optional)</label>'
    +'<input type="text" id="obName" placeholder="e.g. Arjun">'
    
    +'<label style="margin-top:16px">Starting Weight (kg)</label>'
    +'<input type="number" step="0.1" id="obWeight" value="54.0" placeholder="e.g. 54.0" inputmode="decimal">'
    
    +'<label style="margin-top:16px">Primary Goal</label>'

      +'<option value="full">Full Gym (Barbell, Dumbbells, Cables, Machines)</option>'
      +'<option value="home">Home Gym (Barbell, Dumbbells, Bench)</option>'
      +'<option value="db">Dumbbells Only</option>'
      +'<option value="body">Bodyweight / Calisthenics</option>'
    +'</select>'
    
    +'<label style="margin-top:16px">Dietary Pattern</label>'
    +'<select id="obDiet">'
      +'<option value="nonveg">Non-Vegetarian</option>'
      +'<option value="eggitarian">Eggitarian</option>'
      +'<option value="veg">Vegetarian</option>'
      +'<option value="vegan">Vegan</option>'

    sv('rg_profile',profile);
    var firstDay=dayRecord(todayKey()); firstDay.weight=w; saveDayRecord(todayKey(),firstDay);
    renderApp();
  });

function renderHistory() {
  var keys = allDayKeys().reverse(); // Newest first
  
  var listHTML = keys.map(function(k) {
    var rec = dayRecord(k);
    var tot = getDayTotals(k);
    var targets = getTargetsForDate(k);
    var ct = targets.kcal;
    var d = new Date(k + 'T00:00:00');
    var dayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    var formattedDate = dayName + ', ' + d.toLocaleDateString();
    var status = dayStatus(tot.kcal, ct);
    var statusColor = status==='target' ? 'var(--sage-light)' : status==='aggressive' ? 'var(--rust-light)' : 'var(--text-muted)';
    
    // Workout summary
    var woHTML = '';
    if(rec.workoutDone && rec.workout) {
      var exCount = Object.keys(rec.workout).length;
      woHTML = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:12px;color:var(--text-secondary)">'
        + ic('barbell','14') + ' ' + exCount + ' exercises completed</div>';
    }

    return '<div class="exercise-card" style="margin-bottom:10px">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start">'
        + '<div><div class="exercise-name">'+formattedDate+'</div>'
        + '<div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+(rec.weight ? rec.weight+' kg' : 'No weight logged')+'</div></div>'
        + '<div style="text-align:right;font-family:\'Space Mono\',monospace;font-size:14px;color:'+statusColor+'">'+tot.kcal+'<span style="font-size:10px;color:var(--text-muted)"> / '+ct+'</span></div>'
      + '</div>'
      + '<div style="display:flex;gap:12px;margin-top:8px;font-size:12px;font-family:\'Space Mono\',monospace">'
        + '<span style="color:var(--amber-light)">'+tot.protein+'P</span>'
        + '<span style="color:var(--sage-light)">'+tot.carbs+'C</span>'
        + '<span style="color:var(--rust-light)">'+tot.fat+'F</span>'
      + '</div>'
      + woHTML
      + '</div>';
  }).join('');

  document.getElementById('content').innerHTML =
    '<div class="topbar"><div><span class="eyebrow">All logs</span><div class="title">History</div></div></div>'
    + '<div style="margin-bottom:20px">' + listHTML + '</div>';
}

function getWeightHistory() {
  var entries = (profile && Array.isArray(profile.weightEntries)) ? profile.weightEntries.slice() : [];
  allDayKeys().forEach(function(k) {
    var r=dayRecord(k);
    if(r.weight!=null && !entries.some(function(e){return e.dayKey===k;})) entries.push({id:'legacy_'+k,dayKey:k,weight:r.weight,createdAt:k+'T12:00:00'});
  });
  return entries.filter(function(e){return e.weight!=null;}).sort(function(a,b){return String(a.createdAt||a.dayKey).localeCompare(String(b.createdAt||b.dayKey));});
}

function getProgressRows(range, entries) {
  var cutoff = range === 'all' ? 0 : Date.now() - ({'1w':7,'1m':30,'3m':90}[range]||30)*86400000;
  return entries.filter(function(e){return new Date(e.createdAt||e.dayKey+'T12:00:00').getTime() >= cutoff;});
}

function getRollingWeightValues(entries, source) {
  source=source||entries;
  return entries.map(function(entry, i) {
    var day=new Date((entry.dayKey||entry.createdAt).slice(0,10)+'T12:00:00');
    var start=addDays(day,-6).getTime(), end=day.getTime();
    var window=source.filter(function(e){var t=new Date((e.dayKey||e.createdAt).slice(0,10)+'T12:00:00').getTime();return t>=start&&t<=end;});
    var avg=window.reduce(function(sum,e){return sum+Number(e.weight);},0)/window.length;
    return {value:+avg.toFixed(2),label:entry.dayKey+' · 7-day avg '+avg.toFixed(2)+' kg'};
  });
}

function goalTrajectoryText(entries) {
  var target = Number((profile && profile.targetWeight) || 60), direction=goalDirection();
  if(!target||entries.length<3) return 'Log 3 weigh-ins over 14+ days for an estimate';
  var firstDate=new Date((entries[0].dayKey||entries[0].createdAt).slice(0,10)+'T12:00:00');
  var lastDate=new Date((entries[entries.length-1].dayKey||entries[entries.length-1].createdAt).slice(0,10)+'T12:00:00');
  var weeks=(lastDate-firstDate)/604800000;
  if(weeks<2) return 'Keep logging for 14+ days for an estimate';
  var rate=(entries[entries.length-1].weight-entries[0].weight)/weeks;
  if(!Number.isFinite(rate)||direction*rate<=0) return 'No clear trend toward goal yet';
  var weeksLeft=Math.abs((target-entries[entries.length-1].weight)/rate);
  if(!Number.isFinite(weeksLeft)||weeksLeft>260) return 'Trend is too slow to estimate';
  var eta=new Date(lastDate.getTime()+weeksLeft*604800000);
  return 'Estimated '+eta.toLocaleDateString([], {month:'short',year:'numeric'})+' · based on logged intake and weight trend';
}

function progressPlot(values, goal, unit) {
  if(!values.length) return '<div class="empty-note">Log data to see this trend.</div>';
  var unitLabel = unit || 'kg';
  var isReps = unitLabel === 'reps';
  var nums=values.map(function(v){return Number(v.value);}).concat(goal!=null?[goal]:[]);
  var rawMin=Math.min.apply(null,nums), rawMax=Math.max.apply(null,nums), rawSpan=rawMax-rawMin;
  var pad=rawSpan?Math.max(rawSpan*.18,.5):Math.max(Math.abs(rawMax)*.03,.5);
  var min=rawMin-pad, max=rawMax+pad, span=max-min||1;
  var points=values.map(function(v,i){var x=i/Math.max(1,values.length-1)*100,y=8+((max-v.value)/span)*84;return {x:x,y:y,v:v};});
  var poly=points.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');
  var first=values[0].value, last=values[values.length-1].value, delta=last-first;
  var deltaText=values.length>1?(delta===0?'No change':(delta>0?'+':'')+(isReps?Math.round(delta):delta.toFixed(1))+' '+unitLabel):'First entry';
  var labels=[values[0],values[Math.floor((values.length-1)/2)],values[values.length-1]].map(function(v){var raw=String(v.label||'').slice(0,10);return raw.replace(/^\\d{4}-/,'').replace('-','/');});
  var goalY=goal!=null?8+((max-goal)/span)*84:null;
  var goalLine=goalY!=null&&goalY>=0&&goalY<=100?'<div class="chart-goal" style="top:'+goalY+'%"><span>goal '+Number(goal).toFixed(1)+'</span></div>':'';
  var area=points.length>1?poly+' 100,100 0,100':'';
  return '<div class="plot-caption"><span>'+values.length+' point'+(values.length===1?'':'s')+'</span><b class="plot-change">'+deltaText+'</b></div>'
    +'<div class="plot-shell"><div class="plot-current">'+(isReps ? Math.round(last) + ' reps' : Number(last).toFixed(1) + ' kg')+'</div><div class="line-chart" aria-label="Trend from '+first+' to '+last+'"><span class="chart-max">'+(isReps ? Math.round(max) : max.toFixed(1))+'</span><span class="chart-min">'+(isReps ? Math.round(min) : min.toFixed(1))+'</span>'+goalLine
    +'<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="plotFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--amber)" stop-opacity=".28"/><stop offset="1" stop-color="var(--amber)" stop-opacity="0"/></linearGradient></defs>'
    
    +'<polyline points="'+poly+'" fill="none" stroke="#F5F5F4" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>'
    +points.map(function(p,i){return '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(i===points.length-1?'3':'2.2')+'" fill="'+(i===points.length-1?'var(--amber-light)':'var(--amber)')+'" stroke="var(--surface)" stroke-width="1"><title>'+esc(p.v.label||p.v.value)+'</title></circle>';}).join('')
    +'</svg></div><div class="plot-axis"><span>'+esc(labels[0])+'</span><span>'+esc(labels[1])+'</span><span>'+esc(labels[2])+'</span></div></div>';
}

function workoutHistoryHTML() {
  var sessions = getWorkoutSessions().filter(function(session) {
    return (session.exercises || []).some(function(exercise) {
      return (exercise.sets || []).some(Boolean);
    });
  }).reverse();
  if (!sessions.length) return '<div class="t-micro" style="padding:16px 0">No completed workouts yet.</div>';

  return sessions.map(function(session) {
    var exercises = session.exercises || [];
    var totalSets = exercises.reduce(function(count, ex) {
      return count + (ex.sets || []).filter(Boolean).length;
    }, 0);
    var dObj = session.dayKey ? new Date(session.dayKey + 'T00:00:00') : new Date();
    var dateStr = dObj.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
    var storedMeta = session.dayKey ? (dayRecord(session.dayKey).workoutMetaBySession || {}) : {};
    var matchingMeta = storedMeta[String(session.programDay)] || Object.keys(storedMeta).map(function(k){ return storedMeta[k]; }).find(function(m){ return m && (m.duration_sec != null || m.durationMinutes != null); });
    var durationSec = session.duration_sec != null ? Number(session.duration_sec) : (matchingMeta && (matchingMeta.duration_sec != null ? Number(matchingMeta.duration_sec) : Number(matchingMeta.durationMinutes)*60));
    var durStr = durationSec ? (Math.round(durationSec / 60) + ' min') : '';

    var cleanTitle = (session.programLabel || session.sessionLabel || 'Workout').replace(/^Day\s*\d+\s*[—–-]\s*/i, '');

    var exRows = exercises.map(function(exItem) {
      var exData = getExerciseData(exItem.id) || { name: exItem.id };
      var sets = (exItem.sets || []).filter(Boolean);
      var isBW = isBodyweightExercise(exItem.id, exData.name);
      var highestWeight = sets.reduce(function(m, s){ return Math.max(m, Number(s.weight) || 0); }, 0);
      var highestReps = sets.reduce(function(m, s){ return Math.max(m, Number(s.reps) || 0); }, 0);
      var bestText = isBW
        ? (highestWeight > 0 ? ('Best BW+' + highestWeight + ' kg') : ('Best ' + highestReps + ' reps'))
        : (highestWeight ? ('Best ' + highestWeight + ' kg') : (sets.length + ' sets'));

      var setLines = sets.map(function(s, idx) {
        var wDisp = isBW ? ((!s.weight || Number(s.weight) === 0) ? 'BW' : ('BW+' + s.weight)) : (s.weight + ' kg');
        return wDisp + ' × ' + s.reps + (s.rir != null ? (' · RIR ' + s.rir) : '');
      }).join(', ');

      return '<div style="padding:8px 0;border-bottom:1px solid var(--div)">'
        + '<div style="display:flex;justify-content:space-between;font-size:14px;color:var(--text)">'
          + '<span>' + esc(exData.name) + '</span>'
          + '<span class="t-micro">' + esc(bestText) + '</span>'
        + '</div>'
        + '<div class="t-micro" style="margin-top:2px">' + esc(setLines) + '</div>'
        + '</div>';
    }).join('');

    return '<details class="hist-item">'
      + '<summary class="hist-item-header" style="list-style:none">'
        + '<div>'
          + '<div class="t-micro">' + esc(dateStr) + '</div>'
          + '<div style="font-weight:600;font-size:15px;color:var(--text);margin-top:2px">' + esc(cleanTitle) + '</div>'
        + '</div>'
        + '<div style="display:flex;align-items:center;gap:10px">'
          + '<span style="font-size:13px;color:var(--text-secondary);font-variant-numeric:tabular-nums">' + (durStr ? durStr + ' · ' : '') + totalSets + ' sets</span>'
          + '<button type="button" class="btn-ghost" data-edit-workout-session="' + esc(session.id) + '" style="font-size:16px;padding:4px 8px;color:var(--text-muted)">···</button>'
        + '</div>'
      + '</summary>'
      + '<div style="padding:10px 0 4px">' + exRows + '</div>'
      + '</details>';
  }).join('');
}

function weightEntriesHTML(entries) {
  return entries.slice().reverse().slice(0,8).map(function(e){
    var label=new Date(e.createdAt||e.dayKey+'T12:00:00').toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    return '<div class="weight-entry-row"><span>'+label+' · <b>'+e.weight+' kg</b></span><span><button class="btn-ghost" data-edit-weight="'+esc(e.id)+'">Edit</button><button class="btn-ghost" data-delete-weight="'+esc(e.id)+'">Delete</button></span></div>';
  }).join('');
}

function editWeightEntry(id) {
  var entries = (profile && Array.isArray(profile.weightEntries)) ? profile.weightEntries : [];
  var entry=entries.find(function(e){return e.id===id;}); if(!entry) return;
  var value=prompt('Bodyweight in kg',entry.weight);
  if(value===null) return;
  var weight=parseFloat(value);
  if(!weight||weight<20||weight>300){showToast('Enter a valid weight','warn');return;}
  entry.weight=weight;
  sv('rg_profile',profile);
  if(entry.dayKey){var rec=dayRecord(entry.dayKey);rec.weight=weight;saveDayRecord(entry.dayKey,rec);}
  renderProgressSimple();
}

function deleteWeightEntry(id) {
  if(!confirm('Delete this weight entry?')) return;
  var entries = (profile && profile.weightEntries) || [], target = entries.find(function(e){return e.id===id;});
  profile.weightEntries=entries.filter(function(e){return e.id!==id;});
  if(target&&target.dayKey) {
    var sameDay=profile.weightEntries.filter(function(e){return e.dayKey===target.dayKey;}).sort(function(a,b){return String(a.createdAt).localeCompare(String(b.createdAt));});
    var rec=dayRecord(target.dayKey);
    rec.weight=sameDay.length?sameDay[sameDay.length-1].weight:null;
    saveDayRecord(target.dayKey,rec);
  }
  sv('rg_profile',profile);
  renderProgressSimple();
}


function deleteWorkoutSession(sessionId) {
  var store = workoutSessionStore();
  var session = store.sessions[sessionId];
  if (!session) {
    showToast('Session not found', 'warn');
    return;
  }
  var label = session.programLabel || session.sessionLabel || 'Workout';
  var dateStr = session.dayKey || 'recorded date';
  if (!confirm('Are you sure you want to delete "' + label + '" on ' + dateStr + '?\n\nThis will remove all logged sets for this workout.')) {
    return;
  }

  delete store.sessions[sessionId];
  sv(WORKOUT_SESSIONS_KEY, store);

  if (session.dayKey) {
    var rec = dayRecord(session.dayKey);
    if (session.exercises && Array.isArray(session.exercises)) {
      session.exercises.forEach(function(ex) {
        if (rec.workout && rec.workout[ex.id]) {
          delete rec.workout[ex.id];
        }
      });
    }
    if (rec.workoutMetaBySession && rec.workoutMetaBySession[String(session.programDay)]) {
      delete rec.workoutMetaBySession[String(session.programDay)];
    }
    var hasRemaining = Object.keys(rec.workout || {}).some(function(k){
      return (rec.workout[k] || []).some(Boolean);
    });
    if (!hasRemaining) {
      rec.workoutDone = false;
      rec.workout = {};
    }
    saveDayRecord(session.dayKey, rec);
  }

  showToast('Workout deleted successfully', 'ok');
  var activeNav = document.querySelector('.nav-btn.active');
  if (activeNav && activeNav.id === 'navHistory') renderHistory();
  else renderProgressSimple('lifts');
}

function openQuickEditSetModal(options) {

  var isBW = isBodyweightExercise(options.exId, options.exName);

  function renderQuickSheet() {
    overlay.innerHTML = '<div class="sheet quick-edit-sheet">'
      + '<div class="sheet-handle"></div>'
      + '<div class="quick-edit-title-row">'
        + '<div>'

          + '<div style="font-size:18px;font-weight:700;color:var(--text);margin-top:2px">Set ' + (options.setIndex + 1) + ' · ' + esc(options.exName || 'Lift') + '</div>'
        + '</div>'
        + '<button type="button" class="btn-ghost" id="quickCloseBtn" style="font-size:22px;line-height:1;padding:4px 8px;color:var(--text-muted)">✕</button>'

        + '<div style="display:flex;justify-content:space-between;align-items:center">'
          + '<span class="eyebrow">' + (isBW ? 'Added Weight (kg · 0 = Bodyweight Only)' : 'Weight (kg)') + '</span>'
          + '<span style="font-size:11px;color:var(--text-muted);font-family:\'Space Mono\',monospace">' + (isBW ? (curW <= 0 ? 'Current: Bodyweight (BW)' : 'Current: BW + ' + curW + ' kg') : ('Current: ' + curW + ' kg')) + '</span>'
        + '</div>'
        + '<div class="stepper-main">'
          + '<button type="button" class="stepper-btn" id="wDecBtn">−</button>'
          + '<input type="number" step="0.25" min="0" id="quickWeightInp" class="stepper-input" value="' + curW + '" placeholder="' + (isBW ? 'BW (0)' : 'kg') + '" inputmode="decimal">'
          + '<button type="button" class="stepper-btn" id="wIncBtn">+</button>'
        + '</div>'
        + '<div class="chips-stepper-row">'
          + (isBW ? '<button type="button" class="chip-adjust" data-set-bw="true" style="color:var(--sage-light);font-weight:700">BW (0)</button>' : '')
          + '<button type="button" class="chip-adjust" data-adj-w="-5">−5</button>'
          + '<button type="button" class="chip-adjust" data-adj-w="-2.5">−2.5</button>'
          + '<button type="button" class="chip-adjust" data-adj-w="1">+1</button>'
          + '<button type="button" class="chip-adjust" data-adj-w="2.5">+2.5</button>'
          + '<button type="button" class="chip-adjust" data-adj-w="5">+5</button>'
        + '</div>'
      + '</div>';

    // Event handlers
    var wInp = overlay.querySelector('#quickWeightInp');
    var rInp = overlay.querySelector('#quickRepsInp');

    overlay.querySelector('#quickCloseBtn').onclick = function() { overlay.remove(); };

    overlay.querySelector('#wDecBtn').onclick = function() {
      curW = Math.max(0, parseFloat((curW - 2.5).toFixed(2)));
      wInp.value = curW;
    };
    var bwBtn = overlay.querySelector('[data-set-bw]');
    if (bwBtn) {
      bwBtn.onclick = function() {
        curW = 0;
        wInp.value = 0;
      };
    }

    overlay.querySelector('#wIncBtn').onclick = function() {
      curW = parseFloat((curW + 2.5).toFixed(2));
      wInp.value = curW;
    };
    overlay.querySelectorAll('[data-adj-w]').forEach(function(b) {
      b.onclick = function() {
        var delta = parseFloat(b.dataset.adjW);
        curW = Math.max(0, parseFloat((curW + delta).toFixed(2)));
        wInp.value = curW;

  var curWeek = session.week || 1;

    var isSel = (curProgramDay === idx) || (session.programLabel === p.label);

      + '</div>'
      + '<button type="button" class="btn-ghost" id="closeDateDayModalBtn" style="font-size:22px;line-height:1;padding:4px 8px;color:var(--text-muted)">✕</button>'
    + '</div>'

    + '<div style="background:var(--surface-raised);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px">'
      + '<div style="margin-bottom:12px">'
        + '<label class="eyebrow" style="margin-bottom:4px">Workout Date</label>'

      + '</div>'
      + '<div style="margin-bottom:12px">'
        + '<label class="eyebrow" style="margin-bottom:4px">Workout Day / Split Routine</label>'
        + '<select id="modalEditDay" style="min-height:42px;height:42px;padding:6px 10px;font-size:13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%">'
          + progOptions
        + '</select>'
      + '</div>'
      + '<div>'
        + '<label class="eyebrow" style="margin-bottom:4px">Cycle Week</label>'
        + '<input type="number" min="1" max="100" id="modalEditWeek" value="' + curWeek + '" style="min-height:42px;height:42px;padding:6px 10px;font-size:14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:100%">'
      + '</div>'
    + '</div>'

    + '<div style="display:flex;gap:10px">'
      + '<button type="button" class="btn" id="cancelDateDayModalBtn" style="flex:1">Cancel</button>'
      + '<button type="button" class="btn btn-primary" id="saveDateDayModalBtn" style="flex:2">Save Date & Day</button>'
    + '</div>'
    + '</div>';

  overlay.querySelector('#closeDateDayModalBtn').onclick = function() { overlay.remove(); };
  overlay.querySelector('#cancelDateDayModalBtn').onclick = function() { overlay.remove(); };

  overlay.querySelector('#saveDateDayModalBtn').onclick = function() {
    var newDate = overlay.querySelector('#modalEditDate').value;
    var selectedProgIdx = parseInt(overlay.querySelector('#modalEditDay').value, 10);
    var newWeek = parseInt(overlay.querySelector('#modalEditWeek').value, 10);

    if (!newDate) {
      showToast('Please select a valid date', 'warn');
      return;
    }

    var oldDate = session.dayKey;
    session.dayKey = newDate;

    if (!isNaN(selectedProgIdx) && prog[selectedProgIdx]) {
      session.programDay = selectedProgIdx;
      session.programLabel = prog[selectedProgIdx].label;
      session.day = selectedProgIdx + 1;
    }

    if (!isNaN(newWeek) && newWeek > 0) {
      session.week = newWeek;
    }

    // Transfer workout data to new day record if date changed
    if (newDate !== oldDate) {
      var oldRec = dayRecord(oldDate);
      var newRec = dayRecord(newDate);
      newRec.workout = newRec.workout || {};
      (session.exercises || []).forEach(function(ex) {
        if (oldRec.workout && oldRec.workout[ex.id]) {
          newRec.workout[ex.id] = oldRec.workout[ex.id];
          delete oldRec.workout[ex.id];
        }
      });
      newRec.workoutDone = true;
      var oldRemaining = Object.keys(oldRec.workout || {}).some(function(k){
        return (oldRec.workout[k] || []).some(Boolean);
      });
      if (!oldRemaining) oldRec.workoutDone = false;
      saveDayRecord(newDate, newRec);
      saveDayRecord(oldDate, oldRec);
    }

    var oldSessionId = sessionId;
    var newSessionId = workoutSessionId(newDate, session.programDay);
    if (oldSessionId !== newSessionId) {
      delete store.sessions[oldSessionId];
      session.id = newSessionId;
    }
    store.sessions[newSessionId] = session;
    sv(WORKOUT_SESSIONS_KEY, store);
    overlay.remove();
    showToast('Workout date & day updated', 'ok');
    renderProgressSimple('lifts');
  };

  document.body.appendChild(overlay);
}

function openEditWorkoutSheet(sessionId) {

      id: ex.id,
      name: (getExerciseData(ex.id) || {}).name || ex.name || ex.id,
